<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ATP-EMTP 课程索引</title>
<style>
  :root{
    --bg:#F7F5F0; --surface:#FFFFFF; --surface-2:#FBF9F5;
    --ink:#1C1E26; --muted:#6B6F7B; --faint:#93979F;
    --line:#E2DED5; --line-2:#EFEBE3;
    --accent:#B4531A; --accent-soft:#F4E6D8; --on-accent:#FFFFFF;
    --mark:#FFDF9E; --mark-ink:#5A3B00; --cur:#FBEFD9;
    --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"DejaVu Sans Mono",monospace;
    --cjk:"PingFang SC","Microsoft YaHei","Hiragino Sans GB","Noto Sans CJK SC",system-ui,sans-serif;
    color-scheme:light dark;
  }
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]){
      --bg:#14161C; --surface:#1B1E26; --surface-2:#20242D;
      --ink:#E9E7E2; --muted:#9BA1AF; --faint:#6E7480;
      --line:#2B2F39; --line-2:#242831;
      --accent:#E08542; --accent-soft:#2F2318; --on-accent:#14161C;
      --mark:#6A5218; --mark-ink:#FFE8B8; --cur:#2A2318;
    }
  }
  :root[data-theme="dark"]{
    --bg:#14161C; --surface:#1B1E26; --surface-2:#20242D;
    --ink:#E9E7E2; --muted:#9BA1AF; --faint:#6E7480;
    --line:#2B2F39; --line-2:#242831;
    --accent:#E08542; --accent-soft:#2F2318; --on-accent:#14161C;
    --mark:#6A5218; --mark-ink:#FFE8B8; --cur:#2A2318;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{background:var(--bg);color:var(--ink);font-family:var(--cjk);font-size:15px;line-height:1.7}
  .wrap{max-width:1360px;margin:0 auto;padding-inline:16px}

  header.top{position:sticky;top:0;z-index:40;background:var(--bg);
    border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
  .brandrow{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;padding-block:11px 6px}
  .brand{font-family:var(--mono);font-weight:600;font-size:15px}
  .brand b{color:var(--accent)}
  .sub{color:var(--muted);font-size:12.5px}
  .searchbar{display:flex;gap:8px;padding-bottom:11px}
  #q{flex:1;min-width:0;font:inherit;font-size:16px;color:var(--ink);background:var(--surface);
     border:1px solid var(--line);border-radius:8px;padding:11px 13px;outline:none}
  #q:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
  .btn{font:inherit;font-size:13px;color:var(--muted);background:var(--surface);
       border:1px solid var(--line);border-radius:8px;padding:10px 12px;cursor:pointer}
  .btn:hover{color:var(--ink);border-color:var(--accent)}
  .btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

  .cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,460px);gap:20px;
        align-items:start;padding-block:14px 30px}
  @media (max-width:900px){ .cols{grid-template-columns:minmax(0,1fr)} .side{order:-1} }

  .chips{display:flex;gap:6px;flex-wrap:wrap;padding-block:0 12px}
  .chip{font-family:var(--mono);font-size:12px;color:var(--muted);background:var(--surface);
        border:1px solid var(--line);border-radius:999px;padding:4px 10px;cursor:pointer}
  .chip:hover{border-color:var(--accent);color:var(--ink)}
  .chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
  .chip .c{opacity:.6;margin-left:4px}
  .statline{font-family:var(--mono);font-size:12px;color:var(--faint);padding-bottom:10px}
  .statline b{color:var(--accent)}

  h2.sech{font-size:12.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;
          color:var(--faint);margin:18px 0 9px;font-family:var(--mono)}
  .topicgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:8px}
  .topic{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:9px;
         padding:10px 12px;cursor:pointer;font:inherit;color:var(--ink)}
  .topic:hover{border-color:var(--accent)}
  .topic .t{font-weight:600;font-size:14px}
  .topic .w{display:block;font-family:var(--mono);font-size:11px;color:var(--muted);margin-top:2px}

  .lecrow{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--line-2);
          cursor:pointer}
  .lecrow:hover{color:var(--accent)}
  .pnum{font-family:var(--mono);font-size:11px;color:var(--faint);min-width:34px;text-align:right;
        font-variant-numeric:tabular-nums}
  .lectitle{flex:1;min-width:0;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .lecdur{font-family:var(--mono);font-size:11px;color:var(--faint);font-variant-numeric:tabular-nums}

  .grp{background:var(--surface);border:1px solid var(--line);border-radius:10px;
       margin-bottom:12px;overflow:hidden}
  .grphead{display:flex;align-items:center;gap:9px;padding:9px 13px;background:var(--surface-2);
           border-bottom:1px solid var(--line)}
  .grphead .gt{flex:1;min-width:0;font-weight:600;font-size:13.5px;
               overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .gsec{font-size:11px;color:var(--faint);white-space:nowrap}
  @media (max-width:560px){.gsec{display:none}}
  .gn{font-family:var(--mono);font-size:11px;color:var(--accent);background:var(--accent-soft);
      border-radius:4px;padding:1px 6px}
  .hit{display:block;width:100%;text-align:left;background:none;border:0;
       border-top:1px solid var(--line-2);padding:9px 13px;cursor:pointer;color:inherit;font:inherit}
  .hit:first-of-type{border-top:0}
  .hit:hover{background:var(--surface-2)}
  .hit:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
  .hitmeta{display:flex;align-items:center;gap:9px;margin-bottom:3px}
  .tc{font-family:var(--mono);font-size:11.5px;color:var(--accent);font-variant-numeric:tabular-nums}
  .axis{flex:1;height:3px;background:var(--line-2);border-radius:2px;position:relative;min-width:40px}
  .axis i{position:absolute;top:-2px;width:3px;height:7px;background:var(--accent);border-radius:1px}
  .hittext{font-size:14px;line-height:1.65}
  mark{background:var(--mark);color:var(--mark-ink);border-radius:2px;padding:0 1px}

  .side{position:sticky;top:96px}
  @media (max-width:900px){ .side{position:static} }
  .player{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
  .frame{position:relative;width:100%;aspect-ratio:16/9;max-width:100%;background:#000}
  .frame iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
  .pinfo{padding:9px 12px;border-top:1px solid var(--line);display:flex;align-items:center;gap:8px}
  .pinfo .pt{flex:1;min-width:0;font-size:13px;font-weight:600;
             overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  a.play{font-family:var(--mono);font-size:11px;color:var(--accent);text-decoration:none;
         border:1px solid var(--line);border-radius:6px;padding:2px 7px;white-space:nowrap}
  a.play:hover{background:var(--accent-soft)}
  .noplayer{padding:26px 16px;text-align:center;color:var(--muted);font-size:13.5px}

  .script{margin-top:12px;background:var(--surface);border:1px solid var(--line);border-radius:10px;
          max-height:46vh;overflow-y:auto}
  .script .sh{position:sticky;top:0;background:var(--surface-2);border-bottom:1px solid var(--line);
              padding:7px 12px;font-family:var(--mono);font-size:11px;color:var(--muted)}
  .ln{display:flex;gap:9px;padding:5px 12px;cursor:pointer;border-bottom:1px solid var(--line-2)}
  .ln:hover{background:var(--surface-2)}
  .ln.cur{background:var(--cur)}
  .ln .lt{font-family:var(--mono);font-size:11px;color:var(--faint);min-width:42px;
          font-variant-numeric:tabular-nums}
  .ln .lx{flex:1;min-width:0;font-size:13.5px;line-height:1.6}

  .empty{text-align:center;color:var(--muted);padding:32px 8px}
  .empty .big{font-size:15px;color:var(--ink);margin-bottom:8px}
  .altbox{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-top:10px}
  footer{border-top:1px solid var(--line);color:var(--faint);font-size:12px;
         padding-block:15px 28px;line-height:1.8}
  footer a{color:var(--muted)}
  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<header class="top">
  <div class="wrap">
    <div class="brandrow">
      <span class="brand">ATP<b>·</b>EMTP 课程索引</span>
      <span class="sub">89 讲全文可检索 · 点击命中直接跳到视频那一刻</span>
    </div>
    <div class="searchbar">
      <input id="q" type="search" placeholder="搜讲课内容，如：潜供电流、伏秒特性、合闸电阻、MODELS" autocomplete="off" spellcheck="false">
      <button class="btn" id="theme" type="button" title="切换主题">◐</button>
    </div>
  </div>
</header>

<div class="wrap">
  <div class="cols">
    <main>
      <div class="chips" id="chips"></div>
      <div class="statline" id="stat"></div>
      <section id="panel"></section>
    </main>
    <aside class="side">
      <div class="player">
        <div id="frame" class="frame" hidden></div>
        <div id="noplayer" class="noplayer">点击左侧任一条结果<br>视频在这里从那一刻开始播</div>
        <div class="pinfo" id="pinfo" hidden>
          <span class="pt" id="ptitle"></span>
          <a class="play" id="pout" href="#" target="_blank" rel="noopener">B 站打开 ▸</a>
        </div>
      </div>
      <div class="script" id="script" hidden></div>
    </aside>
  </div>
  <footer>
    转写自 89 讲课程录音（约 21.9 万字），阿里百炼 qwen3-asr-flash + ATP 专业术语表识别，
    时间戳由 faster-whisper large-v3 对齐，为句级近似。专业术语仍可能有同音错字，请以视频画面为准。<br>
    视频源：<a href="https://www.bilibili.com/video/BV1EL4y1Y7Sa/" target="_blank" rel="noopener">B 站 BV1EL4y1Y7Sa</a>（UP主 云之阁），视频由 B 站承载播放。
  </footer>
</div>

<script>
(function(){
  "use strict";
  var raw=document.getElementById("data").textContent.trim();
  var D=JSON.parse(decodeURIComponent(escape(atob(raw))));
  var BV=D.bv, LEC=D.lec, GRP=D.groups, TOPICS=D.topics, ALT=D.alt;
  var qEl=document.getElementById("q"), panel=document.getElementById("panel"),
      stat=document.getElementById("stat"), chips=document.getElementById("chips"),
      frame=document.getElementById("frame"), noplayer=document.getElementById("noplayer"),
      pinfo=document.getElementById("pinfo"), ptitle=document.getElementById("ptitle"),
      pout=document.getElementById("pout"), scriptBox=document.getElementById("script");
  var gSel=null, curP=null, MAXG=40, MAXH=8;
  var byP={}; LEC.forEach(function(L){byP[L.p]=L;});

  function esc(s){return s.replace(/[&<>"]/g,function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}
  function mmss(t){var m=Math.floor(t/60),s=Math.floor(t%60);return m+":"+(s<10?"0":"")+s;}
  function biliUrl(p,t){return "https://www.bilibili.com/video/"+BV+"/?p="+p+"&t="+Math.max(0,Math.floor(t)-2);}
  function playerUrl(p,t){
    return "https://player.bilibili.com/player.html?bvid="+BV+"&page="+p
         + "&t="+Math.max(0,Math.floor(t)-2)+"&autoplay=0&danmaku=0";
  }

  // ---- 播放 ----
  function play(p,t){
    var L=byP[p]; if(!L) return;
    frame.innerHTML='<iframe src="'+playerUrl(p,t)+'" allowfullscreen '
      + 'referrerpolicy="no-referrer" title="'+esc(L.t)+'"></iframe>';
    frame.hidden=false; noplayer.hidden=true; pinfo.hidden=false;
    ptitle.textContent="P"+p+"  "+L.t;
    pout.href=biliUrl(p,t);
    curP=p; renderScript(L,t);
    if(window.innerWidth<=900) frame.scrollIntoView({behavior:"smooth",block:"start"});
  }
  // 只渲染当前播放位置前后各 WIN 行，不一次性铺开整讲讲稿
  var WIN=4;
  function renderScript(L,t){
    var cur=0;
    for(var i=0;i<L.s.length;i++) if(L.s[i][0]<=t) cur=i;
    var a=Math.max(0,cur-WIN), b=Math.min(L.s.length,cur+WIN+1);
    var h='<div class="sh">讲稿 · P'+L.p+' · '+(a+1)+'–'+b+' / '+L.s.length
        + ' 句 · 点任意一行跳到该处</div>';
    for(var j=a;j<b;j++){
      h+='<div class="ln'+(j===cur?" cur":"")+'" data-t="'+L.s[j][0]+'"><span class="lt">'
       + mmss(L.s[j][0])+'</span><span class="lx">'+esc(L.s[j][1])+'</span></div>';
    }
    scriptBox.innerHTML=h; scriptBox.hidden=false;
  }

  // ---- 章节筛选 ----
  GRP.forEach(function(g){
    var b=document.createElement("button");
    b.className="chip"; b.type="button"; b.setAttribute("aria-pressed","false");
    b.innerHTML=esc(g.n)+'<span class="c">'+g.c+"</span>";
    b.onclick=function(){
      gSel=(gSel===g.i)?null:g.i;
      [].forEach.call(chips.children,function(x){x.setAttribute("aria-pressed","false");});
      if(gSel!==null) b.setAttribute("aria-pressed","true");
      render();
    };
    chips.appendChild(b);
  });
  function gName(i){for(var k=0;k<GRP.length;k++) if(GRP[k].i===i) return GRP[k].n; return "";}

  // ---- 检索 ----
  function search(q){
    var out=[], ql=q.toLowerCase(), total=0;
    for(var i=0;i<LEC.length;i++){
      var L=LEC[i];
      if(gSel!==null && L.g!==gSel) continue;
      var hits=[];
      for(var j=0;j<L.s.length;j++)
        if(L.s[j][1].toLowerCase().indexOf(ql)>=0) hits.push(L.s[j]);
      if(hits.length){ total+=hits.length; out.push({L:L,hits:hits}); }
    }
    return {groups:out,total:total};
  }
  // 只渲染命中词前后各 PAD 个字，不输出整句
  var PAD=20;
  function snippet(txt,q){
    var lo=txt.toLowerCase(), k=lo.indexOf(q.toLowerCase());
    if(k<0) return esc(txt.slice(0,PAD*2))+(txt.length>PAD*2?"…":"");
    var a=Math.max(0,k-PAD), b=Math.min(txt.length,k+q.length+PAD);
    return (a>0?"…":"")+esc(txt.slice(a,k))
         + "<mark>"+esc(txt.slice(k,k+q.length))+"</mark>"
         + esc(txt.slice(k+q.length,b))+(b<txt.length?"…":"");
  }

  function render(){
    var q=qEl.value.trim();
    if(!q){ renderBrowse(); return; }
    var r=search(q);
    stat.innerHTML = r.total ? ("命中 <b>"+r.total+"</b> 处，分布在 <b>"+r.groups.length+"</b> 讲"
      +(gSel!==null?("（已筛选 "+esc(gName(gSel))+"）"):"")) : "";
    if(!r.total){ renderEmpty(q); return; }
    var h="";
    r.groups.slice(0,MAXG).forEach(function(g){
      h+='<div class="grp"><div class="grphead"><span class="gn">P'+g.L.p+'</span>'
       + '<span class="gt">'+esc(g.L.t)+'</span>'
       + '<span class="gsec">'+esc(gName(g.L.g))+'</span></div>';
      g.hits.slice(0,MAXH).forEach(function(s){
        var pct=Math.min(100,Math.max(0,s[0]/Math.max(g.L.d,1)*100));
        h+='<button class="hit" type="button" data-p="'+g.L.p+'" data-t="'+s[0]+'">'
         + '<span class="hitmeta"><span class="tc">'+mmss(s[0])+'</span>'
         + '<span class="axis"><i style="left:'+pct.toFixed(1)+'%"></i></span></span>'
         + '<span class="hittext">'+snippet(s[1],q)+'</span></button>';
      });
      if(g.hits.length>MAXH)
        h+='<button class="hit" type="button" data-p="'+g.L.p+'" data-t="'+g.hits[MAXH][0]+'">'
         + '<span class="hittext" style="color:var(--muted)">…另有 '+(g.hits.length-MAXH)
         + ' 处，点此跳到第 '+(MAXH+1)+' 处</span></button>';
      h+="</div>";
    });
    if(r.groups.length>MAXG) h+='<div class="statline">仅显示前 '+MAXG+' 讲，请缩小范围或用章节筛选。</div>';
    panel.innerHTML=h;
  }
  function renderEmpty(q){
    var key=null;
    for(var k in ALT) if(k.toLowerCase()===q.toLowerCase()){key=k;break;}
    var h='<div class="empty"><div class="big">没有找到「'+esc(q)+'」</div>';
    if(key && ALT[key].length){
      h+='<div>课程讲了这个内容，但用的是别的说法：</div><div class="altbox">';
      ALT[key].forEach(function(a){h+='<button class="chip" type="button" data-alt="'+esc(a)+'">'+esc(a)+'</button>';});
      h+='</div>';
    } else if(key){
      h+='<div>这一项课程<b>确实没有讲</b>。MODELS 的 COMBINE / DIFFEQ / ZFUN / backtime / histdef 等属于未讲解规则。</div>';
    } else { h+='<div>换个说法试试，或清空搜索框浏览主题。</div>'; }
    panel.innerHTML=h+"</div>";
  }
  function renderBrowse(){
    stat.innerHTML="共 <b>"+LEC.length+"</b> 讲，<b>"
      +LEC.reduce(function(a,b){return a+b.s.length;},0)+"</b> 个可检索句子";
    var h='<h2 class="sech">按主题入门</h2><div class="topicgrid">';
    TOPICS.forEach(function(t){
      h+='<button class="topic" type="button" data-alt="'+esc(t[0])+'"><span class="t">'
       + esc(t[0])+'</span><span class="w">'+esc(t[1])+'</span></button>';
    });
    h+='</div>';
    GRP.forEach(function(g){
      if(gSel!==null && g.i!==gSel) return;
      h+='<h2 class="sech">'+esc(g.n)+' · '+g.c+' 讲</h2>';
      LEC.forEach(function(L){
        if(L.g!==g.i) return;
        h+='<div class="lecrow" data-p="'+L.p+'" data-t="0"><span class="pnum">P'+L.p+'</span>'
         + '<span class="lectitle">'+esc(L.t)+'</span>'
         + '<span class="lecdur">'+mmss(L.d)+'</span></div>';
      });
    });
    panel.innerHTML=h;
  }

  panel.addEventListener("click",function(e){
    var a=e.target.closest("[data-alt]");
    if(a){ qEl.value=a.getAttribute("data-alt"); render(); qEl.focus();
           window.scrollTo({top:0,behavior:"smooth"}); return; }
    var b=e.target.closest("[data-p]");
    if(b) play(+b.getAttribute("data-p"), +b.getAttribute("data-t"));
  });
  scriptBox.addEventListener("click",function(e){
    var l=e.target.closest(".ln");
    if(l && curP) play(curP, +l.getAttribute("data-t"));
  });
  var timer=null;
  qEl.addEventListener("input",function(){clearTimeout(timer);timer=setTimeout(render,90);});

  document.getElementById("theme").onclick=function(){
    var cur=document.documentElement.getAttribute("data-theme");
    var next=cur==="dark"?"light":cur==="light"?"dark"
      :(matchMedia("(prefers-color-scheme:dark)").matches?"light":"dark");
    document.documentElement.setAttribute("data-theme",next);
    try{localStorage.setItem("atp-theme",next);}catch(err){}
  };
  try{var sv=localStorage.getItem("atp-theme");
      if(sv) document.documentElement.setAttribute("data-theme",sv);}catch(err){}

  render();
})();
</script>
</body>
</html>
