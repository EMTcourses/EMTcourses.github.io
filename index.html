闸统计过电压。"],[409,"下面我们把 u 零更换为负初值电源，其实这两种电源内负初值没有很明显的区别，只是负初值电源使用起来稍微方便一点。"],[428,"选择残余电荷电源，这是负初值电源的另外一种说法。"],[445,"它只有两个数据，一个是幅值，一个是频率。"],[452,"幅值我们取33kv的70%，也就是240kv。"],[460,"它的频率缺省值是0.001，相当于是直流电源。"],[471,"因为这是单相电源，我们选择和 a 相连接，也就是给 a 相负初值。"],[488,"现在我们再来看输电线路，这四段输电线路都是50km，我们把左一半和右一半的都合并，变成100km。"],[516,"它的参数在这，这是它的整体布局。"],[524,"没有换位，选择自动合并导线数，考虑肌肤效应，它只有一根地线。"],[538,"没有选择分段节点，那就说明它是逐级接地的。"],[545,"在暂态计算的时候，一般这个地方要选择时变换矩阵。"],[551,"在模型区域我们选择 Gama T 模型，也就是参数随频率变化模型。"],[559,"Gama T 模型的初始频率是0.05hz。"],[565,"它的最高频率由这个数字来决定，我们取的六表示总共频率范围是六个10倍频，那么最大的频率范围就是5×10的四次方赫兹。"],[582,"在每个10倍频取10个频率计算点。"],[587,"在 Gama T 模型拟合的时候，需要选择某一频率之下的变换矩阵，我们选的是5000hz下的变换矩阵。"],[603,"这是进行稳态计算的频率，50hz。"],[608,"点击 Run ATP 建立模型。"],[613,"点击 Verify，我们看看建立的模型和真实π模型之间的差距。"],[625,"它这个地方提醒要重新运行一次 Run ATP。"],[631,"在 Select 区域选择第一项线路模型频率扫描。"],[645,"它的最低频率我们也是选0.05hz，最高频率选5×10的四次方赫兹。"],[655,"每个10倍频也是10个点。"],[660,"点击 OK。"],[662,"在这个图中，对我们刚才建立的阶马器模型和准确π模型的。"],[672,"短路阻抗进行比较，蓝颜色呢是我们建立的阶马器模型，红颜色呢是准确π模型，我们现在比较的是。"],[684,"第一项的连续阻抗，它们两个还是吻合的比较好。"],[692,"这是第一项的正序阻抗。"],[697,"我们再来看看第二项，这是第二项的正序阻抗和。"],[705,"第二项的连续阻抗，在频率比较低的这一段，它们有一定的差异。"],[713,"这种差异是因为准确π模型和线路的阶马器模型计算的时候，它们所使用的线路对接导纳不同所导致。"],[727,"线路的对接导纳不是一个计算值，而是人工选择的一个数值。"],[733,"当频率增大到一赫兹及其以上时，阶马器模型和准确π模型吻合的相当好。"],[741,"现在我们把中间点左端和右端的两段线路分别合并为一段，最简单就是进行拷贝。"],[753,"现在输出的是线路中间点的电压，线路首端和末端避雷器的功率和吸收的能量。"],[772,"我们再增加一组输出量，线路末端的电压。"],[779,"首先不进行统计计算，只进行一次三相合闸计算。"],[788,"把这一部分可以隐藏。"],[795,"添加一个三相开关。"],[799,"三相开关的合闸时间是0.008s。"],[810,"0.001s和0.01s。"],[822,"在这种情况下，取消统计研究这个选项。"],[833,"总共计算三个周波，步长是10的负四次方。"],[846,"现在我们来看计算结果，plot一，是线路中间a b c三相的电压，plot二是线路末端三相的电压，都是a相电压有最大值。"],[868,"我们在plot三中，把线路中间和线路末端的a相电压的曲线放在一起，很明显能看出线路中间的电压要大于线路末端的电压，一般情况下都是这样的。"],[888,"我们再来看避雷器吸收的功率和能量，在左端的变量列表中，如果最前面是p，表示是功率，最前面是e，表示是能量。"],[906,"我们先来看末端避雷器的功率，从这个图上很明显看出，只有a相的避雷器动作了，c相避雷器中只有一点点功率。"],[921,"其实我们说避雷器动作，这是沿用了阀式避雷器的说法。"],[928,"对于氧化锌避雷器来说，它内部没有放电间隙，说它动作准确的说是不太正确的，但大家习惯上都这么说。"],[941,"再加入末端避雷器吸收的能量，由于它们数值的数量级不相同，能量的曲线看不到，我们把能量的纵坐标放到右边，进行局部放大。"],[970,"这是a相避雷器的功率，这是a相避雷器吸收的能量。"],[977,"嗯，另外我们还可以看出，c相的避雷器在这个地方稍有一点点动作，这是它的功率，这是它的能量。"],[989,"嗯，类似的。"],[990,"我们在 plotter 中，绘出首端避雷器的功率和吸收的能量，就可以和末端避雷器的情况进行直观的对比。"],[1001,"很显然，末端避雷器吸收的能量要远远高于首端避雷器吸收的能量。"]]},{"p":48,"t":"9.2 架空输电线路上合闸过电压的统计计算2_统计计算参数设置","d":628,"s":[[0,"大家好，在上期算例的基础上，我们继续介绍架空输电线路上合闸过电压的统计计算。"],[11,"在上期的视频中，我们介绍了算例中各元件的简单情况，进行了一次合闸计算。"],[22,"在本期的视频中，将要介绍统计计算的设置。"],[28,"首先，我们按照教科书中的内容来设置统计合闸开关。"],[34,"这个开关虽然我们已经在这设计好了，但是为了让大家学习明白整个设置过程，我们还要重新设置一次。"],[43,"我们将用两种方法来设置统计开关的时间参数。"],[50,"第一种和教科书中的一致，三相统计开关的合闸时间都服从高斯分布。"],[59,"第二种，a相开关的合闸时间服从高斯分布，其他两项的合闸时间服从均匀分布。"],[68,"下面我们分别来说明。"],[71,"点击鼠标右键，在开关选项中选统计开关，这是a相开关。"],[83,"把a相开关作为主开关，b、c相开关的时间与a相是有一定关系的，我们即将进行合闸，选择高斯分布，合闸的平均时刻为0.035s，也就是35ms，它的标准差为0.002s，即两毫秒。"],[112,"接下来我们设置b相开关的时间参数，把这个元件我们进行拷贝。"],[120,"b相开关选择从开关，它也是进行和操作，合闸时刻服从高斯分布。"],[139,"这个t是它的合闸平均时刻滞后于主开关合闸平均时刻的值，而这个第一位是这个滞后值的标准差，它并不是b相开关的合闸时刻的标准差。"],[160,"按照参考书，这两个值分别取为0.00666s和0.002s。"],[169,"如果对这两个参数的含义不明确，大家可以看帮助。"],[177,"点击 OK 之后，我们发现 B 相的图标发生了变化，它多了两个节点，这两个节点分别要连接主开关的两个节点。"],[191,"现在我们来设置 C 相开关，把 B 相开关进行拷贝。"],[199,"仅仅需要把其中的这个数据三个六改成三个三就可以。"],[208,"这个节点和这个节点也要连接 A 相开关的两个节点。"],[220,"现在我们把开关 A B C 相从上到下排列，我们先选择一个分相连接器，直接从这儿拷贝。"],[237,"把分相连接器和开关的主连接节点进行连接，最方便的连接点是 B 相。"],[252,"A 相我们这么连接，C 相连接。"],[259,"现在 B 相和 C 相的辅助连接点需要和 A 相的主连接点相连。"],[269,"连接 B 相比较简单，但是对 C 相来说，这么连接显得有点凌乱，所以我们用这种方式把它连接。"],[288,"开关所有左端的连接点都连接好了，类似的可以连接右端的所有连接点。"],[300,"这个样子和参考书上的连接的样子看起来略有不同，连接关系其实是完全相同的。"],[310,"我们把它连接到电路中间。"],[315,"整个电路就连接好了。"],[325,"现在我们设置统计计算使用的综合参数。"],[332,"选择统计分析，右边的这些参数都不管，我们进行400次统计合闸。"],[351,"这些参数大家可能都记不住它的含义，需要的时候打开帮助文件。"],[360,"RSW，如果选一，输出所有的合闸或者分闸事件，这个我们需要。"],[372,"RTEST，额外的延时，这个我们不需要。"],[381,"这几个参数大家自己看相关的解释。"],[385,"最后一个参数 NSEED，如果你要进行多次统计合闸，而且每次统计合闸的开关的随机合或者分的时间是一样的，有这个参数来选择。"],[402,"选择一，每次统计合闸或者分闸的时间参数是相同的。"],[411,"为了比较多次仿真的结果，我们把这个参数选为一。"],[416,"现在我们对输出进行设置。"],[421,"变电器，我们设置输出它的功率和能量，其实我们关心的是它的能量，但是它这个功率和能量是合并输出的。"],[438,"对这个是同样的，我们还输出了线路中间点的电压和线路末端的电压。"],[449,"我们再来看 output 输出管理，在这个列表中列出了所有的输出的变量。"],[462,"但并不是所有的量我们都需要进行统计输出，在 ON 这个地方选择打勾就表示统计输出，不选择打勾就在统计输出中没有它。"],[475,"我们先来看电压，电压列表在中间这一片，线路中间的三个点和线路末端的三个点。"],[487,"给统计电压取基数343 000伏，统计输出的电压就是以34300为基准值的标幺值。"],[498,"把线路中间点的三相电压放为第一组，把线路末端三相电压放为第二组。"],[516,"现在我们看避雷器吸收的能量，同样我们用1×10的六次方，也就是一兆焦为基准，把它进行标幺化，这样避雷器的吸收能量数值看起来简单明了。"],[536,"把线路首端避雷器的吸收能量放入第三组，把线路末端避雷器吸收的能量放入第四组。"],[546,"另外线路首末端避雷器的功率不进行统计输出，所以在相应的 on 这个位置上不进行打勾。"],[557,"在 ATPDraw中新增加了一个 models 元件，能够对输出进行一些比较简单的统计输出，但是这个元件的功能不完善，为了让大家关注这个元件的后续开发，我们还是把这个元件连接在电路中。"],[583,"这个元件是 right monte carlo。"],[593,"我们只选择线路中间点的电压，用这个元件统计输出。"],[602,"点击它的左端点，这个地方选择 input voltage 输入电压。"],[613,"注意它的这个端点看起来像三相，连接的线条也是粗线条，但是实际上它仅仅对一项进行统计。"]]},{"p":49,"t":"9.3 架空输电线路上合闸过电压的统计计算3_统计计算","d":836,"s":[[1,"大家好，我们继续介绍架空输电线路上合闸过电压的统计计算。"],[8,"在本期视频中，我们介绍统计计算，即对开关进行几百次的合闸。"],[19,"把 tmax 改为00:08，因为开关 A 的平均合闸时间是0.035，这样保证在整个仿真时间内，过电压能够达到最大值。"],[39,"再把计算的步长缩短一半，5×10的负五次方秒，在每个周波计算400步。"],[51,"计算结束，现在我们来看计算结果。"],[55,"首先我们看 ratemulti color 对中间点 A 相电压的统计结果。"],[64,"点击 help 可以看到这几个参数的帮助信息，真正打开的是这几个 models 元件的程序内容。"],[79,"在 models 的程序中，两个减号后面的内容是注释，通常开发者会把变量的注释放在变量的后面。"],[91,"resolution 计算这个电压值概率分布曲线的点数，plurality 如果是选零，取绝对值的最大值，如果只选负一，它是只取负值的最大值，如果选正一，只对正值取最大值。"],[117,"tlimit 这个变量是一个时间参数，表示在 tlimit 这个时间之后才开始找最大值。"],[128,"withstand 内受电压值，用来计算内受概率。"],[135,"idx 这个你可以给也可以不给，不影响 ATP 内部进行管理这个参数，它是为了识别不同的这种 models 元件。"],[147,"把内受电压取为650kv，现在看看过电压的分布，超过650kv的概率是0.022。"],[164,"点击 OK。"],[167,"我们就看到过电压的分布概率曲线，横坐标是电压值，纵坐标是概率。"],[176,"下面我们打开计算的结果 lis 文件。"],[183,"在 lis 文件中，除了我们今天要介绍的信息之外，还有其他大量的非常有用的信息。"],[194,"想要深入了解电磁暂态过程，一定要了解这个文件的结构和内容。"],[200,"前面这部分就是输入数据的重复。"],[205,"这个地方是对输出变量的一些解释。"],[212,"前面的12个输出变量是电网的电压差，接着六个输出是支路电流，支路功率消耗被视为支路电压，支路能量消耗，也就是我们常说的吸收的能量，被视为支路电流。"],[234,"我们按倒过来的次序来说，这六个量是支路电流和吸收的能量。"],[243,"在此之前的12个量都是支路电压和功率。"],[250,"在我们这个输出中没有电流，这个六个量全都是变压器吸收的能量。"],[256,"这是在计算的第1000步输出的这18个量的数据。"],[263,"这个是那个 model 的原件，，Monte Carlo 他写的东西，这是最大和最小值以及对应的时间。"],[279,"这是文件后面的内容。"],[287,"这是第400次计算的合闸时刻，从这个地方开始进行统计，首先统计的是节点电压。"],[297,"线路中间点的三相电压，我们起的节点名称是 mid a、b 和 c。"],[306,"这是 a 相的统计情况，这是 b 相的，这是 c 相的，因为我们把这三个节点电压分为一个组，所以把它们三个合起来还有一个统计。"],[323,"接下来是另外一组节点电压的统计，这是末端三相节点的名称。"],[333,"这是A相的统计，B相电压统计，C相电压的统计。"],[341,"同样这三项是一组，它们合起来还有一个统计。"],[346,"之后是支路能量的统计，其实就是首端避雷器和末端避雷器吸收的能量统计。"],[359,"它先出现的是首端的三相避雷器，这个统计它仅仅有一个间隔。"],[367,"如果想要多个间隔，目前 ATPDraw 没有这个功能，我们将手动修改 ATP 的输入文件，增加一行数据。"],[380,"B 相的情况和 C 相的情况都是一样的，这是三相避雷器吸收能量合起来的统计。"],[388,"接下来的统计是关于末端避雷器的吸收能量，统计间隔要多一些。"],[399,"但是我们还可以看到，在第一个间隔它出现了300多次，后面的就少了，所以这种情况其实也不是我们想要的情况。"],[412,"这是 B 相的和这是 C 相的统计结果，统计的间隔也有类似的情况，这是三相避雷器合起来的统计情况。"],[422,"我们打开 ATP 的输入文件，对输入文件中关于避雷器吸收能量统计间隔的个数进行修改。"],[434,"如果读者对这部分不感兴趣或者认为有点难度，可以忽略这一部分内容。"],[442,"到有关统计的数据行，这一行是线路中间点电压的统计请求。"],[452,"这一行是线路末端电压的统计请求。"],[457,"这一行是线路首端避雷器吸收能量的统计请求。"],[463,"我们在这一行前面加这么一行数据，经过计算以后，避雷器吸收能量的统计间隔就是15个。"],[473,"现在我们来看修改后的结果，这是线路首端 A 相避雷器吸收能量的统计结果，是严格的15个统计间隔。"],[488,"有一点需要注意，这个地方的标值的基准不是前面我们在 output 输出管理器中选择的一兆，而是各项各不相同。"],[502,"A相的基准值是这个值。"],[508,"对B相，它又变成了这个值。"],[513,"所以在这种情况下，我们绘图的时候，不要采用标幺值来绘图，而是用有名值来绘图。"],[522,"从这些数据上看，概率分布很不直观，我们常常习惯于把它们绘成图。"],[530,"下面我们把线路中间点A相避雷器的电压绘成它的概率曲线。"],[538,"拷贝这一部分数据，打开Excel，用Excel的文件导入向导，把数据导入Excel中。"],[549,"我们绘制标幺值的概率曲线，把这一列删掉，然后把这两列数据拷入到Origin中。"],[563,"绘图。"],[566,"这就是线路中间A相在400次统计和杂中的电压分布。"],[578,"严格的来说，这不是概率分布，是频次分布。"],[584,"下面我们再来看合闸时刻的分布曲线。"],[589,"遗憾的是，在ATP或者ATPDraw中都没有提供这个功能，所以我们要自己绘制这个曲线。"],[601,"好在是ATP输出的合闸时刻，它前面一个很明显的特征，一长串空格出现个一，然后又有两三个空格，之后是断路器的合闸时刻。"],[616,"所以我们可以用前面的这个特征来进行全文搜索，把所有的包含合闸时刻的数据行放在一个文件中。"],[628,"下面我们来搜索包含合闸时刻的数据行。"],[635,"点击搜索，这一个特征字符串会自动出现在这。"],[644,"查找。"],[646,"总共搜到了400行数据，对应于400次合闸。"],[656,"把断路器的合闸时刻数据拷贝到Excel中。"],[660,"三相断路器的合闸时刻有一个最大值，也有一个最小值，用这个最大值减去这个最小值。"],[670,"就是三相合闸不同期时间。"],[673,"把这些数据拷入 Origin 中进行绘图。"],[685,"统计图，多面板的直方图。"],[692,"这是绘图结果，从下到上依次是 A B C 相合闸时刻的分布，第13项开关合闸不同期时间的分布，最大值已经达到0.013675s，粗算就是14ms，这个数值超过了国家标准的要求。"],[719,"在标准 D L 615和 D L 728中，对断路器三相合闸不同期的时间的规定都是不得大于五毫秒。"],[731,"所以我们要对三相断路器的合闸时间参数以及统计规律进行修改。"],[739,"对于开关 A 相，不更改它的设置，还是高斯分布，两个时间参数保持原值不变。"],[749,"对于 B 相和 C 相开关的合闸时间，它们都取相同的均匀分布，t 值即它们的平均值滞后于 A 相平均值的时间，取2.5ms，即0.0025s，t 值的范围从零毫秒到五毫秒，因为是均匀分布，可以算出它们的均方差，第一位等于0.001443s。"],[786,"按照与前面相同的过程，绘制合闸时刻分布情况。"],[792,"像左边的这个图，从下到上依次是 A B C 相开关合闸时刻的分布情况，能看出来它们都是正态分布。"],[803,"右边是不同期时间的分布情况，中间两幅图是 B C 相合闸时刻滞后于 A 相合闸时刻的分布，都是均匀分布，与我们设置的情况是一致的。"],[821,"最上面的是 B C 两项合闸时刻之差的分布，有正有负。"],[828,"最下面的是三相不同期的分布，它的最大值是五毫秒。"]]},{"p":50,"t":"9.4 架空输电线路上合闸过电压的统计计算4_高抗励磁特性设置","d":646,"s":[[1,"大家好，在前面几期视频的基础上，我们继续介绍架空输电线路上合闸过电压的统计计算。"],[12,"本期视频介绍高压电抗器的非线性励磁特性计算。"],[19,"这是在上期视频中介绍输电线路的合闸统计过电压的一个算例，输电线路长度是200km。"],[28,"在本期视频中，我们不关心线路中间点的电压，所以我们把相关的测量元件删掉，把两段线路合为一段。"],[44,"不修改其他参数，点击 verify，我们根据输电线路的充电功率来配置高压并联电抗器。"],[64,"它要求运行 ATP 计算线路参数，点击 yes，在 select 区域选择工频计算，频率是50hz，这是线电压400kv。"],[84,"OK。"],[86,"从左到右依次是线路的零序电阻、零序电抗、正序电阻、正序电抗、零序充电功率和正序充电功率。"],[102,"初学者可以对这些数据进行验证。"],[106,"下面进行简单演示，选择π模型。"],[113,"选择这几项，选择其中的某一项电容输出，计算结果中就有线路的正序和零序参数。"],[129,"到底选择哪一项？"],[131,"这是 ATPDraw内部的一个随机选择，为了简单省事，把四个全都选择，把频率改为50hz。"],[143,"点击 run ATP 计算线路参数。"],[149,"现在看线路参数的 LIS 文件，C 下划线400点 LIS。"],[158,"LIS 文件前面的这些内容我们不关注，直接向后走，找到线路的序参数。"],[169,"这一块参数是线路的虚参数。"],[175,"波阻抗、衰减系数、波速、波长、单位长度电阻、电抗和电纳。"],[190,"把在 verify 和 lis 文件中计算的线路虚阻抗参数放在一起进行比较，可以看出 lis 文件中线路的阻抗乘以线路的长度两倍，就是 verify 中的线路的虚阻抗。"],[217,"仔细观察，其实两者之间略有差异。"],[223,"以连续电阻为例，把 lis 文件中的连续电阻乘以二倍，它的结果是44.37，但是在 verify 中它是46.21。"],[240,"现在看正序充电功率，它的计算公式是这样的，单位长度的正序电纳乘以线路长度，再乘以线电压的平方，等于114.9兆法。"],[260,"在 verify 中这个数据是116.4，略有差异。"],[267,"这种差异很小，不会影响计算结果，在一般的计算中可以直接应用 verify 的数据。"],[277,"线路的正序充电功率是116.4兆法，需要在线路上加并联电抗器来补偿这个充电功率。"],[289,"注意，并联电抗器的容量并不是可以随意取代，因为并联电抗器是大型高压设备，在工程上有系列产品便于制造。"],[303,"为了防止谐振，线路的电容即线路的充电功率也不能被全部补偿。"],[312,"在这个算例中，我们取并联电抗器的容量为100兆法，补偿度等于85.9%。"],[323,"电抗器的电抗值为1600欧姆，对应的电感为5.093亨。"],[329,"因为电抗器的容量比较大，把它安装在线路的两侧。"],[336,"每侧电抗器的电抗值是3200欧姆，电感为10.186亨。"],[344,"在工程上也把并联电抗器叫做高抗。"],[351,"对于安装在输电线路上的高抗，一般要配置中性点小电抗，以限制潜供电流。"],[360,"根据经验，中性点小电抗的电抗值约为高抗的1/3到1/2。"],[370,"在我们这个算例中，中性点小电抗的电抗值取为高抗的1/2.5，也就是4.0744亨。"],[380,"请大家自行验证，这个小电抗值能不能把潜供电流限制到要求值以下。"],[389,"高抗是非线性电感，在电磁暂态计算中，一般要考虑非线性电感的非线性特性。"],[399,"而在稳态计算中，往往不考虑这种非线性特性。"],[405,"国标23753对电抗器的非线性特性有规定。"],[412,"规定中没有400kv电抗器的参数，我们可以参照330千伏电抗器的参数来设置。"],[425,"它是这样规定的：在1.5倍额定电压及以下，电抗器磁化特性曲线应接近线性。"],[435,"1.4倍额定电压与1.7倍额定电压两点连线的斜率应不低于线性部分斜率的50%。"],[448,"把国标的要求画成 i-phi 曲线，就是这样的。"],[454,"这个点是额定电压下的电流和磁通。"],[462,"磁化曲线第一段的斜率是 l 一，这条直线一直延伸到1.5倍。"],[471,"第二段 i-phi 特性，关键是要确定这个点。"],[476,"在标准中要求从1.4倍到1.7倍的额定电压的时候，磁化曲线的斜率不得小于0.5倍的 l 一，我们就取等于0.5倍 l 一，画出这么一条直线，相交于1.7倍的磁通水平线。"],[496,"然后把这个点和1.5倍的点连接，就得到第二段励磁特性。"],[505,"计算结果是这样的，这个交点的电流刚好是二倍的IR，即二倍的额定电流。"],[517,"这一段的斜率是0.4倍的L一，这个斜率我们在建立模型的时候用不上，这个电流值和磁通值是用得上的。"],[531,"最后对电抗的这个非线性磁化曲线进行总结，它有两段，第一段的斜率是L一，第二段的斜率是0.4L一。"],[545,"在建立模型的时候要用到三个点的数据，额定点，1.5倍的，还有这一个点。"],[554,"下面我们要计算这三个点六个数据，实际上只要计算这第一个点的两个数据，后面两个点的四个数据通过乘以相应的系数就可以得到。"],[568,"这是额定点的电流和磁通的计算以及数据，这是所有三个点的电流和磁通数据。"],[577,"现在我们给线路两端添加并联电抗器，选择非线性的电感，98型，输入或者拷贝刚才计算的励磁特性，把励磁特性第一点的电流值赋给R二零，第一点的磁通值赋给Φ二零。"],[601,"把这个点三相短接，给中性点加小电抗，小电抗是线性的，它的电抗值是4074.4毫亨，把它下端接地。"],[632,"这是首端的，把它拷贝到末端。"]]},{"p":51,"t":"9.5 架空输电线路上合闸过电压的统计计算5_残压电荷设置","d":587,"s":[[0,"大家好，在前期视频的基础上，我们继续介绍在电磁暂态计算中如何设置线路的初始电压。"],[14,"这是前一期视频中我们使用到的算例。"],[18,"为了方便，我们先把电源部分和线路开关部分都隐藏掉，只看线路部分以及给线路赋初值的初值电源。"],[31,"打开初值电源，它其实是一个交流电源，幅值是240kv，频率是0.001hz。"],[42,"在零时刻以前，初值电源连接线路的 a 相，整个系统达到稳态。"],[52,"我们首先进行一次稳态计算，tmax 取任何一个负值，按 F 二。"],[59,"现在我们来看计算结果。"],[62,"类似文件的前面的部分我们直接越过，这是线路末端三相电压、幅值、相角，它们都和设置的值是一致的。"],[75,"在零时刻，这个电源被断开，线路获得初值，系统进入暂态过程。"],[82,"同样按 F 二进行计算，我们看计算的结果。"],[87,"但是这次计算没有顺利进行，提示信息的主要内容是迭代避雷器的时候没有收敛。"],[98,"一个可能的原因是避雷器的伏安特性用了过多的数值，伏安特性的段数过多。"],[106,"避雷器的特性用了九个点，一般情况下用3~4个点就可以了。"],[115,"ATPDraw 会把这个特性拟合为指数形式，指数形式它也是分段的。"],[125,"我们在 ATPDraw 生成的输入文件中看它生成了多少段的指数形式。"],[132,"在 ATPDraw 的输入文件中，我们找到避雷器模型，拟合为指数形式后，避雷器还有1234 566段，稍微有点多。"],[147,"删除避雷器伏安特性中的五个点，保留四个点，这是删除之后的避雷器伏安特性曲线。"],[158,"图中从左到右分别是用九点和四点表示的避雷器的伏安特性。"],[166,"右图中的这种近似在工程上是允许的。"],[171,"我们再进行计算，计算得以顺利完成，在LIS文件中也没有看到出错的信息，也有最终的计算结果，好像是这个问题我们解决了，但实际上不是这样的。"],[188,"我们再来看电压曲线，这是线路末端三相电压曲线，我们先来看A相。"],[195,"A相电压从初始值240kv迅速减小到接近-900kv，B相和C相刚开始的时候是从A相感应的电压，这个值比较小，但是它也迅速增加到将近800kv。"],[218,"暂态过程刚开始很短一段时间内的曲线放大，我们再来看看细节。"],[225,"这是一相相电压在初始值迅速变到了这个值，B、C相电压也是从初始值迅速增加为比较大的一个正值。"],[238,"在零时刻后一两个步长，电压的数值发生了突然的巨变，之后电压波形的走势也不正确。"],[248,"现在我们把线路两端的并联电抗器撤掉，再进行暂态计算，我们看计算的波形。"],[259,"在零时刻，A、B、C相获得电压初值，随后随着时间的推移，电压逐渐下降，这符合我们的预期。"],[271,"所以在前面的这个例子中出问题的不是避雷器，而是初值电源。"],[279,"初值电源可以给不带并联电抗器的线路赋初值，但是如果线路有了并联电抗器，用初值电源给线路赋初值，计算会发生错误。"],[292,"通过这个例子提醒大家，进行第二次暂态计算，一需理解LIS文件的内容，二如果你是进行统计计算，在计算之前必须进行一次暂态计算，看计算的数据和波形是否达到预期。"],[313,"在以前的视频中我们说过，有两种方法可以赋初值，一利用赋初值电源，二利用一个普通的交流电压源。"],[326,"现在第一种方法在我们这个例子中不能用，我们就用第二种方法来给线路进行赋初值。"],[335,"删掉这个电源。"],[339,"增加一个交流电压源。"],[344,"电压源的幅值我们还是暂时取240kv，初相角暂时取为零。"],[353,"在电压源前面加一个开关。"],[361,"这个开关的合闸时间一般是一个负值，表示在零时刻之前它已经合闸。"],[369,"关于它的打开时间，在我们这个算例中要小于统计断路器的合闸时间，我们取0.002，也就是二毫秒。"],[380,"恢复线路两端的电抗器。"],[385,"Tmax取任意一个负值进行一次稳态计算。"],[392,"注意进行稳态计算的时候，这个开关处于合闸状态，因为它的合闸时间是负值，也就是说右端的这个电源与电路连接。"],[404,"在进行稳态计算的时候，电抗器是连接在电路中的，但是避雷器被忽略。"],[412,"这是线路末端的稳态电压。"],[418,"A相的稳态电压也就是线路右端连接的电压源的稳态电压。"],[426,"我们再进行一次暂态计算。"],[430,"在进行暂态计算之前，我们要把电路进行简单的改造。"],[438,"第一，把避雷器恢复成原来的九点的特性。"],[445,"通过这个我们验证前面发生的问题不是因为伏安特性的点数太多所导致的。"],[454,"第二，为了与实际情况更加一致，给电抗器增加电阻。"],[460,"高抗的电阻是每相2.5欧姆，中性点小电抗的电阻是六欧姆。"],[469,"这是改造后的电路，大家也可以自行验证改造前和改造后计算结果有多大的差异。"],[479,"现在图上显示的是暂态过程的波形。"],[485,"最上端是末端的A相电压，中间是末端A相高抗中的电流，最下面是流经。"],[499,"最右端的，也就是复初值用的电压源的电流。"],[506,"我们能够看出，如果线路上有电抗器的时候，线路上有初值，有残余电荷，线路上的电压并不是一个稳定的值，而是正弦波。"],[519,"但是这个正弦波呈现拍频的性质。"],[523,"把 i 相的波形进行局部放大。"],[531,"这是20ms内的波形。"],[533,"在统计合闸中，每相开关的合闸时刻在一个周波内是随机分布的，所以 i 相上当时的损失电压也是一个随机值。"],[546,"我们再放大复初值的这个普通交流电源的电流。"],[554,"我们设置了它的断开时刻是二毫秒。"],[560,"其实从这个波形上我们可以看出，它真正断开的时间大概在10ms。"],[568,"这样在统计合闸中，有可能它的断开时间会晚于统计开关的合闸时间。"],[576,"通过调整出相角，使流经这个复初值开关的电流尽早过零，这个开关尽早打开。"]]},{"p":52,"t":"9.6 架空输电线路上合闸过电压的统计计算6_合闸电阻设置","d":668,"s":[[0,"大家好，在本期视频中，我们将要介绍断路器中合闸电阻的设置。"],[10,"在超高压、特高压的线路上，为了限制和空载线路的过电压，开关中通常装设合闸电阻。"],[22,"在国标 DL 615中，有这么一句话，对于363千伏及以上的线路断路器，是否需要带有合闸电阻，应该根据详细的系统过电压的计算校核结果来确定。"],[40,"目前工程上的实际情况是这样的，363千伏断路器一般没有合闸电阻，，363千伏以上的断路器，也就是500千伏到百万伏的断路器，一般都有合闸电阻。"],[58,"在我们将要使用的算例中，我们假定需要合闸电阻，我们的主要工作是对合闸电阻进行设置，需要考虑以下几个方面，一，合闸电阻值，国标规定合闸电阻值一般是400~600欧姆，我们取550欧姆。"],[85,"二，合闸电阻的投入时间，标准规定的是八到10ms，我们取10ms。"],[94,"三，断路器合闸时刻的不同期，标准规定的是不大于五毫秒，我们取五毫秒。"],[103,"四，断路器合闸时刻的随机性，这是本期视频将要讨论的重点内容。"],[113,"由于断路器有合闸电阻，所以三相断路器实际上有六个开关。"],[122,"我们在前一期视频中使用到的这个开关模型就不能使用。"],[130,"首先我们建立某一相断路器的模型，这是合闸电阻550欧姆，加入一个统计开关，再加入一个统计开关，把它们并联连接，它们合闸的顺序是这样的，首先这个开关合闸10ms之后，这个开关合闸，短路合闸电阻，合闸电阻就退出了电路，因为这个开关的合闸时刻。"],[170,"早于这个开关的合闸时刻，所以我们把这个开关设为主开关，这个开关设为从属开关。"],[179,"这个主开关的合闸时刻要晚于这个复初值开关的分闸时刻，所以我们把它的合闸时刻的平均值设为15ms。"],[193,"再把从属开关的辅助节点和主开关的辅助节点连接。"],[201,"我们用这个图来讲解开关的时间设置。"],[210,"这是交流电源的电压，你可以把它理解成A相。"],[218,"主开关合闸的平均时刻是15ms，是这一条线。"],[226,"主开关的合闸时刻为均匀分布，分布范围为从12.5~17.5ms，也就是从中间值向左向右各2.5ms，分别为它的最小值和最大值。"],[245,"把三相主开关都这么设置，三相开关之间的不同期就能够满足不大于五毫秒的要求。"],[254,"在这种情况下，开关合闸时刻的均方差为1.443ms。"],[262,"下面我们来看从属开关的时间设置，它比主开关合闸时间落后10个毫秒，所以它的t就等于10ms，也就是0.01s，把它的均方差取为零，那么t就不是随机分布，也就是说从属开关的合闸时刻总是滞后主开关的合闸时刻10个毫秒。"],[291,"这样从属开关的合闸时刻也是平均分布，合闸时刻的平均值是25ms，它的范围是从22.5~27.5ms。"],[310,"这个箭头和这个箭头所指的是一次随机合闸的时刻，这是主开关的时刻，这是从属开关的时刻，它们之间的时间差是10ms。"],[325,"我们把这一相开关再拷贝两次，得到其他两相的开关，把它们连接在电路中。"],[334,"这样整个仿真电路建立就结束了，我们还要设置仿真参数。"],[344,"仿真400次，一般情况下下面这些参数大家都记不住它的含义，打开帮助。"],[365,"在这次仿真中，我们主要关注的是这么几个参数。"],[372,"RSW选一，输出所有的合闸时间。"],[381,"RTST等于二，对所有的开关的合闸时间加一个随机的延时，保证了合闸时刻至少覆盖一个周波，即合闸相角的范围至少为0~36010°。"],[400,"我们前面设置的范围仅仅是五个毫秒，即1/4周波90°。"],[406,"在中国电力的频率是50hz，在0~36010°范围内延时相当于延时0~210ms，这个延时也是均匀分布，平均值是10ms。"],[422,"延时以后，主开关的平均合闸时刻为25ms，范围为12.5~37.5ms，而从属开关的平均合闸时刻为35ms，范围为22.5~47.5ms。"],[442,"打开文件 startup，可以找着和 RTST 相关的三个参数。"],[449,"注意 state fr 原来可能是60，改为50，也就是我国的工频频率。"],[457,"这是本次计算选择的数值，现在来选择输出，输出线路末端的电压，避雷器的能量。"],[470,"其实只能选择功率和能量，不能单独选能量，还有末端电抗器中的电流，已经选择输出高抗的电流。"],[482,"现在选择输出小电抗的电流。"],[486,"我们把输出量进行分组，这六项是避雷器的功率，我们不需要输出，这个地方不选择。"],[499,"这是末端电压。"],[501,"选择。"],[502,"取极值为34300伏，这样输出的结果就是标幺值。"],[511,"这是末端电抗器的电流，我们选择它。"],[517,"把它们都分在同样的组，都是第零组。"],[522,"这是首端和末端避雷器吸收的能量，我们把它统一放到第四组，另外给它们取极值是1×10的六次方，那么数值的单位就是兆焦。"],[536,"分组序号不连续无所谓，只要它们不同就可以。"],[542,"选择合适的 delta t 和 t max，按 F 二进行仿真。"],[549,"关于仿真输出的变量在 lis 文件中的位置以及如何绘图，我们在前面的视频中已经讲过，所以在本期视频中，我们仅仅看开关的合闸时刻以及开关合闸的不同期是否达到了预定的目标。"],[570,"按照我们在前面的视频中介绍的技巧，把开关的合闸时间从 lis 文件中取出来，拷贝到 excel 中。"],[581,"这是 a b c 三相主开关的合闸事件，这是它们三相从属开关的合闸事件。"],[593,"在 a b c 三相主开关或者从属开关中，最大值减去最小值就是它的不同期。"],[602,"所有的不同期的最大值，就是最大的不同期是4.8ms，小于五毫秒。"],[611,"a b c 项中选择任何一项，用它的从属开关的合闸时刻减去主开关合闸时刻，就是合闸电阻的投入时间，都是10ms。"],[626,"也可以看出，合闸时刻的分布范围是从12.5~37.5ms。"],[636,"这幅图从下到上三个直方图分别是 a b c 相主开关或者从属开关合闸时刻的分布情况。"],[648,"可以看出，给开关的均匀分布的合闸时刻增加一个均匀分布的随机实验，最后的合闸时刻不是均匀分布。"],[660,"最上面的直方图是三相不同期时间的分布情况。"]]},{"p":53,"t":"10.1 变压器的BCTRAN模型1-单相模型基本情况","d":753,"s":[[1,"大家好，在以前的视频中，我们介绍了变压器的 SAT 模型。"],[9,"这个模型和我们在一般的电路相关的教科书中见到的模型是一致的。"],[17,"变压器的 SAT 模型是一种工频下的稳态等效模型。"],[24,"也就是说，在工频下进行稳态计算是正确的，但是如果进行暂态计算可能会有问题。"],[38,"对于三绕组的变压器来说，中间绕组的工频等效漏感是一个负值，在稳态计算中，这个负值不会导致什么问题，但是在暂态计算中，这个负值会导致计算发生振荡。"],[59,"为了避免这个问题，开发了变压器的 BIG TRM 模型。"],[65,"从本期视频开始的几期视频中，我们介绍变压器的 BIG TRM 模型。"],[71,"现在屏幕上的是单相变压器的 BIG TRM 模型。"],[77,"在 BIG TRM 模型中，变压器变压的概念被淡化，变压器被看成多个互相耦合的线圈。"],[86,"这些线圈既有自感又有互感。"],[91,"图中 R 表示绕组或者线圈的电阻，这是一个矩阵，但是由于各个绕组之间的电阻没有耦合，所以这个矩阵仅仅有对角线元素，非对角线元素全部为零。"],[112,"欧米伽 L 是绕组的感抗矩阵，其对角元素是绕组的自感抗，非对角线元素是绕组之间的互感抗。"],[126,"在通常情况下，欧米伽 L 中各元素的数值非常大，为了减小漏抗计算的误差，也可以使用欧米伽 L 的逆矩阵，在 ATP 中这个矩阵也叫做 A 矩阵。"],[144,"Rm 是励磁电阻，对于单相变压器来说，Rm 仅仅是一个值，不是一个矩阵。"],[155,"对于单相双绕组变压器来说，R 和欧米伽 L 或者其逆矩阵都是2×2阶矩阵。"],[166,"对于单相三绕组变压器来说。"],[169,"它们都是3×3阶矩阵。"],[171,"下面我们介绍三相变压器的情况。"],[175,"三相变压器的 R 和欧米伽 L 矩阵的阶数更高。"],[182,"比如对于三相三绕组变压器来说，共有九个线圈，所以 R 和欧米伽 L 矩阵都是9×9阶的。"],[192,"三相变压器的寄生电阻 Rm 不再是一个单一值，而是一个3×3阶矩阵。"],[200,"接下来我们以 ATP-EMTP及其在电力系统中的应用一书中第5.3节的单相变压器 TR1 为例，来建立单相变压器的 pi 串模型。"],[217,"在 ATPDraw中建立一个新的项目文件，点击右键，Transformers，选择 pi 串，打开这个元件，我们已经输入了相关的数据。"],[238,"我们对这个界面的一些参数进行简单的介绍。"],[243,"在 Structure 区域，Name 这个地方给这个变压器起个名称，这个名称一般不要取得和整个项目文件的名称一样。"],[256,"相数这是单相，选一。"],[263,"绕组数选三。"],[267,"试验频率在中国就是50hz。"],[274,"A R Output，如果选择输出的是绕组的感抗的逆矩阵，绕组的电阻矩阵。"],[283,"在 Ratings 区域，Voltage 变压器各电压等级的绕组的额定电压，不是线电压。"],[296,"这个结果是765除以根号三，这是345除以根号三。"],[302,"第三个绕组它是63。"],[308,"Power 额定容量按实际情况输入。"],[315,"Connections 连接组别，我们这个例子中，高压和中压是自耦连接，所以这个地方选 A。"],[325,"对于第三个绕组选一 W。"],[330,"这一项在 ATPDraw的说明书中有一个解释。"],[337,"如果使用2015年之后的 ATP 版本，当对自耦变压器建模的时候，建议选择这一项。"],[348,"ATP 对计算结果进行一定的修正。"],[352,"这一项 External Neutral Connections，中性点未部的连接。"],[360,"我们这个例子是自耦变压器，中性点是直接接地的，所以这个地方不选择。"],[370,"如果在中性点还接有其他的，比如说电阻或者电抗，这一项打勾，在输出的变压器模型中，相关的节点就不会接地。"],[389,"在我们的这个例子中，中性点直接接地，这个地方不选择。"],[398,"在 Factory Tests 区域，也就是工厂试验区域，有开路试验和短路试验两个标签页。"],[399,"我们首先来看开路试验。"],[400,"这个选项表示开路试验是在哪一侧进行。"],[400,"有三个选项，从上到下分别是原边、副边和第三绕组。"],[401,"变压器的空载试验通常在额定电压最低的绕组上进行。"],[402,"从建立变压器模型的角度来考虑，空载试验在哪一侧进行并没有区别。"],[402,"但是在 ATPDraw7.3中，如果选择在第三绕组上进行空载试验，建立模型时会出现错误提示。"],[459,"错误提示信息的含义是不能建立 PCH 文件。"],[465,"所以这个选项我们选择高压绕组。"],[469,"Connect at，激磁支路连接在哪一侧？"],[476,"一般情况下把激磁支路连接在电压最低的这一个绕组。"],[485,"这个绕组一般是靠近铁芯的。"],[491,"再往下面，这是正序的开路试验的数据，这是在100%电压下，也就是额定电压下的试验情况。"],[503,"电流百分数。"],[506,"这是损耗，这是105%的情况，110，115，把这四组数据全部输进去。"],[525,"因为是单相变压器，不会有连续试验数据。"],[529,"我们再来看短路试验，短路试验也是只有正序试验数据。"],[540,"这是高压绕组和中压绕组的试验，短路阻抗电压百分比，第二栏数据 power 大家要稍加小心，原边和副边的额定容量都是500兆伏安，但是第三个绕组的容量是150兆伏安，当进行原边和副边的短路试验时，因为它们的容量都是相同的，所以短路试验的时候两侧都能达到它的额定电流，没有任何问题。"],[584,"但是如果有这个绕组加入到短路试验中，比如说是原边和第三绕组的短路试验，试验的时候只有第三绕组才能达到它的额定电流，原边不能达到额定电流，如果原边达到额定电流，第三绕组中的电流会远远大于它的额定电流，这是不允许的。"],[617,"也就是说短路试验是在150兆伏安的容量下进行的，大家可能认为输入方式是这样的，在进行高压和第三绕组之间的短路试验时，在 power 这一栏输入实际容量150兆伏安，在这个地方输入实际的损耗215.78kw，再输入第二、第三绕组短路试验的相应数据，我认为作者保留这一栏的目的也是这样的。"],[665,"实际上如果这样输入数据，最后结果是错误的。"],[672,"在这个地方要输入500，在这个地方要输入经过容量折算后的负载损耗，也就是这两个值。"],[690,"大家可以关注 ATPDraw 后续版本的发展。"],[694,"在开路试验标签的下面还有一个小区域，正序铁心励磁参数有三个选项，分别是线形内部、尾部添加励磁电感、尾部添加励磁电感和励磁电阻。"],[725,"我们首先介绍第一个选项的使用，其他两个选项我们在后面继续介绍。"],[738,"我们再来看这个小区域，下面有 view 和 copy 按钮，观看或者拷贝，你想观看或者拷贝哪个参数，就在这个区域选择相应的选项。"]]},{"p":54,"t":"10.2 变压器的BCTRAN模型2-单相模型建立和稳态校核","d":682,"s":[[1,"大家好，在上期视频中，我们介绍了单相变压器的 BCTRAN 模型的基本情况，在这期视频中，我们介绍单相 BCTRAN 模型的建立和稳态校验。"],[18,"我们先来看看模型的相关文件，有关的选项是这样的，选择 A R 矩阵，选择修正自耦变压器模型，选择线性内部励磁电感。"],[34,"点击 Run ATP，ATPDraw生成输入数据文件 BCT 750点 data，然后 ATPDraw调用 ATP 进行计算，计算的结果有两个重要文件，一个是 BCT 750点 lis，一个是 BCT 750点 pch，下面我们分别看这几个文件。"],[62,"请大家注意，我们现在进行的是变压器参数计算，而不是仿真计算，所以不能在 ATP 主菜单下面通过点击 Edit ATP file 或者 View this file 来看这些文件。"],[82,"在介绍之前，我们先对自耦变压器的线圈进行说明。"],[89,"我们常说的三绕组自耦变压器其实是有两个线圈，一个是第三绕组，它的高压和中压是一个线圈，只不过在线圈的中间抽出一个抽头，在我们这个例子中抽出的这个抽头的电压是3~45000伏，在 ATPDraw中线圈是这样的，高压接头和中压接头中间的这一部分是看作一个线圈，中压接头到地之间看作一个线圈，第三绕组看作一个线圈。"],[137,"所以第一个线圈的额定电压就变成了765减345除以根号三等于根号420/310kv，这个线圈不是通常意义上的高压绕组。"],[157,"我们先来看 BCT 750点 data，第一行是 Begin new data case。"],[166,"这是所有的仿真和参数计算都有这一行。"],[171,"这一行参数，它的意思是调用子程序 bctran 来进行变压器参数计算。"],[180,"以 c 加空格开头的这些都是注释语句。"],[188,"这是那次参数。"],[192,"这是变压器的额定电压，可以看到这些参数不是我们输的参数，而是除以了根号三的结果。"],[206,"对第一个绕组来说，这个值是420除以根号三，再除以根号3=1四零。"],[214,"在程序中是139.995893。"],[221,"对于第二个绕组，这个值是345除以根号三，再除以根号3=1幺五。"],[229,"对于第三个绕组，这个值是63除以根号3=36.373067。"],[239,"这是短路试验的参数。"],[243,"接下来我们来介绍计算后输出的变压器模型。"],[251,"这个模型在文件 bct 750点 pch 中。"],[257,"前面这一部分基本上是输入文件 bct 750点 data 的重复。"],[267,"它是以 c 加一个空格作为注释语句的形式来出现的。"],[276,"这一部分是变压器的 bctran 型。"],[283,"第一行 dollar voltage 是一个控制卡，或者叫一个控制命令。"],[293,"这个意思是后面所有的数据使用高精度。"],[300,"到这个地方还有一行 dollar voltage，前面的数字是一，后面的数据是负一，表示到了这个地方所有的数据恢复原来的精度。"],[316,"现在我们来看这一篇内容。"],[322,"第一行是 use a r，表示下面的变压器模型使用的是 a 矩阵和 r 矩阵。"],[334,"后面又有一行 use old，表示之后的参数恢复到以前的情况。"],[345,"在我们的这个例子中，之后再没有数据。"],[350,"这一片数据其实是π模型，π模型的标识字是这些整数123。"],[359,"这是π模型的下三角 A 矩阵。"],[365,"这是π模型的下三角电阻矩阵。"],[373,"这个模型里面没有电容，如果有电容，在这之后这一篇内容就是电容。"],[381,"这一行是类似电阻，ATPDraw 也把这个简单的电阻看作一个只有一个元素的π模型。"],[388,"因为它前面的标识符是一，其实这个没必要，可以仅仅把它看作一个简单的电阻。"],[390,"下面我们来看文件 bct 750点 list 中的内容。"],[415,"这个文件其实是前面两个文件的合并，只不过增加了一些解释性的内容。"],[426,"如果选择输出 R 和 L 矩阵，这个地方不打勾，我们看看建立的模型有什么不同。"],[438,"现在看输出的模型文件 bct 750点 punch 中的模型。"],[447,"模型的第一行没有变化，第二行也没有变化，第三行原来是 use a r，现在变成了 use r l，表示变压器的模型是 R 和 L 矩阵。"],[466,"首先出现的是 R 矩阵，接着是 L 矩阵。"],[472,"这是新增加的一行 units 50零，它表示从这一行之后，电感的单位是欧姆。"],[485,"其实电感就是欧米伽 L，欧米伽对应的频率是50hz。"],[491,"这个零与电容单位有关，表示从这一行之后，电容的单位是微法。"],[500,"在我们这个算例中没有电容。"],[503,"这是π模型的电阻矩阵。"],[507,"这是电抗矩阵。"],[509,"这一行表示恢复以前的数据精度。"],[513,"这一行恢复以前的电感和电容的单位。"],[518,"这一行恢复π模型的矩阵形式，如果原来是 A R，恢复为 A R，如果原来是 R L，相当于继续保持为 R L。"],[532,"现在显示的是对模型的短路试验和空载试验校验的情况。"],[539,"注意前面我们进行的是参数计算。"],[543,"在参数计算中，这些数据都没有意义。"],[549,"现在我们进行的是仿真计算，Tmax 取任意一个负值，表示我们要进行的是稳态计算。"],[559,"左边这是短路试验，右边是空载试验。"],[567,"短路试验从上到下分别是高、中压之间、高低压之间和中、低压之间的短路试验。"],[575,"试验的电流源分别加在高压侧、高压侧和中压侧，电流值都为额定值，变压器消耗的功率和原始参数是一致的。"],[591,"比如在高、中压短路中，变压器消耗的功率是813 592瓦。"],[601,"原始参数是813.5 8000瓦。"],[608,"现在我们再来看短路阻抗的百分数，也就是电流源的电压。"],[617,"选择适当的 scale，屏幕上就能够直接显示短路阻抗的百分数。"],[628,"从上到下依次是14.14、51.51和33.77，这个和原始参数是完全一致的。"],[642,"右边是空载试验，试验电压施加在第三绕组，电压值是63kv，变压器消耗的功率是114.732kw，和原始值是一致的。"],[665,"流过变压器的电流是7.861291安培。"],[672,"我们把它折算成百分数，结果为0.07%，与原始数据一致。"]]},{"p":55,"t":"10.3 变压器的BCTRAN模型3-单相模型非线性特性校核","d":912,"s":[[0,"大家好，在前面的两期视频中，我们介绍了单相变压器 BCTRAN 模型的基本情况、建立和校验。"],[12,"其实我们建立的也是稳态模型，没有考虑励磁特性的非线性。"],[18,"在本期视频中介绍如何添加非线性励磁特性。"],[24,"之前我们介绍的单相变压器的 BCTRAN 模型是这样的。"],[33,"这个虚框内是绕组的电阻，这个虚框内是绕组的电感，它们都是矩阵。"],[41,"这是励磁电阻、励磁电感包含在这个矩阵中，所有的元件都是线性的。"],[54,"模型中元件的具体数值是 ATP 调用子程序 BCTRAN 计算所得。"],[60,"当考虑非线性励磁特性的时候，模型就变成了这样，增加了非线性电感，增加了非线性电阻，这两个元件的数值并非是子程序 BCTRAN 计算所得，所以在 BCTRAN 计算的结果 PUNCH 文件中没有这两个支路的相应内容。"],[92,"而是 ATPDraw 在建立 ATP 的输入数据文件的时候直接加入到 ATP 文件中，在 ATPDraw 建立的电路文件中也看不见这两个元件。"],[105,"我们继续以变压器 TR 一为例进行说明。"],[110,"在这个地方我们选择外加励磁电感和励磁电阻。"],[118,"选择这个项目以后，这个地方会出现这个选项，它的意思是自动添加非线性特性。"],[129,"我们在它之前打勾，点击 OK 建立模型。"],[134,"现在我们来看选择内联 INTERNAL 和选择 EXTERNAL 所建立的模型有什么区别。"],[150,"我们把模型相关的内容都显示在屏幕上，这上面这一部分是选择的 INTERNAL，下面这部分是选择 EXTERNAL。"],[165,"可以看出，励磁电阻在上面是34593。"],[174,"但是到下面，它基本上是乘了10的三次方，相当于扩大了1000倍。"],[184,"第三绕组的自感。"],[187,"118.033原来是，现在变为118.0069。"],[194,"其他的数据都没有变化。"],[200,"这两处修改的目的，就是在模型外面添加非线性支路做准备。"],[207,"励磁电阻的值乘以1000，相当于把它忽略了。"],[212,"，真正的励磁电阻在未加电路中。"],[216,"通过这个电路，我们来验证非线性模型。"],[221,"在变压器的第三绕组施加一个电压源，给变压器进行空载试验。"],[230,"首先我们不进行计算，仅仅生成 ATP 文件，看 ATP 文件中的非线性支路。"],[240,"点击 ATP，在 sub process 下面，点击 make ATP file。"],[250,"下面我们来看生成的 ATP 文件。"],[256,"这个以 ATP 为后缀的文件是仿真计算使用的输入文件，大家一定要区分，在 ATP 中有两种计算，一种是参数计算，一种是仿真计算。"],[274,"这一部分内容我们在前面介绍过，是参数计算 PCH 文件的拷贝。"],[282,"这一部分内容是 ATP-EMTP 新加的非线性支路，九八型是非线性电感，九九型是非线性电阻。"],[299,"这两个元件在电路文件中是没有显示的。"],[305,"为了比较，我们建立了一个同样的电路，但是这个变压器的模型采用的是 linear internal 及线性的励磁特性。"],[320,"我们也建立了一个短路试验的回路，电流源施加在第一绕组，第二绕组开路，第三绕组短路。"],[333,"也就是第一绕组和第三绕组之间的短路试验。"],[338,"这个电压是加在第三绕组上，所以电压源的电压是63kv。"],[348,"这个电压源的电压也是63kv。"],[353,"这个电流源施加在第一绕组，也就是我们通常说的原边，所以这个电流取它的额定电流1132安培。"],[366,"屏幕上现在显示的是稳态计算的结果。"],[370,"在稳态计算中，非线性的电感包含在电路中，但是非线性的电阻不包含在电路中。"],[382,"在短路实验中，励磁电感和电阻起的作用非常小，它的计算结果和选择线性的励磁支路的计算结果没有区别。"],[395,"但是在进行空载试验时，模型的两种选项导致的电阻的损耗结果不一样。"],[406,"在上面电阻损耗是115瓦，在下面基本上是它的1000倍，114.7kw。"],[418,"原因是在上面电阻被除以了1000，相当于它的功率也会被除以1000。"],[429,"所以用这种选项来计算稳态下变压器的励磁损耗结果是不正确的。"],[439,"但是通过长时间暂态计算直到稳态，然后再计算它的功率，结果是正确的。"],[449,"为了能够测量功率，把电流测量仪更换为测量开关。"],[456,"测量开关的输出是第四项，功率和能量。"],[468,"再增加一个66型 TCS 元件。"],[473,"这个元件把瞬时值变为有效值，还需要增加一个把电路的变量转换为 TACS 变量的元件。"],[492,"点击这个元件。"],[507,"在。"],[508,"TACS component circuit，就是TACS与电路之间的耦合，选择switch current，就是开关电流。"],[525,"这样就把通过这个开关的电流，在这个地方转化为TACS信号，输入到66型TACS元件中。"],[537,"TACS这里边需要更改的参数只有一个，就是频率。"],[548,"把频率改成50hz。"],[552,"在这个地方大家看帮助的时候，不要让这一篇帮助误导了。"],[561,"在旧版的ATP-EMTP及其在电力系统中的应用一书中，第239页相关的内容是错的。"],[574,"在修订版中，相关的内容在第241页，也是错的。"],[581,"再增加一个TACS测量仪。"],[587,"用来测量TACS输出的电流的有效值。"],[597,"取tmax等于0.1s，即五个周波，delta t等于1×10的负四次方秒。"],[611,"现在我们不直接进行暂态计算，而是在这个地方生成ATP文件。"],[619,"之所以这么做的原因是ATP生成的非线性电阻的特性不正确，我们要手工修改。"],[629,"第一行参数，这是电流，这是电压。"],[636,"它对应的是我们输入的空载试验的第一个参数，也就是在额定电压下的空载试验的数据。"],[647,"非线性电阻伏安特性的电压和电流值都应该是幅值，而不是有效值。"],[654,"这个地方6.3乘以10的四次方，显然是有效值。"],[659,"这是 ATPDraw 从6.3~7.3版本一直存在的一个 bug，所以我们要把这些电压和电流都乘以根号二。"],[671,"这是乘以根号二的数据，这是以前的数据，把以前的数据删掉。"],[682,"这个地方有个小技巧要提醒，有人可能喜欢把原来的数据拷贝到 Excel 中乘以根号二后再拷贝回来，但是拷贝回来的数据中可能包含有 ATP 不能识别的隐藏符号，解决的办法是把空格删掉，再用空格键输入空格。"],[708,"下面我们首先仿真额定电压下空载试验的暂态过程。"],[715,"电压源的幅值是89095.4544，这就是63kv的根号二倍。"],[725,"现在我们要对我们刚修改完的 ATP 输入文件进行仿真，记得这个时候不能通过按 F 二或者是 run ATP 来进行仿真，否则刚才修改的全都没有了。"],[745,"在 sub process 下面点击 run ATP file，它就会越过生成 ATP file 的这个过程，直接执行当前的 ATP 文件。"],[762,"这是计算结果的绘图，上图是 TACS 测量的一次电流的有效值，结果是5.56。"],[781,"下面这个图是变压器吸收的功率和能量，它的平均功率我们通过能量在一段时间的平均值来求取。"],[800,"把中间这一片进行局部放大，取40和60mm的数据，这两个数据分别是4576.8、6871.0，这两个数值相减除以时长0.02s，结果是114.71kw。"],[828,"励磁电流和励磁功率都与原始数据吻合的比较好。"],[834,"我们再把电压源的电压改为63kv的1.15倍，即63000kv乘以根号二乘以1.15，即102459.46。"],[852,"继续按照前面的过程进行仿真计算，我们来看计算波形。"],[860,"这是前面一个算例的波形。"],[866,"点击 refresh 进行刷新，我们先来看电流，45.34六安培。"],[874,"原始励磁电流是45.5六安培。"],[881,"再把能量曲线局部进行放大。"],[886,"我们还是取40和60ms下的数据，把它们相减除以时间，得到平均功率，结果为174.8。"],[904,"原始数据是180，吻合的比较好。"]]},{"p":56,"t":"10.4 变压器的BCTRAN模型4-三相模型","d":783,"s":[[1,"大家好，在前面的几期视频中，我们介绍了单相变压器的 BCTRAN 模型。"],[8,"在本期视频中，介绍三相变压器的 BCTRAN 模型。"],[14,"使用的算例是 ATP-EMTP 及其在电力系统中的应用一书中第5.3节的变压器 TR2。"],[26,"相关参数见屏幕上右面这张图，点击右键，在 Transformers 菜单中选择 BCTRAN 变压器。"],[40,"在输入数据的时候，有几点要注意。"],[47,"相数如果是选择三，这个地方的电压是 LL voltage，就是线电压。"],[58,"如果选择一，这个地方就变成了 voltage，意思略有区别，输入的时候数据也有区别。"],[70,"对于单相变压器输入额定的线圈电压，对于三相变压器输入额定线电压。"],[81,"当变压器为三相的时候还有一点区别，会出现零序参数是否可得的选项。"],[90,"在短路试验中也有这个选项。"],[95,"在我们的算例中，零序开路试验数据和零序短路试验数据都有。"],[102,"对于单相变压器没有这两个选项。"],[106,"还有一点要注意，在空载试验中，电压值可以输100、105、110等等。"],[119,"但是 BCTRAN 仅仅用第一行数据来计算绕组的电感，而且认为这就是在100%电压下的参数。"],[131,"如果第一行的参数不是在100%电压下，大家不要误以为它能够折算为100%电压下的参数，这个折算是用户自己进行的。"],[144,"所有的折算过程请大家看参考书。"],[148,"我们对变压器的几端进行了命名，高压端为 H，低压端为 L。"],[158,"高压绕组 Y 连接，它的中性点没有接地，端点名称为 HN。"],[165,"低压端绕组星形连接，它的中性点是接地的。"],[170,"本来这两个中性点都是直接接地的，我们暂时把高压端的中性点悬空，是因为后面我们要给它加一个电阻，以保证零序阻抗的正确。"],[187,"所有的参数我们已经输入，这个地方我们选择了 linear interlo，因为没有逆磁特性。"],[198,"点将 OK，调用 bigtrans 程序，现在我们来看计算结果。"],[206,"我们先来看计算的输入文件，data 文件，大家没有必要记得哪一个数据在哪个位置。"],[219,"对照我们的原始数据，我们就能够明白哪个数据是什么含义。"],[228,"我们看到零序短路试验的损耗数据没有出现在输入数据中，所以用这个模型来计算零序的短路损耗肯定是不正确的。"],[244,"再来看 punct 文件中的模型，它的基本结构和单相变压器的模型是相同的。"],[254,"首先是逆磁电阻，因为有正序逆磁电阻，也有零序，所以这个地方是矩阵形式。"],[268,"接着是六个线圈的阻抗矩阵和电阻矩阵，我们选择的是输出 A 矩阵，也就是欧米伽 L 的逆矩阵。"],[280,"这一部分内容是逆矩阵，电力系统中矩阵一般是对称的，在 ATP 中通常仅仅显示下三角矩阵，以节省空间。"],[294,"这是绕组的电阻矩阵，绕组的电阻没有耦合，它只有对角元素，非对角元素全部为零。"],[308,"如果不选择 A R output，那么计算的结果输出的是 R 和欧米伽 L 矩阵，具体是这样的，蓝颜色为背景的这片区域是欧米伽 L 矩阵。"],[326,"如果用户想用 bigtrans 模型来模拟变压器的匝间故障，假设只有一处故障，那么用户就需要把这个绕组分成两个绕组。"],[339,"手工修改矩阵中的相应参数，但是要提醒的是，手工修改不能在模型文件、PCH 文件中进行，要在仿真计算输入文件，即后缀为 ATP 的文件中进行。"],[355,"为了检验我们刚才建立的变压器模型是否正确，我们在这儿建立了正序的空载和短路试验的回路。"],[371,"在空载试验回路中，电压施加在低压侧，施加额定电压。"],[383,"在短路试验回路中，电流施加在高压侧，低压侧短路。"],[394,"短路电阻我们取的是10的负五次方，非常小。"],[401,"在高压绕组的中性点接一个电阻 RN，高压绕组的中性点是接地的，所以我们暂时把 RN 取一个比较小的值，用变量表示0.001欧姆。"],[418,"在空载试验的回路中，我们用了两个电流测量仪。"],[425,"第一个用于在屏幕上显示功率，因为测量仪给出的是单相功率，所以我们把 scale 选为0.3333，表示乘以三，得出的结果就是总的功率。"],[444,"第二个电流测量仪用来在屏幕上显示电流，它的 scale 选为根号二，屏幕上的结果就是电流的有效值。"],[459,"这两个值是空载试验的电流和功率，和原始数值完全相等。"],[472,"注意，我们在这个地方加的电压是11.05kv。"],[479,"再来看短路试验的回路，我们用这个电流仪来测量功率，它的 scale 还是0.3333，表示屏幕上显示的是三相功率。"],[495,"对于这个电流测量仪，我们首先要把测量所得的幅值转化为有效值，也就是除以根号二。"],[508,"然后要把这个值再转换为线电压，也就是乘以根号三，最后 scale 是0.816496，计算的结果是消耗的功率是192.668kw，35.221kv，这个和原始数据吻合的比较好。"],[534,"接下来我们进行连续试验参数的校核，校核电路在右边，上面是空载试验，下面是短路试验。"],[547,"在连续试验的校核中，电压和电流源都可以用三个单相，也可以用一个单相，但是在加压的变压器的这个端点上，把变压器的三相短路，我们采取后一种方式，这种方式也是工程上进行连续试验的接线方式。"],[580,"在连续空载试验中，电流源的电压是1.183kv。"],[591,"这个电流测量仪测量的功率就是三相的总功率，所以这个 scale 也不用乘三。"],[603,"这个电流测量仪测量的是三相的总电流，它是幅值，所以 scale 取1.414把它变成有效值。"],[618,"屏幕上现在显示的这个结果就是稳态计算的结果，电流值是500.34安培，原始数据是500安培，功率是115.3547kw，原始值是115.325kw。"],[648,"屏幕右下角是短路试验的回路，电流源的电流值是70安培。"],[664,"这个电流测量仪测量三相的总功率，这是电压测量仪。"],[675,"它的 scale 取1.414，把幅值变为有效值。"],[682,"屏幕上显示的是稳态计算的结果。"],[687,"可以看出，电压值基本上等于实际值，但是功率值比原始数值小很多。"],[700,"为了解决这个问题，在高压绕组的中性点对地接一个电阻，相当于在零序回路接了一个电阻，这样零序短路试验的功率损耗就会增加。"],[721,"这个电阻值是这么确定的，把零序和正序短路试验的损耗都折算到额定电流153.1安培下面，得到这两个损耗的差值187 410瓦，这个值除以3×153.1的平方，就是这个电阻值。"],[747,"最后结果是 Rn 等于0.888欧。"],[752,"把 Rn 改为0.888欧，再计算一次。"],[760,"可以看出，添加这个电阻之后，不会改变零序空载试验的结果，也不会改变零序短路试验的电压值，但是零序短路试验的功率值就与实际一致了。"]]},{"p":57,"t":"11.1 单相电缆模型1-模型基本情况","d":946,"s":[[1,"大家好，从本期视频开始，我们介绍电缆模型，首先介绍单相电缆模型。"],[9,"这是一根单芯电缆，目前我们用的绝大部分电缆，它的绝缘材料使用的是聚乙烯。"],[18,"所以我们仅仅介绍这种电缆的结构，这种电缆我们也常常把它称为塑料电缆。"],[27,"这是电缆的芯，是电缆的载流部分，它的材料通常是铜或者铝。"],[39,"在芯外面有一层薄薄的半导体层，叫半导体屏蔽。"],[47,"这一层是它的绝缘，在绝缘外面也有一层半导体层。"],[57,"在这个半导体层的外面是金属屏蔽，金属屏蔽外面是一层绑扎层，在外面是一层橡胶。"],[69,"在仿真计算中，通常把这层绑扎和橡胶合为一层，这一层是铠装层，它的主要作用是保护电缆。"],[84,"在外面又是绑扎层和橡胶，在计算中通常也把它们合为一层。"],[94,"以上介绍的是有三层金属结构的电缆，不同类型的电缆结构会略有不同，有的电缆只有两层金属结构。"],[106,"半导体层的作用是保证电场均匀，在电场计算中认为它是金属，在磁场相关的计算中认为它是绝缘体。"],[119,"在较低电压等级的电缆中，半导体层很薄，所以可以忽略它的存在。"],[127,"在高电压等级电缆中，半导体层稍微厚一点。"],[132,"在这种情况下，如果想要进行更加准确的计算，可以考虑半导体层的厚度，但是如果忽略半导体层的存在，误差也在工程可以接受的范围之内。"],[147,"接下来我们来看三相电缆的结构，屏幕上现在显示的是一种比较常见的结构。"],[155,"三相电缆可以认为是三根单相电缆装在一个金属的管道中，我们来看其中的某一相，这是缆芯。"],[168,"这是半导体屏蔽，这是绝缘层。"],[173,"这又是半导体屏蔽，这是金属屏蔽。"],[179,"在外面，这是绑扎层，也叫绑带。"],[185,"这是一层橡胶，有的地方也把它叫做衬垫层。"],[192,"这一层是铠装。"],[196,"电力电缆的铠装通常有两种形式，一种是金属皮卷制而成，一种是由金属丝组合而成。"],[207,"在外面的外皮也是橡胶。"],[211,"这一片是填充材料，通常也是橡胶。"],[217,"接下来我们介绍计算电缆参数的时候需要的电缆的几何参数和材料参数。"],[227,"电缆的几何参数是一系列同心圆的半径。"],[234,"在这个图上没有画出两层半导体层。"],[243,"中间的这个圆圈是缆芯，q一表示空心圆的半径，r一是缆芯的外半径。"],[255,"q二和r二分别是金属屏蔽层的内半径和外半径。"],[266,"q三和r三分别是铠甲层的内半径和外半径。"],[274,"电缆的最大半径是q四。"],[276,"缆芯、屏蔽和铠甲或者铠装都是金属材料。"],[284,"描述它们的材料参数是电阻率和磁导率。"],[291,"它们的电阻率各不相同，但是它们都是非导磁材料，磁导率都为一。"],[298,"电缆的绝缘层、橡胶层和这个橡胶层都是绝缘材料。"],[308,"描述绝缘材料的参数是介电常数和磁导率。"],[315,"不同绝缘层的介电常数不一样，但是它们都是非导磁材料，磁导率都等于一。"],[324,"以上介绍了单芯电力电缆的模型。"],[328,"我们在 ATPDraw 中建立一个新的项目文件，点击鼠标右键。"],[337,"选择线路和电缆，和计算架空线路参数一样，我们选择 LCC Template，出现这个图标，我们点击，弹出相应的窗口。"],[352,"在 Model 页面，它总共有三个区域。"],[357,"我们先说第一个区域，Name，就是给电缆起个名称，注意这个名称通常不要和项目文件相同，我们给它起这个名称。"],[373,"在这个下拉菜单中有三个选项，分别是架空线路，这就是我们前面介绍的计算架空线路参数时的选项。"],[387,"第二个选项是单芯电缆，第三个选项是封装在管道中的电缆，指的就是多芯电缆。"],[397,"我们选择单芯电缆。"],[401,"选择以后，这个界面就发生了变化。"],[408,"这个是电缆的位置，在空气中，在地表，在地下。"],[417,"大家要注意这两个参数的选择。"],[421,"上面这个参数是电缆的相数。"],[425,"电缆的相数的含义和输电线路相数的含义是相同的，最关键的就是金属屏蔽和铠甲怎么看待。"],[435,"电缆在正常运行中，它的铠甲和金属屏蔽都是接地的。"],[442,"在计算电缆参数的时候，铠甲和屏蔽可以接地，也可以不接地，取决于用户的需求。"],[452,"对于一根单相电缆，如果在计算中把它的铠甲和金属屏蔽都消掉，就像计算架空线路参数的时候消除地线一样，那么这一根单相电缆就是一项。"],[472,"如果仅仅消除最外面的铠甲，它就是两项。"],[477,"对于铠甲和金属屏蔽都不接地的情况，它的相数就是三。"],[484,"我们再来看这一片参数， Cable Constants，选择这个选项表示使用的是 Cable Constants 这个子程序来计算电缆参数。"],[505,"选择之后。"],[506,"它下面仅仅有一个选项，其他几个选项都没有了。"],[511,"如果不选择，表示使用 cable parameters 这个子程序来计算电缆参数。"],[521,"一般而言，cable parameters 计算的结果会更加准确一些，因为这两个子程序都是日本同志社大学的 Akihiro Ametani 开发的。"],[537,"他首先开发的是 cable constants，当他发现存在一些问题的时候，他又新开发了 cable parameters。"],[547,"接下来这个选项是 matrix output，一般情况下这个是要选的，除非完全不关心它的计算过程，只把它放在一个电路中进行计算。"],[561,"Snaking 选择这一项，它的效果类似于架空线路的换位一样。"],[569,"And j 增加对接电导，例如当要考虑电缆的损耗的时候，and c 就是增加电容的意思。"],[581,"在这个区域选择具体的模型，我们常选的模型有贝杰龙模型、π模型或者 JMarti 模型。"],[595,"当选贝杰龙模型的时候，还有个选项需要选择，就是如何计算波阻抗，它有两个选项，它们的公式分别是这样的。"],[609,"准确的计算公式是最下面这个公式。"],[614,"第一个选项，它把准确计算公式中的电阻和电导取为零。"],[622,"第二个选项中，计算结果仅仅取准确计算值的实部，实际上波阻抗都是负数，而在这两个选项中，计算结果都是实数，这是为了满足暂态计算的需要而做的一种近似。"],[642,"选择π模型不会出现计算架空线路参数中的那些选项。"],[651,"当选择贝杰龙模型或者π模型的时候，这几个参数的含义是这样的。"],[662,"这是大地电阻率，这是参数计算的频率，一般选择的是工频。"],[670,"这个是电缆的长度，它的单位是米。"],[676,"如果选择解码器模型，这个参数的含义会有变化。"],[685,"下面我们来看，当选择解码器模型的时候，会有很多选项。"],[695,"这是拟合的一些参数选择。"],[701,"一般情况下，大家可以不改变这些参数，或者选择使用缺省参数。"],[713,"选择这一项之后，右边这些拟合参数就不再出现。"],[720,"这一个参数是解码器频率相关模型的最小频率，比如我们选为0.1hz。"],[730,"这个参数是计算频率以10倍为单位的频率范围，那么计算的最大频率是由这个公式来决定。"],[743,"如果最小频率是0.1hz，单汉字为六，那么最大频率就是10的五次方赫兹。"],[753,"下面我们来介绍 data 页的参数。"],[759,"在最上面，第一个参数是电缆的编号，如果有多条电缆，比如说是三根电缆，它的编号就是123。"],[774,"最右面这个是电缆的总根数，不要把这两个混淆了。"],[782,"这个数据应该和 models 页面的这个数据是相同的。"],[788,"我们也不知道它为什么把这个数据会出现两次。"],[793,"r out 电缆的最大外半径，如果是电缆有金属屏蔽，这个地方选择 on。"],[802,"如果有铠装，这个地方选择 on，选择 on 之后会出现相应的数据列。"],[811,"关于这些数据与电缆结构的对应关系，我们用这张图来说明。"],[820,"红颜色的对应的是金属层，绿颜色对应的是绝缘层。"],[827,"从左到右，红颜色的这金属层分别是缆芯、金属屏蔽和铠装。"],[837,"缆芯对应的是这个。"],[843,"金属屏蔽对应的是这一层，铠装对应的是这一层。"],[850,"我们以缆芯来说明它的这个数据。"],[855,"从上到下依次是内半径、外半径、电阻率和磁导率。"],[866,"通常缆芯是实心的，它的内半径就是零。"],[872,"对于三个绝缘层，它与电缆结构的对应情况是这样的。"],[881,"第一列对应的是第一层绝缘，第二列对应的是第二层，第三列对应的是第三层。"],[891,"绝缘数据中只有磁导率和介电常数，没有内外半径。"],[899,"我们再来看位置参数，有两个参数，上面是垂直位置，下面是水平位置。"],[909,"电缆它是在地上或者地下，由前面的这个选项决定，所以在这里输入电缆中心线的高度或者深度的绝对值。"],[925,"再看水平位置，对于一根单相电缆来说没有意义。"],[933,"对于多相电缆，不论它是一根多芯电缆或者是多根单芯电缆，水平位置要正确输入。"]]},{"p":58,"t":"11.2 单相电缆模型2-模型建立举例","d":666,"s":[[0,"大家好，本期视频以《输电线路电磁暂态仿真及应用》一书中第15.1节的电缆为例，来介绍如何建立单芯电力电缆的模型。"],[16,"这根电缆的结构和参数如图中所示。"],[22,"电缆的参数已经输入，电缆名称是 C 10 kV。"],[30,"在这个地方选择单相电缆，电缆位于空气中，这个地方没有打勾，表示选择的计算程序是 Cable Parameters。"],[46,"这个地方打勾表示要输出电缆的计算参数。"],[54,"这是电缆的根数，只有一根。"],[59,"按 A B C 相来说只有一相。"],[61,"我们把电缆的屏蔽和铠甲不接地，这样电缆有三个金属导体，所以从建立模型的角度而言，电缆是三相的。"],[74,"选择贝杰龙模型，它不是参数随频率变化模型。"],[81,"在计算模量波阻抗的时候，我们首先选择第一种计算方式，大地电阻率为50欧米。"],[91,"这是贝杰龙模型计算参数的频率是50hz，电缆的长度取100m。"],[102,"再看 data 页，因为我们只有一根电缆，所以这个电缆的总数是一，这个电缆的编号只能是一。"],[116,"在这一片就是各种半径、磁导率、电阻率和介电常数。"],[124,"这个 on 表示有金属屏蔽，这个 on 表示有铠装。"],[128,"电缆的缆芯的中心距地面的距离是0.1m，因为只有一根电缆，这个水平参数没有意义。"],[139,"点击 run ATP，让程序来计算电缆参数。"],[146,"现在我们来看计算结果。"],[149,"这个地方显示有四个文件，我们感兴趣的是 C 10 kV 相关的三个文件。"],[160,"第一个 data 文件，这是 ATP 帐生成的输入文件，ATP 计算的输出文件是。"],[169,"这个 LIS 文件和这个 PCH 文件，PCH 文件是模型文件，LIS 文件中除了包含模型文件之外，还有一些其他的信息。"],[181,"这是 DATA 文件的全部内容，通常的 BEGIN NEW DATA CASE，第二行是调用 CABLE CONSTANTS，第三行是调用 CABLE PARAMETERS，第三行其实把第二行这个子程序覆盖了。"],[204,"这一片数据是电缆的几何和材料参数，这一行是频率参数。"],[212,"现在我们再来看 LIS 文件，LIS 文件中前面这一部分内容大家自己能看懂，我们的重点是看后面的阻抗、导纳这些参数。"],[228,"这是大地阻抗参数，这个是导体的内阻抗参数，这两个合起来就是我们通常所说的电缆的阻抗参数。"],[246,"这是一个三行三列的矩阵，图中显示是六行，其实一、三、五行是电阻，二、四、六行是电抗。"],[263,"这是缆芯的自电阻，这是缆芯的自电抗，它们的单位都是欧姆每米。"],[272,"这是屏蔽的自电阻，屏蔽的自电抗，这是电缆芯和屏蔽的互电阻，它们之间的互电抗，其他参数的含义可以类推。"],[289,"这个矩阵是一个对称矩阵，紧跟着的是导纳矩阵，导纳矩阵也是一个3×3矩阵。"],[304,"第一、三、五行对应的是对地电导，二、四、六行对应的是对地电纳，它们的单位都是西门子每米。"],[316,"西门子这个单位在 ATP 的输出中把欧姆单位倒过来写，即 MHO。"],[323,"可以看出导纳矩阵中的对地电导都为零，还可以看出缆芯和铠甲之间的互导纳也为零，这是显而易见的。"],[338,"接下来是波阻抗矩阵，之后是电流变换矩阵，然后是电压变化矩阵，它们两个是互为逆矩阵。"],[353,"接下来是三个模量的参数，对于单相电缆的三个导体，它们永远不可能换位，更不用说平衡换位，它们的模量是一序、二序、三序，而不是平衡换位线路的正序、负序和零序。"],[380,"下面以一模为例，对模参数进行简单的介绍。"],[385,"这个参数是衰减系数，这是波速，它的单位是米每微秒，这是电阻、电感、电导、电纳、波阻抗的实部、波阻抗的虚部，这是波阻抗的实部和虚部的倒数，也就是波导纳。"],[414,"我们再来看模型参数，这部分内容包含在 PCH 文件中，只不过在这个地方又拷贝了一次，以 C 开头的这些都是注释。"],[431,"这是三个模参数，我们用一模为例来说明贝杰龙模型中的模参数，这是电阻，这是波阻抗，这是波速，这是长度。"],[449,"这个波阻抗和前面一模的实际波阻抗不相等，实际波阻抗是一个复数，因为为了后续暂态计算的需要，波阻抗必须是一个实数。"],[463,"我们在猫道页选择的模波阻抗的计算公式是电感除以电容开根号。"],[472,"如果我们选择第二个计算公式，即模波阻抗等于实际波阻抗的实部，那么贝杰龙模型是这样的。"],[483,"模参数后面紧跟着的是电流变化矩阵，它与 LIS 文件前面出现的电流变换矩阵是相同的。"],[499,"如果选择π模型，就没有模量。"],[508,"所以，这部分菜单就不再出现。"],[514,"计算结果的 lis 文件和前面的也略有区别，没有波阻抗矩阵，也没有和模量相关的参数。"],[525,"在 lis 文件的最后，它是拷贝的模型文件，也就是 punch 文件中的内容。"],[533,"这一片就是它的π模型。"],[540,"下面用简单电路的稳态计算来比较不同的模型。"],[548,"这是300m长的电缆。"],[550,"最上面这个电路中使用贝杰龙模型，模阻抗采用第一个公式。"],[556,"在第二个电路中，电缆同样采用贝杰龙模型，但是模阻抗使用第二个计算公式。"],[565,"在第三个电路中，电缆使用π模型，电压源的电压幅值都是100伏。"],[574,"由于在电缆两端，电缆的屏蔽和铠装都没有接地，所以在屏蔽和铠装上有一个比较高的感应电压。"],[585,"电缆末端的电压是这样的。"],[588,"这个不是原始的输出，为了便于比较，我们把它的顺序做了调整。"],[597,"这是末端缆芯的电压，它们都是100伏。"],[607,"这是末端屏蔽的电压，这是末端铠装上的电压。"],[615,"因为π模型没有模阻抗中的近似过程，而且电缆比较短，所以在这种情况下，π模型的结果是最准确的。"],[629,"比较采用第一、第二模阻抗计算公式的贝杰龙模型，采用第二计算公式的模型，计算结果不论是幅值还是相位都比较准确。"],[643,"这个结论不具备普遍性，大家在计算中碰到具体的问题具体分析。"],[649,"另外还可以看出，如果电缆屏蔽或者铠甲不接地，它上面的感应电压非常高，所以电缆在正常运行的时候，屏蔽和铠甲都是接地的。"]]},{"p":59,"t":"11.3 单相电缆模型3-电容校验屏蔽接地及半导体层处理","d":404,"s":[[0,"大家好，在本期视频中，我们将介绍单相电缆的电容校验、屏蔽和铠装接地以及半导体层的处理。"],[12,"首先，我们介绍电容参数的校验。"],[17,"这是单相电缆的结构。"],[20,"为了说明不同的金属层之间的电容，我们把它画成这么一个图。"],[31,"为了看起来直观，我们把表示最大半径的这个圆圈删掉。"],[36,"C一表示的是缆芯和屏蔽之间的电容，C二，是屏蔽和铠装之间的电容，C三是铠装和大地之间的电容。"],[53,"C一和C二可以用简单的圆柱电容的计算公式来手工计算。"],[61,"电容的计算公式是这样的，其中ε零是空气的介电常数，扣是金属圆筒电容的外半径，r二是它的内半径。"],[76,"还是以我们在前面举例中使用到的10kv电缆为例，计算得到电容C一和C二，它们对应的电纳是y一和y二。"],[90,"C三的公式比较复杂，我们没有计算。"],[95,"下面这一部分是由缆芯、屏蔽和铠装组成的导纳矩阵。"],[103,"当然矩阵中缺少和C三相关的参数。"],[108,"这是ATP计算的导纳矩阵，对地电导都为零。"],[115,"把ATP计算的电纳部分和我们刚才计算的电纳部分比较，两者还是相当吻合。"],[125,"在工程上，屏蔽和铠装都是接地的，相当于C二和C三被短路接地。"],[137,"在ATP的计算中，相应的操作类似于在计算架空线路参数的时候消除地线一样。"],[148,"对于单芯电缆，它的导纳矩阵仅仅包含一个元素，那就是欧米伽C一。"],[157,"这时候电缆的data参数不变，但是model参数中。"],[167,"把相数从三相变为一，那么电缆最外面的两层金属就会接地。"],[180,"下面我们来看计算结果。"],[182,"上面是屏蔽和铠甲都不接地时的导纳矩阵，下面是屏蔽和铠甲接地时的导纳矩阵。"],[192,"接下来我们来讲半导体层的处理。"],[197,"在 data 页面上最下面的两行是半导体层的厚度。"],[202,"当有半导体层时，data 页面的上面仍然是各层金属参数。"],[212,"所以为了减少工作量，我们把前面举例中使用的10kv电缆的金属结构不改变，仅仅增加半导体层。"],[225,"这是增加半导体层前后电缆结构的比较。"],[232,"半导体层在缆芯的外表面和金属屏蔽的内表面。"],[242,"在 data 页面的这些参数中，参数和半导体层的厚度的对应情况是这样的。"],[254,"在 core 这一栏下面，这个参数 in 对应的是缆芯外表面的这一层半导体的厚度。"],[265,"这个参数 out 对应的是金属屏蔽内表面这一层半导体层的厚度。"],[279,"也就是说这两个参数分别是在第一层绝缘的最里边和最外面。"],[286,"类似的，如果在这层绝缘最里边和最外面也有半导体层，相应的厚度填写在这个地方。"],[299,"如果在 arm 层也有，相应的参数填写在这一片。"],[304,"半导体层中不通过电流，也就是说在计算阻抗的时候，半导体层相当于不存在。"],[316,"但是从计算电容的角度来看，半导体是带电的。"],[321,"换言之，在计算阻抗和电容的时候，导体的内外半径实际上是不一致的。"],[331,"ATPDraw用了一个比较巧妙的点子来解决这个问题。"],[336,"在计算阻抗和电容的时候，都使用实际的各层金属结构尺寸。"],[345,"这样算得的电容偏小，因为半导体层缩短了两层金属之间的距离，实际电容会变大。"],[357,"ATP-EMTP 解决的办法是增大介电常数。"],[363,"现在我们把 semicon 这个参数改为0.00058，点击 run ATP，我们看 ATP 的输入文件变化，这一层的介电常数不是原来的三，而是变为3.45868489。"],[383,"如果把参数 semicon out 也变为0.00058，这一层的介电常数进一步增加到3.76008068。"],[397,"大家可以自行验证介电常数的变化是否正确。"]]},{"p":60,"t":"11.4 单相电缆模型4-传播系数和波阻抗校验","d":529,"s":[[1,"大家好，在以前的一期关于架空线路参数的视频中，我们介绍了模阻抗参数的校验，大家对相模变换有了一个比较深刻的认识。"],[17,"这种校验方式也可以用于电缆参数的校验，所以我们不再介绍电缆模阻抗参数的校验。"],[26,"在本期视频中，我们介绍模传播系数和波阻抗的校验，对于电缆和架空线路都是适用的。"],[38,"建议有比较深的理论功底的同学观看本期视频。"],[43,"要校验的架空线路和电缆，我们在以前的视频中都介绍过。"],[50,"一回三相500千伏架空线路和一根单芯10kv电缆，我们已经用 ATP 计算得到了它们的模参数，包括模阻抗、模导纳、模波阻抗和模传播系数，也计算了相域的波阻抗。"],[69,"这是500千伏架空线路的计算结果。"],[76,"这一行是一模，这一行是二模，这一行是三模，各列的参数是这样的。"],[86,"这是一模的电阻、电抗，一模的电纳，这是波阻抗的实部，波阻抗的虚部。"],[100,"这个是不考虑损耗的时候波阻抗，它只有实部没有虚部。"],[109,"这是不考虑损耗的时候的波速，这是实际波速，这是传播系数中的衰减系数。"],[119,"下面我们利用模的阻抗和导纳，通过理论公式来计算模的波阻抗和传播系数，并与 ATP 计算的结果进行比较。"],[132,"第一个公式是模的波阻抗的计算公式，它等于模的阻抗除以导纳开根号。"],[145,"在阻抗中有电阻，有电抗，在导纳中往往这个 G 是等于零的，后面这是电纳。"],[159,"第二个公式是传播系数，它等于阻抗乘以导纳开根号，我们习惯上用 Z 下标 C 表示波阻抗。"],[170,"用伽马来表示传播系数，这两个公式不仅适用于每个模的波阻抗和传播系数的计算，也适用于单根导线的波阻抗和传播系数的计算。"],[189,"其实单根导线仅仅只有一个模。"],[193,"我们继续看传播系数伽马，伽马等于阿尔法加j贝塔，阿尔法实部就是我们通常说的衰减系数，贝塔虚部就是我们通常说的相位系数。"],[217,"波速等于二派f除以贝塔，f是频率。"],[226,"以ATP计算的一模的导纳参数和阻抗参数为基本参数，在MATLAB中我们用刚才的公式计算了一模的波阻抗、衰减系数和波速，它和ATP计算的参数是完全相同的。"],[255,"其实在ATP内部计算的过程也是这样的，它先计算波的模阻抗和导纳参数，再用这几个参数来计算波阻抗、传播系数和波速。"],[271,"可以用同样的方法来校验电缆的模量参数，但是有一点要提醒的是，电缆参数的顺序和单位与架空线路的不同，尤其是第一个参数衰减系数，它的单位是每千米分贝。"],[298,"用变量k来表示，k等于20倍的log e的阿尔法次方，它等于8.6859阿尔法。"],[313,"利用前面类似的过程，用MATLAB计算得到参数，并与ATP的计算结果进行比较，数值是完全相同的。"],[330,"大家看的时候注意它们的不同单位。"],[333,"计算模量波阻抗时。"],[337,"长度的单位是米或者千米，计算结果不变。"],[342,"计算衰减系数的时候，MATLAB 中用的单位是米，ATP 的衰减系数是千米，所以 MATLAB 的结果是6.5056乘以10的负四次方，而 ATP 的计算结果是这个结果的1000倍。"],[366,"对于波速也有类似的情况。"],[369,"前面我们验证了模域的几个参数，下面我们验证相域的一个参数，波阻抗。"],[379,"对雷电过电压进行简单分析的时候，可能会用得上这个参数。"],[385,"在这个表中，罗列了部分计算相域波阻抗的公式。"],[392,"公式一、二、三中都包含了相模变换矩阵，而公式14、五仅仅包含了阻抗和导纳矩阵。"],[404,"无论用哪个公式，最后计算的结果都应该是相同的。"],[410,"我们在 MATLAB 中利用第五个公式来计算500千伏架空线路的相域波阻抗。"],[419,"上面是 ATP 的计算结果，它忽略了波阻抗的虚部。"],[426,"下面是 MATLAB 的计算结果，波阻抗包含实部和虚部。"],[434,"它的实部和 ATP 计算结果的实部非常接近，自波阻抗的实部约为330欧姆。"],[446,"我们用同样的公式来计算10kv电缆的波阻抗，如屏幕上下方所示。"],[455,"屏幕上上方为 ATP 计算的波阻抗，其中包含了波阻抗的实部和虚部，可以看出两者都有差别，但是实部的差别更大。"],[470,"接下来我们打算用前面的五个波阻抗计算公式中的第一个再计算一次波阻抗。"],[482,"首先我们要计算伽马平方和 ti，具体计算伽马平方和 ti 是利用 MATLAB 的一个函数，再把 ti 和伽马带入这个计算公式，就得到波阻抗。"],[500,"相关的理论部分请大家参阅有关参考书。"],[506,"计算的结果与第五个公式计算的结果完全相同。"],[512,"MATLAB计算的波阻抗和ATP本身计算的波阻抗有所差异。"],[520,"到底哪一个计算的结果更加准确，有待大家进一步研究。"]]},{"p":61,"t":"11.5 单相电缆模型5-计算接地电流","d":380,"s":[[1,"大家好，在本期视频中介绍单相电缆屏蔽和铠装中的接地电流。"],[10,"在电力系统中，我们通常遇到的是三相电缆，相关的计算可以参考本视频。"],[20,"我们先来看电缆的结构。"],[26,"红颜色的是电缆的金属层，最中间的是电缆的缆芯，这一层是电缆的屏蔽，这一层是电缆的铠装。"],[40,"网格线的三层是电缆的绝缘层，这一层是缆芯和屏蔽之间的绝缘，这是电缆的最重要的一层绝缘，是主绝缘层。"],[56,"这一层是屏蔽和铠装之间的绝缘层，这一层是铠装与大地、土壤或者水等之间的绝缘。"],[69,"灰颜色的这些层，它是半导体层。"],[74,"这一层半导体和这一层半导体是在所有的电缆中都有，其他的半导体层不一定有。"],[91,"为了方便，我们把导体的内外径用变量 r 二到 r 六表示，r 七表示电缆的最大半径。"],[103,"我们已经在 ATPDraw中建立了电缆的模型和将要仿真的电路。"],[112,"我们先来看电缆模型，只有一根电缆，在上面的这个算例中选择三相，表示它的缆芯、屏蔽和铠装我们都保留。"],[126,"计算频率使用变量 f r e，便于以后修改。"],[132,"我们选择贝杰龙模型。"],[136,"在这个模型下，模参数的计算有两个选项，我们选择的是下面这个选项，大家可以选择第一个选项进行比较。"],[150,"我们再来看 data 页面的参数，所有金属层的内半径和外半径用变量表示，和具体数值是在这边。"],[161,"电缆的最大外半径也用变量 r 七表示，电缆的金属层的尺寸我们是用这种方式来表达。"],[170,"缆芯 r 二是一个具体的数值，其他的各层都是在前一层的基础上再加一些常数，这样便于我们修改电缆的尺寸。"],[184,"再看看电缆的结构。"],[188,"在下面的这个电路中，电缆我们选择的是两相电缆的铠装层，在计算过程中被内部接地。"],[206,"点击 OK，程序计算电缆参数并建立电缆模型。"],[214,"选择在屏幕上显示计算结果，目前显示的是上一次的计算结果。"],[222,"首先选择频率是50hz，tmax 取任意一个负值，我们仅仅进行稳态计算。"],[234,"按 F 二，两个电路的计算结果完全相同。"],[241,"但是如果我们把频率改为5000hz，它的计算结果就会有差异。"],[249,"如果把频率给的更大，比如说10000hz，这个差异就更大。"],[259,"为了解释这种不同，现在把上面的这个电路略加改变。"],[268,"我们把屏蔽和铠装各自接地。"],[277,"再看计算结果。"],[285,"在下面的这个电路中，电缆的铠装层被内部接地，所以这个接地电流是屏蔽的接地电流。"],[301,"在上面的这个电路中，这个电流也是屏蔽的对地电流，那为什么这两个数值不相同呢？"],[311,"我们对上面的电路再进行改变，把铠装层的左端也接地。"],[321,"我们再进行一次计算，右边的屏蔽流入大地的电流完全相同。"],[332,"这个例子说明，如果在电缆的模型中选择消掉铠装。"],[339,"那么铠装的两端都是接地的，如果再选择消掉屏蔽，屏蔽两端同样都是接地的。"],[349,"如果电缆的实际情况不是这样的，那么用户在建立模型的时候，可以建立像上面这样的模型。"],[361,"不要在建立模型的时候消去铠装或者屏蔽，选择保留它们，在LCC的两端对电缆的铠装或者屏蔽进行短路或者开路。"]]},{"p":62,"t":"12.1 三相电缆模型1-基本情况","d":450,"s":[[1,"大家好，在前面的视频中，我们介绍了单相电缆模型，从本期视频开始介绍三相电缆模型。"],[14,"在电力系统中，三相电缆的构成有两种情况，一种是由三根单相的电缆构成，也就是由三根单芯电缆构成。"],[27,"另外一种是把三根单相电缆捆绑在一起，放入圆筒形的金属铠装之中，组成三芯电缆。"],[38,"我们把其中的每一个单根叫做相电缆。"],[42,"三芯电缆中的相电缆的总体结构和单相电缆是相同的，但是有可能少一层或者多层绝缘层，也有可能金属层只有两层。"],[57,"在图中的三芯电缆中，每相电缆有两个金属层，也就是缆芯和金属屏蔽，而且三相的金属屏蔽都是紧紧靠在一起的。"],[71,"在图中的这种三芯电缆中，每一相电缆也有两个金属层，也就是缆芯和金属屏蔽，但是金属屏蔽外面有半导体层或者绝缘层。"],[88,"在三芯电缆中，其中的单相电缆很少有三层金属结构的，如果有 ATP 也能计算这种情况。"],[97,"我们首先介绍由三根单芯电缆组成的三相电缆的参数计算，还是以前面视频中10kv单芯电缆为例组成三相电缆。"],[110,"电缆在空气中同样距地面为0.1m，但是要增加一个参数来表征三根电缆之间的相对位置，这个参数就是电缆间水平中心距离为0.2m。"],[127,"这是我们前面已经建立的10kv单芯电缆的模型。"],[135,"对电缆的名称我们不需要修改，这个地方大家要注意，一定不能选最下面这一项。"],[145,"这项最下面这一项表示多根电缆都放在同一个金属管道中，也就是我们常说的多芯电缆。"],[154,"我们要选择的是单芯电缆。"],[159,"在这个地方原来是一，现在要把它改为三，表示有三根电缆。"],[168,"相数，我们暂时不消除任何金属屏蔽和铠装，所以三根电缆总共是九相，我们把这个数字改为九。"],[182,"再看 data 页，电缆的总根数已经改为三，如果这个地方没有自动更新，大家手工把它改为实际的电缆根数。"],[197,"目前显示的是第一根电缆的数据，这是我们以前输入的数据。"],[204,"第二、第三，第二和第三根电缆，它的数据是 ATPDraw 本身带的一些缺省数据，我们现在把第一根电缆的数据拷贝过来，给第二根和第三根电缆。"],[222,"这么拷贝之后，第二和第三根电缆的本身的参数和第一根就没有任何区别了。"],[240,"下面我们要修改的唯一的参数就是电缆之间的相对位置。"],[246,"把第二根电缆的中心位置，也就是第二根电缆的缆芯的中心位置的水平距离设为零，把第一根电缆的相应位置我们设为-0.2，第三根电缆的相应位置我们设为正的0.2。"],[267,"现在我们用 view 看三相电缆的相对位置。"],[271,"选择不兼容模型，点击下面的 run ATP，我们计算电缆参数。"],[290,"有一点要提醒，在点击 run ATP 的时候，有些子程序它不会计算 punch 文件，只有点击 ok 以后才会有 punch 文件，而在另外情况下点击 run ATP 会产生 punch 文件，目前看来没有规律可循。"],[311,"计算总共产生了四个文件，以 c 10 k v 头的就是我们关注的文件，这个 fort 点四九，它的中间文件，后缀是 data 的文件，这是计算电缆参数的原始文件。"],[332,"后缀是 list 的文件。"],[338,"这是计算结果文件。"],[340,"后缀是 punch 的文件是模型文件，如果在后面进行电路的稳态或者暂态计算，它调用的其实就是这个 punch 文件。"],[354,"下面我们看 lis 文件中的内容，前面的这部分我们越过。"],[363,"接下来这部分是大地回路阻抗矩阵。"],[371,"这一部分是导体的内阻抗矩阵，这两部分加起来就是总的阻抗矩阵。"],[385,"再往下，它是总体的导纳矩阵，因为有九相导体，所有的这些矩阵都是9×9的矩阵。"],[398,"导纳矩阵的电导部分全都是零，可以看出它矩阵的排序是首先是缆芯，然后是金属屏蔽，最后是铠装。"],[411,"而在书中，为了读者阅读和比较的方便，把每根导体的三项参数放在了一起。"],[421,"图中显示的是只有一根单芯电缆的导纳矩阵和由三根单芯电缆组成的三相电缆的导纳矩阵。"],[435,"大家仔细比较它们之间还是有一定的关系的。"],[440,"对于阻抗矩阵的比较，有兴趣的读者可以去看书或者自行仿真。"]]},{"p":63,"t":"12.2 三相电缆模型2-消去屏蔽铠装计算序参数(3根单芯电缆)","d":628,"s":[[1,"大家好，在上期视频的基础上，我们继续介绍三相电缆如何消去接地的屏蔽和铠装，以及如何计算它的序参数。"],[15,"将要示范的例子和上期视频中的例子一样，由三根单相电缆组成三相电缆。"],[24,"在上期的视频中，我们介绍了由三根单芯电缆组成的三相电缆的基本参数的计算，得到了9×9的阻抗矩阵和导纳矩阵。"],[40,"为了方便计算序参数，我们把电缆进行换位。"],[46,"在程序中计算换位比较简单，就是把不换位情况下计算得到的数据进行平均。"],[55,"选择贝杰龙模型，我们计算得到阻抗矩阵和导纳矩阵。"],[63,"在 LIS 文件的后面，它也有模参数。"],[70,"因为是九相导体，总共有九个模参数。"],[77,"现在我们把总的相数从九相减为三相，这样只有三个缆芯不接地，其他的屏蔽和铠甲都接地。"],[94,"点击 Run ATP，我们看计算结果。"],[99,"在 LIS 文件中，原来的总的9×9阻抗矩阵和导纳矩阵没有了，而是变成了3×3的阻抗矩阵和导纳矩阵。"],[113,"现在仅仅有三个模量。"],[116,"为了方便观察，把消去屏蔽和铠装前后的阻抗矩阵和导纳矩阵放在一起。"],[125,"这是消去屏蔽和铠装之前的阻抗矩阵，这是消去之后的阻抗矩阵，这是对应的导纳矩阵。"],[137,"这个示意图是由三根单芯电缆组成的三相电缆的电容结构。"],[146,"缆芯和屏蔽之间，屏蔽和铠装之间，铠装和大地之间，以及不同相的铠装之间存在电容。"],[159,"当金属屏蔽接地、铠装接地的时候，有效的电容仅仅剩下缆芯对屏蔽的电容，也就是缆芯对大地的电容。"],[176,"所以在消除金属屏蔽和铠装前后，缆芯之间的导纳矩阵是完全相同的，而且缆芯之间只有自导纳，没有互导纳。"],[192,"计算所得的互导纳数据是10的-25次方级别，可以认为是等于零。"],[200,"现在我们来看接地方式。"],[204,"上面的这个图是架空线路地线的接地方式，左边是主杆塔接地，在地线中有电流，地线电压为零。"],[218,"右边是分段接地，地线中不通过电流，地线的电压为零。"],[226,"从计算电气参数的角度来看，电缆的屏蔽和铠装也可以看成是电缆的地线。"],[238,"在后面为了叙述简单，我们有时候把电缆的屏蔽和铠甲也称为电缆的地线。"],[246,"对应架空线路地线的接地方式，屏蔽和铠装也有两种接地方式。"],[255,"下面左边这个图，电缆的地线两端接地，交叉互联接地也是两端接地的一种形式，对应于架空线路的主杆塔接地。"],[271,"在下右这个图中，电缆的地线一端接地，相当于架空线路的地线分段接地。"],[281,"在 ATP 的参数计算中，到底应用的是哪种接地方式，没有找到相关的文献说明，我们自己来判断。"],[292,"以阻抗矩阵为例来说明，把阻抗矩阵分为四个分块矩阵，使用和教科书中相同的符号来表示。"],[305,"书上29页有错误，我们在这个地方指出来。"],[310,"这个阻抗矩阵的分块矩阵 ZPj 应该是 ZjP 或者是 ZPj 的转置矩阵。"],[326,"把下面这两个公式的 z p j 也换成 z j p，这两个地方完全是书写错误，把 p 换成 z。"],[340,"如果地线是阻止杆塔接地，消除地线以后阻抗矩阵的计算公式是这样的。"],[350,"如果地线是分段接地，消除地线以后阻抗矩阵刚好是分块矩阵的第一块矩阵，因为这个时候地线中不通过电流，所以和地线相关的三个矩阵都不参与计算。"],[373,"根据前面的分析，我们可以这么初步来判断电缆的地线的接地方式。"],[385,"如果消除地线以后，它的阻抗矩阵刚好是这一块矩阵，电缆采用了一点接地。"],[393,"如果不满足这个条件，那么电缆的地线可能是两端接地。"],[400,"我们来看 ATP 的计算结果，确实不满足这个条件，所以我们初步判断在 ATP 中电缆采用的是两端接地方式。"],[414,"我们用这一个公式来进一步验证。"],[417,"上面是公式的计算结果，我们用的 MATLAB 做的计算，下面是 ATP 的计算结果。"],[427,"考虑到 ATP 是几10年前的程序，所以可以认为这两个数据是一致的。"],[434,"这就证实了我们前面的推测，在 ATP 中计算电缆的参数时，当消去金属屏蔽和铠装时，采用的是两端接地方式。"],[451,"有了电缆的阻抗矩阵，我们就可以计算电缆的正序和零序阻抗。"],[458,"屏幕上方是计算公式，下面是计算结果。"],[464,"前面完全是通过计算的形式得到了电缆的正序和零序参数。"],[473,"下面我们把电缆的模型放在完整的电路中，模拟电缆的实际接地情况，把电缆的右端接地，左端接入一个安培的电流源，来计算左端的电压。"],[491,"当电缆的长度为1000m时。"],[494,"电缆首端电压就是电缆每千米阻抗值。"],[498,"从上到下的电路的接地情况是这样的。"],[504,"第一行是一端接地，都在右端接地。"],[509,"第二行是两端接地，左端和右端都接地。"],[516,"如果右端直接接地，不用一个小电阻，有时候计算会出错，所以这个地方加了一个很小很小的电阻。"],[526,"第三行电缆的屏蔽和铠装两端接地，但是在电缆中间进行了交叉互联，形成了一个完整的换位。"],[538,"第四行有两个完整的交叉互联换位，只计算连续参数。"],[544,"我们使用的是π模型，取的长度是100，scale中选择100，这个电压值就是每米阻抗值。"],[557,"对于有一个完整换位的交叉互联电缆的总长度是100m，对于有两个完整换位的情况，它的总长度是200m，所以它显示的阻抗值应该是二倍。"],[577,"计算结果都已经显示在屏幕上了。"],[581,"为了方便比较，把前面理论计算的结果放在屏幕的右上方。"],[589,"可以看出，电缆的屏蔽和铠装两端接地情况下的计算结果和前面的计算结果是一致的，也进一步证实了前面的推断。"],[604,"对于导纳矩阵，因为电导为零，所以只有电容起作用。"],[611,"当金属屏蔽和铠装接地之后，在这个电容系统中起作用的仅仅是缆芯和屏蔽之间的电容。"],[623,"电缆的连续和正序电容都等于这个电容。"]]},{"p":64,"t":"12.3 三相电缆模型3-消去屏蔽铠装计算序参数(三芯电缆)","d":817,"s":[[1,"大家好，在本期视频中，我们介绍在一根电缆中包含三芯的三相电缆参数的计算。"],[12,"使用的算例是这本书第15.2节中的一根10kv三芯电缆，其中的每根子电缆就是我们前面介绍过的10kv单芯电缆，不同的是子电缆只有两层金属缆芯和金属屏蔽，子电缆没有铠装层，但是这根10kv电缆有铠装层。"],[41,"电缆的结构是这样的，这是三根子电缆，这是其中一根子电缆的缆芯，它的绝缘，它的金属屏蔽，金属屏蔽外面这些全都是填充材料，也是一种绝缘材料。"],[64,"在外面是整个电缆的金属铠装，最外面一层是另外一层绝缘材料。"],[72,"现在来看三芯电缆的参数，它的大部分参数和单芯电缆是相同的，但是有些参数的含义有变化，也增加了一些参数。"],[87,"给电缆起个名称，这是电缆的名称，不是项目文件的名称。"],[94,"在这个地方要选择最后一项，这个意思是把几根电缆装入一个管道中这么一种形式，简单的说就是多芯电缆。"],[106,"这一片根据情况选择在空气中或者在地下，在我们的例子中电缆在地下，这一片的参数和单相电缆没有区别，最下面这个参数和单相电缆也是没有区别的。"],[122,"大家比较困惑的是这个地方电缆的根数是选一根还是三根，这个地方还是选三根。"],[131,"相数在我们这个例子中，每根子电缆有两相金属导体，三根子电缆总共有六相导体，再加上最外面的铠甲，它总共是有七相。"],[147,"如果把这个七改为六，表示最外面的铠装接地，不接地的导体共有六相。"],[154,"这一块的参数和单相电缆也没什么区别，这是大地电阻率，这个数据表示在这个频率下计算电缆参数。"],[169,"电缆长度仅仅从计算参数的角度而言，这个长度没什么意义，它最后的结果都是单位长度的参数。"],[178,"这一片的内容和这一片的内容是新增加的内容。"],[185,"这一片我们暂时不关注，这一块是和最外层的铠装相关的内容，以及电缆中心距地面的距离。"],[197,"第一个参数就是电缆的中心在地面以上或者地面以下距地面的距离，在地面以上或者地面以下取决于这边的选项。"],[214,"R in 是金属铠装的内半径，R out 金属铠装的外半径，R ins 是铠装外面的一层绝缘层的厚度，这个参数是金属铠装的电阻率，这是金属铠装的磁导率，正常情况下是一。"],[236,"这是金属铠装里边填充的绝缘材料的介电常数，这是金属铠装外面一层绝缘材料的介电常数。"],[247,"现在看 data 页面的参数。"],[251,"这些参数和单芯电缆完全相同，这表示有三根子电缆，这是其中的第一根、第二根和第三根。"],[267,"在我们的这个例子中，它们都没有单独的金属铠装。"],[272,"这两个参数和单芯电缆不同，单芯电缆对应的两个参数是水平距离和垂直距离。"],[286,"对于三芯电缆，上面的这个参数表示这个子电缆的中心与整个电缆中心的距离。"],[297,"接下来的参数是角度，以整个电缆的中心为极坐标的原点，这就是这根子导线的中心线的角度。"],[309,"三根子导线的中心线的角度分别为90°、210°和330°。"],[319,"点击位有，我们看电缆的结构示意图，左边的这个图是像素为七的情况，最外面黑颜色的这一圈是铠装，它和缆芯、金属屏蔽都是黑颜色的。"],[338,"表示没有接地。"],[340,"在右面这个图中，总相数是六相，铠装的颜色是白颜色，表示它已经接地。"],[349,"现在我们把铠装接地，总相数就是六相，做一次计算，我们来看计算结果。"],[360,"这是类似文件中的内容。"],[373,"这是电位系数矩阵，这个矩阵中包括铠装。"],[378,"这是经过换位后的电位系数矩阵，同样包括铠装。"],[388,"这是大地的内阻抗，这是导体的内阻抗，这是电缆的总阻抗，它已经把铠装消掉了。"],[403,"这是总的导纳矩阵。"],[407,"这是六个模量。"],[412,"最后面的这一部分是拷贝的 PUNCH 文件的内容，因为我们在前面的计算中选择的是不兼容模型，所以在这个地方给出的是六个模量。"],[429,"现在我们把相数改为三，不仅铠装接地，每根子电缆的金属屏蔽也接地。"],[441,"这个地方我们选择换位，再看计算结果。"],[449,"这些原始的矩阵它没有变化。"],[456,"但是只有3×3的阻抗矩阵和3×3的导纳矩阵，而且我们在前面已经换位了，所以它们两个都是平衡矩阵，可以参照由三根单芯电缆组成的三相电缆的正序和零序参数的计算方法来计算这个电缆的正序和零序参数。"],[486,"这是阻抗的计算结果。"],[490,"对于续导纳或者说续电容，类似于单相电缆，正序和零序电容都等于缆芯对金属屏蔽的电容。"],[503,"这样计算平衡换位线路或者电缆的零序和正序参数。"],[508,"这是通常的做法，但是 ATP 并没有这样做，它计算出了三个序参数。"],[517,"这是 ATP 计算得到的阻抗矩阵、导纳矩阵、相模变换矩阵以及模参数。"],[524,"为了方便比较，删掉了部分它们之间的内容。"],[530,"下面根据猜测，我们介绍 ATP 如何计算得到这些模量参数的。"],[538,"红色方框中是计算过程，T i 是相模变换矩阵，这是 ATP 计算的结果。"],[547,"我们把很小的虚部省略掉了，这个不会影响计算结果。"],[552,"省略虚部以后，T i 其实就是克拉克变换矩阵的一种形式。"],[558,"红色方框中的中间这个公式把模域的阻抗转化为相域的阻抗，下面的这个公式把模域的导纳转化为相域的导纳。"],[572,"这两个公式都是把互相耦合的向量转化为互相不耦合的模量的通用计算公式，通常用于转换不平衡的向量矩阵，当然也可以用于平衡矩阵的转换。"],[589,"由此可见，即便是三相平衡矩阵，既可以转化为正序、负序和零序，其中正序参数等于负序参数，也可以转化为一序、二序和三序参数，这三个序参数互不相等，而且这两种序参数之间存在一定关系。"],[615,"如果使用平衡矩阵的这两个转换公式，就得到了传统的正序和零序参数。"],[625,"也可以把 ATP 计算得到的 T i 归一化得到这个矩阵，则有 T i 的逆矩阵等于 T i 的转置矩阵，这样用红框中的公式来来转换阻抗矩阵和导纳矩阵，同样也得到的是正序和零序参数。"],[649,"通常认为把平衡矩阵转化为正序和零序参数会给计算带来方便，我们现在还不知道为什么 ATP 中把平衡矩阵转化为三个模量。"],[665,"下面介绍计算海底电缆参数的一些思想。"],[669,"海底电缆它的结构总体上和陆上电缆相同。"],[677,"但也有特殊之处。"],[680,"我们以图上的这一个海底电缆为例来说明不同的地方。"],[687,"这是它的金属屏蔽或者铅套，在金属屏蔽的里边，它肯定是有绝缘屏蔽。"],[697,"在有的情况下，在绝缘屏蔽外面有一层半导体阻水带。"],[704,"在计算中，把绝缘屏蔽和半导体阻水带都看成是绝缘屏蔽。"],[711,"横缆和常规电缆另外一点不同之处是，在横缆的金属屏蔽外面，有时候会有一层类似于半导体层。"],[728,"在这种两层金属结构的电缆中，在 ATP 的模型中，这是一层绝缘层。"],[737,"下面我们来分析如何处理这层半导体层。"],[743,"这个半导体层影响金属屏蔽的电容，但是其中不会有电流通过。"],[750,"而在电缆正常运行时，金属屏蔽是接地的，所以我们可以忽略这一层半导体层。"],[760,"也就是说，把这一层半导体层看作是绝缘层。"],[766,"把这层半导体层以及整个填充区域的水都看成是绝缘的。"],[776,"绝缘材料的磁导率是一，它的介电常数是水的介电常数。"],[783,"其实这个介电常数的具体值不重要，因为金属屏蔽要接地。"],[790,"对于陆地上位于土壤中的电缆，这个地方是土壤的电阻率，这个地方是电缆的深度。"],[803,"那么对于海缆来说，这个地方就是海水的电阻率，这个地方就是海缆位于水平面下面的深度。"]]},{"p":65,"t":"12.4 三相电缆模型4-电缆的交叉互联及LCC模板(3根单芯电缆)","d":868,"s":[[0,"大家好，在前面的一集视频中，我们介绍了由三根单芯电缆组成的三相电缆的交叉互联。"],[12,"在正常运行时，电缆的缆心中流过正序电流，这样屏蔽中的感应电压互相抵消，感应电流会变小。"],[24,"如果在电缆缆心中流的是零序电流，交叉换位不会造成任何影响。"],[33,"在电缆的阻抗计算参数中也能够看到这一点。"],[40,"我们先来看正序阻抗的计算。"],[44,"有一点需要首先说明，在图上的六个电路中，电缆都是经过换位的。"],[55,"在电缆的参数中，我们选择 snakey，最上面是电缆的缆芯和屏蔽只有一端接地的情况。"],[69,"这个是屏蔽和缆芯两端接地的情况。"],[75,"由于屏蔽中有电流，所以电阻大于只有单端接地的时候的情况，而电感变小。"],[88,"最下面是屏蔽和铠装交叉互联，两端都接地的情况，对应的正序阻抗和最上面屏蔽和铠装单端接地的情况完全相同。"],[107,"对于零序阻抗，屏蔽和铠装一端接地和两端接地后，阻抗的变化趋势和正序阻抗是相同的。"],[122,"由于两端接地，屏蔽中留有电流，所以电阻会增大，电感会减小。"],[131,"当屏蔽和铠装交叉互联，两端接地时，对应的阻抗和两端接地的情况相同。"],[143,"因为在这两种情况下，屏蔽中流过的电流都是相同的。"],[153,"现在我们把起短路作用的这个小电阻换为电流测量仪，看其中流过的电流。"],[167,"按 F 二做一次计算，看计算结果。"],[194,"有效数据只有一位，我们把它的显示精度提高到五。"],[202,"先看我们算例中正序的情况。"],[216,"屏蔽和铠装两端接地时，在屏蔽中流过的电流是0.094安培。"],[225,"电流源的电流是一个安培，在屏蔽中有10%的电流，而在铠装中有0.6%的电流。"],[242,"如果屏蔽和铠装都经过交叉换位，屏蔽中的电流是2×10的负八次方，铠装中的电流更小，2×10的负九次方。"],[253,"从这个例子中我们可以看出交叉换位的效果。"],[258,"我们再来看零序电流作用下的情况，这种交叉换位对屏蔽和铠装中的电流没有影响，屏蔽中的电流都是0.598安培，大约为60%。"],[275,"铠装中的电流是0.038安培，大约4%。"],[285,"关于电缆的换位，刚才我们介绍的是屏蔽和铠装交叉换位的情况。"],[294,"电缆还有一种换位方式，屏蔽和铠装不进行交叉互联，但是缆芯进行交叉互联。"],[305,"我们把上面的这一部分内容拷贝下来，做一个简单的变换。"],[315,"按 F 二进行一次计算。"],[336,"只有红框中，数量在很小的内容发生了变化，电缆的正序和零序参数并没有发生变化。"],[353,"这是因为我们对电缆进行了换位，也就是选择了 snake。"],[361,"实际上电缆的换位在工程上很少发生。"],[369,"对于较长的电缆，通常要进行交叉互联。"],[376,"接下来我们不选择 snake，对这八个电路进行重新计算。"],[385,"在计算之前，我们先改变屏蔽的厚度。"],[390,"我们要使用 LCC 的模板功能。"],[394,"选择一个刚才使用的 LCC，点击模板。"],[406,"这样我们就建立了一个 LCC 的模板，它的名称是 C 10 kV。"],[419,"接下来我们要调用这个模板。"],[423,"这时候选择 LCC section，打开，在这个区域显示的是在目前的电路文件中的模板名称，我们只有一个模板。"],[445,"有三个参数可以修改，一个是长度，一个是频率，还有一个是大地电阻率。"],[457,"注意这个地方显示的是千米，但是继续操作的时候它会变成米，所以我们直接输入米，100m。"],[469,"频率50hz不发生变化，大地电阻率原来是50，我们还是把它给换为50。"],[481,"点击 OK，这个时候会有个问题，LCC section 两端的节点不正确。"],[491,"这每端应该是有九个节点，ATPDraw 这个版本的一个 bug，点击模板，点击 OK，LCC section 的节点就自动正确了。"],[502,"现在。"],[502,"我们用这个 LCC section 来替换这四个长度都为100m的电缆。"],[503,"Control C，Control V。"],[503,"还是 Control V。"],[503,"继续把下面的两个也进行更换。"],[503,"下面的这3~412个电缆段，每段的长度是33.3m。"],[504,"所以我们在这个地方把它的长度改为33.3。"],[504,"然后用它来替换所有的这12个电缆段。"],[505,"替换完之后，我们再按 F 二进行一次计算。"],[576,"截至目前，电缆的任何参数没有改变，所以计算结果也不应该有改变。"],[588,"现在我们来改变电缆屏蔽的厚度。"],[593,"在这个电路中，现在有16个电缆段。"],[597,"使用模板的好处是，我们在模板中修改一次屏蔽的厚度，16个电缆段中的屏蔽厚度也随之一次修改，这样大大提高了建立电路的效率，减少了人工出错的概率，也方便检查。"],[616,"现在我们把电缆屏蔽的厚度从0.12mm增加到0.42mm。"],[627,"把三相的这个数据都进行修改。"],[634,"我们再看一看它的结构。"],[641,"接下来取消电缆换位。"],[650,"再按 F 二进行一次计算，这次计算需要一段时间，我们直接看结果。"],[666,"可以看出，计算结果发生了变化。"],[672,"现在我们简单看一看正序参数。"],[677,"屏幕上显示的这四个数据都是正序电阻，其实是A相的电阻，点击就能看到三相的数值。"],[694,"在第一种情况下，三相的阻抗不相等，因为电缆没有换位，最大和最小相差约10%。"],[715,"这种情况电缆屏蔽和铠装两端都接地，它也存在类似的问题，三相的电阻值大于第一种情况下的电阻值，三相的阻抗也互不相等，最大和最小相差大约也是10%。"],[738,"把第二种情况下的屏蔽和铠装进行交叉互联，就得到了第三种情况。"],[749,"这是目前在国内大部分比较长的电缆采用的情况。"],[755,"大家不要认为这种情况进行了均匀换位，我们看它的阻抗参数，它的三相阻抗参数也是不相等的，最大和最小值相差约10%。"],[771,"但是在这种情况下，流经屏蔽的电流非常小。"],[781,"在第二种情况下，流过屏蔽A相的电流是0.32安培。"],[790,"而在第三种情况下，流经屏蔽A相的电流是0.008安培，而且我们还可以看出三相流经屏蔽的电流是大小相等，相位相同。"],[812,"比较理想的交叉互联方式是第四种方式，也就是缆芯交叉互联，但是这种情况是在高压进行交叉互联，需要的电缆头比较多，施工复杂，成本高，国内采用的非常少。"],[838,"比较四种方式可以看出。"],[841,"第四种方式，A 相的电阻最小，而且第四种方式是一种平衡换位方式。"],[852,"不仅如此，在第四种方式下，流经电缆屏蔽的电流也最小，可以忽略不计。"]]},{"p":66,"t":"12.5 三相电缆模型5-JMarti模型(3根单芯电缆)","d":393,"s":[[1,"大家好，在本期视频中，我们介绍如何建立电缆的JMarti模型。"],[8,"这是在前面的视频中使用过的算例。"],[14,"我们看看它的结构。"],[20,"这是电缆参数，电缆有缆芯，有屏蔽，还有铠装。"],[33,"在这种方式下选择JMarti模型，选择的变换矩阵的频率是5000hz。"],[42,"有一点要特别注意，对于架空输电线路，如果选择了换位，这个参数不起任何作用。"],[51,"因为架空线路采用的是均匀换位。"],[57,"由于电缆的特殊结构，在绝大部分情况下，电缆的换位不是均匀换位，所以这个参数会起作用。"],[69,"也就是说，在不同的频率下，变换矩阵不一样。"],[75,"JMarti模型拟合的频率范围从0.5hz开始的六个10倍频，也就是从0.5hz开始到5×10的五次方赫兹，在每个10倍频中取10个点进行计算。"],[95,"为了能够直观的看拟合效果，我们把这里面几个参数进行修改。"],[105,"把ifplot改成一，把ifdata改成一。"],[115,"把下面的这个ifplot改成一，把这个ifdata也改成一。"],[123,"这么修改以后，尤其是在建立JMarti模型进行拟合的时候，在屏幕上会显示拟合前后的波阻抗和传播系数的曲线。"],[141,"而且在lis文件中会有更多的数据。"],[147,"现在屏幕上显示的是模拟波阻抗拟合前后的曲线。"],[154,"当屏幕暂停的时候，按任意一个键，屏幕上就会出现下一条曲线。"],[162,"有关细节见以前的视频以及书上的描述。"],[169,"红颜色是原始数据，绿颜色的曲线是拟合后的数据。"],[177,"在低频区和高频区拟合效果都不好。"],[181,"这是模一的传播系数的拟合情况，在高频情况下也拟合的不好。"],[189,"拟合不好的主要原因是在高频时模波阻抗的数据发生跳变。"],[196,"这是模二的情况，这是模三，模二和模三相对好一些。"],[203,"这是模四的情况，可以看出这个原始的波阻抗它有跳变的情况，模四波阻抗的拟合效果比较差。"],[216,"这是模四的传播系数，在高频的时候它的原始参数也发生跳变。"],[221,"这是模五的情况，模五拟合总体比较好。"],[227,"模六总体还可以，拟合前模七的波阻抗也有发生跳变的情况。"],[238,"接下来是模八，总体还可以，模九的拟合也比较好。"],[244,"这是九个模的拟合情况。"],[246,"模的波阻抗发生跳变导致拟合不精确。"],[254,"这个跳变不是因为实际的波阻抗发生了跳变，而是因为这种数学方法使用的相模变换矩阵的原因。"],[265,"下面我们来看计算后的 LIS 文件，因为这个电缆的名称是 C 10 kV，所以计算的结果是 C 10 kV 点 LIS。"],[279,"打开 LIS 文件，LIS 文件的结构我们在以前的视频中已经讲过，这里我们不再重复。"],[290,"我们直接走到这个 LIS 文件的最后。"],[296,"从这个地方开始就是解码器的模型，在最后面出现的是相模变换矩阵，这是一个9×9的矩阵。"],[311,"每一行只显示六个数据，所以第一行和第二行其实都是矩阵的第一行的实部，第三行和第四行是矩阵的第一行元素的虚部，下面以此类推。"],[333,"现在我们回过头再来讲一讲模四的拟合情况。"],[339,"由于原始模参数的跳变，导致拟合结果很不准确。"],[347,"但是在反复试算中，也总结了一些经验。"],[353,"改变图中红框中的这两个数据，相当于改变JMarti模型的最小频率和最大频率。"],[365,"通过试算和观察曲线，也能找到一种比较理想的拟合情况。"],[373,"上图是我们刚才计算的初始频率为0.5hz时的模式的情况，下图为初始频率等于0.05hz时模式的情况。"],[387,"显然下图的拟合情况要比上图好很多。"]]},{"p":67,"t":"12.6 三相电缆模型6-变换矩阵随频率变化(3根单芯电缆)","d":377,"s":[[1,"大家好，在使用电缆的杰马线模型的时候，发现往往计算出现问题，要不死机，要不结果错误。"],[15,"ATP处理多相耦合导线，包括电缆的基本方法是通过相模变换，把互相耦合的导线进行解耦，变成多根没有耦合的单向导线。"],[30,"对于输电线路来说，不同频率下的相模变换矩阵基本相同，但是对于电缆来说，随着频率变化，相模变换矩阵也随之变化。"],[45,"在计算中只能选择某一频率下的相模变换矩阵用于所有的频率，这是一种近似。"],[58,"对于输电线路来说，这种近似不会造成多大问题，但是对于电缆来说，这种近似可能导致致命的错误。"],[71,"在输电线路电磁暂态仿真及应用一书的第10.4节，以一条750千伏线路为例，介绍了变换矩阵的参数随频率变化的情况。"],[85,"削去地线以后，系统只有三根相导线，所以相模变换矩阵为3×3矩阵，共有九个元素，每一个元素的虚部都很小。"],[100,"在电磁暂态计算中，虚部被省略，而且必须被省略，否则可能出现意想不到的问题。"],[110,"下图是这九个元素随频率变化的情况，可以看出，在频率较低的范围，它们稍微变化大一些，随着频率增高，这种随频率变化的趋势很小。"],[128,"在本期视频中，以三根单芯电缆组成的三相电缆为例，介绍电缆的相模变换矩阵随频率变化的情况。"],[142,"这是在前面的视频中使用过的算例，也是输电线路电磁暂态仿真及应用一书中第15章中使用的算例。"],[155,"我们看看它的结构，因为我们仅仅关心变换矩阵。"],[170,"所以我们既可以选择贝杰龙模型，也可以选择JMarti模型。"],[179,"在这两个模型的 LIS 文件的最后，或者是 PCH 文件的最后，都是变换矩阵。"],[191,"在同样频率下的变换矩阵，计算的结果是相同的。"],[197,"比如说，我们先用JMarti模型，选择变换矩阵的频率为5000hz。"],[206,"其他的和频率相关的四个参数都不重要，这个参数、这个参数、这个参数和这个参数。"],[218,"只要计算能够顺利进行，最后得到的相模变换矩阵肯定是正确的。"],[226,"点击 OK 或 Run ATP 进行计算，这是在计算的结果文件 LIS 文件最后的相模变换矩阵。"],[238,"下面我们选择贝杰龙模型进行计算。"],[244,"注意在这个时候，这个频率不是一个频率范围，它规定了在某一个频率下面进行模量参数的计算。"],[260,"为了和JMarti模型一致，这个地方选择的频率是5000hz。"],[265,"同样点击 OK 或者 Run ATP 进行计算，这是出现在 LIS 文件最后的相模变换矩阵。"],[276,"把两种模型计算所得的相模变换矩阵，在 LIS 文件中的第一列的部分数据进行比较，它们完全相等。"],[288,"接下来，为了节省时间，我们选择贝杰龙模型，计算从0.05hz到50000hz下的变换矩阵，取出变换矩阵的第七列数据。"],[308,"注意不是 LIS 文件中变换矩阵第七列的数据，因为 LIS 文件每一行仅仅显示六列。"],[317,"把这些数据放在一起，蓝颜色背景的是实部，白颜色背景的是虚部。"],[326,"把实部和虚部分别绘制为随频率变化的曲线，虚部的数值比较小，不再讨论。"],[337,"把10步各元素随频率变化的曲线与输电线路的对应曲线进行比较，可以看出电缆的变化矩阵各元素随频率变化的波动情况要比输电线路的大很多。"],[355,"但是在JM模型或者Bergeron模型中，只能选择某一特定频率下，比如5000hz下的变化矩阵作为所有频率下的近似变化矩阵，这就导致了误差，甚至计算不稳定。"]]},{"p":68,"t":"13.1 雷电过电压1-雷电流的设置","d":963,"s":[[1,"大家好，从本节视频开始，将和大家讲解雷击过电压在 ATP 中的建模与仿真。"],[11,"本节视频主要讲解 ATPDraw 中冲击源的设置。"],[20,"在 ATPDraw 中右键选择电源，其中 surge type 15类型的电源就是雷电流冲击源模型，其中包括双指数波模型，在 ATPDraw V 六版本中是 surge 冲击源模型。"],[38,"有 Heidler 冲击源模型、Standard、Segure 以及双指数波 Heidler、Standard 的拟合模型。"],[49,"本节视频主要讲解色指双指数波模型以及 Heidler 模型，还会为大家讲解在 ATPDraw 中没有相关电源模型时，如何自定义电源模型。"],[66,"首先我们先来看双指数波模型，也就是色指冲击源。"],[74,"为了节约时间，我们已经搭建好了相关模型。"],[81,"在 ATPDraw 7.3版本中，右键电源15型冲击源中，我们可以看到其中这个双指数波有两种，一种是 V 六版本的色指冲击源，另外7.3版本中增加了一种双指数波的拟合模型，我们将就这两种模型进行讲解。"],[105,"第一个电源就是 V 六的色指冲击源，第二个就是双指数模型的拟合形式。"],[112,"我们均给这两个雷电流的电源串上了一个一欧的电阻，并输出了这个电阻的电流，使电阻的末端接地，这样流经这个电阻的电流就是雷电流的波形。"],[129,"我们在研究雷击过电压时，仿真步长一般都是10的负九次方秒级别，仿真时长大约都是数10个微秒，大家可根据需求进行调整。"],[144,"首先我们先来看原始的色指冲击源，双击电源，点击 help 来查看帮助。"],[153,"首先我们把电源设置为电流源形式。"],[158,"其次我们来看第一个参数幅值，这个幅值为一个校正因子乘以我们想要得到的雷电流的幅值。"],[168,"例如，现在我们想要得到单位大小的雷电流，也就是雷电流的幅值为一安，以1.250μs的雷电流为例，乘以1.037，得到的就是1.037，填到幅值处。"],[184,"此外，这个 a 是决定雷电流下降速率的时间常数，b 是决定雷电流上升速率的时间常数。"],[193,"不同的雷电流波形对应不一样的时间常数，对应不一样的幅值校正因子。"],[203,"因此，对于原始设置冲击源模型来说，它的参数设置较为复杂，因为既要考虑幅值的校正因子，还需要考虑不同雷电流波形下 a b 参数的不同，因此对使用这种模型的用户来说，设置较为复杂。"],[226,"在此我们给出了一些常见波形的相关参数，供大家参考。"],[233,"为了解决设置冲击源参数设置复杂的问题，ATPDraw 7.3版本提供了双指数波的拟合模型。"],[244,"双击电源来看相关的参数设置，点击 help 查看帮助。"],[252,"首先 peak 直接输入需要得到的雷电流的峰值即可。"],[261,"t 一代表雷电流的波头时间，t 二代表雷电流的半波时间。"],[272,"在这里直接输入相应的值即可，内部的幅值校正因子以及时间常数 a b 会自动计算。"],[283,"这里有一个较为重要的参数是 p e r c，这个参数有四种选择，我们一般选择默认30。"],[293,"我们通常所说的波头时间指的是达到峰值30%的时间与达到峰值的90%的时间差的1.67倍，除以0.6就是1.67倍。"],[308,"我们通常说的波头时间就是取的这一个定义，所以我们通常取30就可以。"],[317,"此外还有一个选项是参数拟合，是通过 ATP 的内嵌方法，还是通过 ATPDraw 的优化算法，我们先选择 ATP 的内嵌方法，然后再建立一个拟合模型。"],[337,"选择 ATPDraw 的优化算法。"],[339,"我们进行仿真计算来看三者的差别。"],[345,"然后我们点 F 二进行仿真计算。"],[350,"然后点 F 五查看计算结果。"],[356,"前面是它的输入文件，可以看出15型的冲击源，节点名称 S U，电流源形式，它的幅值是1.037，它的时间常数 A，时间常数 B，以及它的持续时间。"],[375,"我们可以看到由 ATP 进行拟合的元件，Surge Fit，具有一行注释行，包含的信息有波前时间1.2μs，半波时间50μs，P E R C 取30，双指数波形式，内嵌拟合方法，这是它拟合出来的参数，1.0372522是它的幅值校正因子，以及两个时间常数。"],[407,"这三个参数是由 ATP 内嵌拟合方法得到的。"],[413,"Fit 二是由 ATPDraw 参数优化得到的。"],[418,"这是它的幅值校正因子，时间常数 A，时间常数 B。"],[425,"然后我们来看参数计算结果。"],[429,"第一个是常规的设置冲击源，是需要手动进行参数校正的，需要输入 A B 时间常数的。"],[440,"Surge Fit 代表由 ATP 内嵌拟合方法计算得到的结果。"],[448,"Surge Fit 二代表由 ATPDraw 进行参数优化得到的 surge 冲击源。"],[454,"我们到最后来看极值，可以看出这个是常规的设置冲击源，第二个是由 ATP 进行拟合的，第三个是由 ATPDraw 进行参数优化的。"],[469,"有结果可得三者均10分接近一安。"],[474,"常规的达到峰值的时间是2.087μs，由 ATP 和 ATPDraw 进行拟合的均为2.089μs。"],[486,"可以看出由 ATPDraw 进行拟合的更接近一安，推荐使用这种方法，但三者相差不大，均在工程允许范围内。"],[498,"Heidler 冲击源模型相较双指数波而言。"],[504,"在数值计算和拟合效果上更贴近实际雷电流，因此在现在大多数研究中得到了广泛应用。"],[514,"我们双击 Heidler 冲击源，需要设置的参数是峰值，这个峰值不需要校正，达到峰值所需要的时间，与严格的1.67倍的 t 90减 t 30定义的波头时间略有不同。"],[535,"这个是雷电流幅值衰减为37%的时间，和我们所说的半波时间也有所差别。"],[545,"这个叫做它的陡度因子，大家可以自行设置，看陡度因子是如何影响波形变化的。"],[555,"与通常所说的波前时间和半波时间有所不同，因此在设置 Heidler 雷电流参数时，和双指数波类似，相关参数设置不方便。"],[568,"因此 ATPDraw 7.3提供了 Heidler 的拟合模型。"],[573,"Heidler 的拟合模型其中的参数设置我们不再赘述，和双指数波的拟合模型相同。"],[582,"我们输出每个电阻的电流，运行仿真进行绘图。"],[589,"Hei 代表原始 Heidler 冲击源，Heif 一代表的由 ATP 内嵌拟合的冲击源模型，Heif 二代表由 ATPDraw 优化的冲击源模型。"],[603,"可以看出红色和绿色分别为由 ATP 和 ATPDraw 进行参数拟合的模型，两者所得到的结果是一致的。"],[617,"由得到的电流波形也可以看出，传统的雷电流模型达到峰值的时间更早，就是1.2μs，但是通常所说的波前时间是 t 90减 t 30除以0.6所得到的时间，因此通常波前时间要略大于1.2μs。"],[642,"原始冲击源中50μs是衰减为峰值37%的时间，而通常所说的应该是半峰值时间。"],[652,"传统的 Heidler 衰减更快。"],[655,"接下来我们讲解，当 ATPDraw 中没有相关函数的电源时，如何生成用户自定义函数的电源。"],[666,"使用 TACS 电源。"],[669,"位置在右键电源，TACS电源。"],[674,"这个电源可以由TACS或Model编程来输出函数，该函数就是电源的波形。"],[684,"如我们生成一个脉冲函数模型的雷电流，在ATPDraw中没有脉冲函数的雷电流模型，我们通过TACS电源来实现这个功能。"],[699,"首先，为了方便对比时间等参数，我们设置一个1.2μs达到幅值一安，半峰值时间为50μs的雷电流。"],[711,"双击TACS电源改为电流源，点击OK，添加一个电阻，设置为一欧。"],[721,"然后输出它的电流，末端接地。"],[728,"接下来需要给TACS电源赋一个函数，根据雷电流脉冲函数的定义进行Model编程。"],[741,"右键Model，选择Default Model，双击它，点击Edit，在这里进行编程。"],[754,"这是编好的程序，点击Done，提示成功定义了零个输入，一个输出，四个Data，点击Yes。"],[770,"这里是定义Data和Nodes，我们保持默认，点击OK。"],[776,"点击OK，这里就只有一个输出，连接到电源后面，这个电源输出的就是这个Model的函数。"],[790,"接下来我们回过头看这个编程，雷电流的脉冲函数为i，其中eta为幅值校正因子，我们定义了ta。"],[802,"为了增加程序的可读性，我们把ta的套一比套二次方定义为x。"],[810,"我们把雷电流脉冲函数中相关部分定义为a、y、b。"],[819,"接下来我们运行仿真，然后查看LIS文件，可以看出50μs时，电流达到0.499，约等于0.5。"],[837,"这就是50μs是它的半波时间。"],[840,"我们看它的极值。"],[844,"它的极值是0.999，无限接近于一，达到该峰值的时间是1.2μs，满足最初的设计需求。"],[857,"最后和大家分享一下如何在 ATP 中生成多脉冲的雷电冲击波。"],[865,"我们以 Heidler 的拟合模型为例，使用 ATPDraw 参数优化拟合。"],[873,"只需要将多个雷电流冲击源并联在一起，并调整它们的开始起作用的时间和停止起作用的时间即可。"],[886,"这个例子中，我们将两个雷电流冲击源进行并联。"],[893,"其中第一个雷电流冲击源的幅值是一安，波形是1.250μs，零时刻开始起作用，500μs停止起作用。"],[908,"另一个雷电流冲击源幅值为0.5安，用来模拟后续雷击，波形为0.25100μs，这是一个典型的后续雷击的雷电流波形。"],[922,"开始起作用的时间是0.0008s，停止起作用的时间是一秒，我们的整个仿真时长为0.001s。"],[934,"我们运行仿真来看计算结果。"],[938,"我们把电流的波形绘出，可以看出这是一个两脉冲的雷电流的波形。"],[946,"我们将它放大，第一个雷电冲击波幅值为一安，第二个雷电冲击波幅值为0.5安，陡度更大，用来模拟后续雷击。"],[957,"好，今天的分享到这里就结束了，谢谢大家。"]]},{"p":69,"t":"13.2 雷电过电压2-杆塔模型","d":583,"s":[[1,"大家好，本节视频主要和大家分享雷电过电压中杆塔的建模方法。"],[9,"对于内部过电压以及 VFTO 过电压，波主要在系统内传播，不会击穿绝缘子经杆塔入地，因此只有在雷击过电压中才需要对杆塔进行建模。"],[25,"对于杆塔的类型来说，在我国电力系统中，主要杆塔分为配网的水泥杆和主网的铁塔。"],[35,"铁塔的类型多样，如有上字型塔、酒杯塔、猫头塔、干字型塔、鼓型塔、拉 V 塔、门型塔等等。"],[49,"对于杆塔的建模来说，建模方法主要分为以下四种：电感模型、单波阻抗模型、多波阻抗模型和多层传输塔模型。"],[63,"接下来我们将就以上四种模型展开讲解。"],[67,"首先来看第一种模型，集中电感的等效模型。"],[74,"电感模型主要用在配网中，即10kv和35kv杆塔，主要是水泥杆，可以根据杆塔的实际尺寸结构对杆塔分段建模，如左侧为杆塔的实际物理结构图，横担将杆塔分成了长度不等的三段，这三段用三个大小不等的电感来等值。"],[103,"此外横担也可以用电感来等值，但对于杆塔的高度来说，横担长度的影响基本可以忽略，因此对于该同一杆塔来说，大家可能看到两种建模方法均是正确的。"],[122,"关于电感的取值，根据不同塔型，可以参考本表给出的等值电感的平均值来进行取值。"],[134,"需要注意的是在这里电感的单位是微亨每米，在 ATP 中电感的默认单位为毫亨，要注意单位换算问题。"],[147,"接下来我们来看单波阻抗模型。"],[151,"单波阻抗是指整个杆塔用多个波阻抗大小相同的分布参数线路元件来等值。"],[160,"单波阻抗模型一般用于较低电压等级中。"],[167,"有时，不关心波在杆塔上的流动过程，不关心杆塔对线路耐雷水平的影响，重点研究侵入波过电压对变电站的影响时，也可采用单波阻抗模型对杆塔进行简化等值。"],[186,"对于同一个杆塔，使用单波阻抗建模时，可以将其等值为不同的形状。"],[194,"ATP推荐了三种等值方法，并给出了计算公式，大家可根据需要选择不同的模型，三者计算结果相差不大。"],[206,"波阻抗的元件在右键线路和电缆、分布参数、换位线路、单向元件。"],[217,"双击元件来看相关的参数设置，一般我们只考虑波过程，因此 R 一般设置为零，代表无损线路参数。"],[232,"Z 为波阻抗，为刚刚通过公式计算的值。"],[238,"V 为波速，一般设置为光速或略低于光速。"],[244,"另外，需要根据杆塔结构来设置波阻抗线路元件的长度。"],[252,"有时，如例九中的杆塔模型，我们双击波阻抗元件，可以看到电阻 R 等于10欧每米，波阻抗等于200欧，波速为2.5乘以10的五次方米每秒，长度为0.008m。"],[274,"这里涉及长度时，均应看成千米，这样也就是说电阻的单位为10欧每千米，波速为2.5乘以10的五次方千米每秒，长度为0.008km，即八米。"],[294,"这样做的原因是 ATP 最初是在 DOS 系统中开发的，为了限制 ATP 内存使用过大而出现死机。"],[305,"ATP 禁止出现过多的分布线路元件，且数值不能太大，否则就会报错 KILL 等于一，内存溢出。"],[316,"这种设置方法和将其单位看为米，数值相差1000倍，效果是一模一样的。"],[324,"单波阻抗模型和电感模型的建模方法相似，在横担处将杆塔分段，可以考虑横担，也可以忽略。"],[336,"单波阻抗模型和电感模型的经典取值对比如图所示。"],[342,"虽然两种模型具有相似性，但两者在电气特性上也有所差异。"],[351,"电感模型是集总参数，可以反映波流经杆塔时在杆塔各处的压降情况，而单波阻抗模型是分布参数，可以反映波经过杆塔时的波过程，但不能反映经过杆塔时波的衰减和畸变。"],[373,"波的畸变过程是由于波阻抗大小不等，多次折反射造成的，多波阻抗模型就可以反映波的畸变过程。"],[385,"以经典的双回线路鼓形塔为例，铁塔可以分为起主要支撑作用的主材，起辅助支撑作用的斜材以及横担。"],[401,"图一为220千伏某型号铁塔的实际尺寸结构，图二为其简化模型，图三是多波阻抗的模型图。"],[414,"这一部分为杆塔的横担，用波阻抗 Z A 表示，不同段的横担冠以不同的下标序号，如 Z A 一、 Z A 二、 Z A 三、 Z A 四。"],[429,"同理，这个是主材，用 Z T 表示。"],[434,"这个是斜材，图二中没有标出，用 Z L 表示。"],[440,"其中主材、斜材和横担的波阻抗计算方法如图所示，相关参数的含义可以参考哈瑞的这篇文献。"],[452,"需要说明的是，二 A K 代表的是横担与主材连接长度的1/4，指的应该是这一个长度的1/4。"],[464,"接下来我们来看杆塔的第四种模型，是多层传输塔模型。"],[470,"这种模型可以模拟过电压波流经杆塔时的畸变过程，也能够反映它的衰减过程。"],[479,"对于如图所示的同塔架设双回线路的铁塔来说，在线路的上相、中相和下相的横担位置将铁塔分成四段，在这种形式下又叫杆塔的四段模型。"],[495,"这种模型是用无损线路参数和 R L 并联电路两者的串联形式来模拟铁塔的。"],[505,"其中，Rf 为塔脚的接地电阻。"],[510,"这个模型用集中电阻可以实现冲击波的衰减过程，用电感和电阻的并联可以实现高频领域衰减大，低频领域衰减小的特性。"],[523,"本杆塔模型也可用于当线路回数增多时，横担数量增加，不等高的横担对应的将铁塔分成的段数也会相应增加，照此方法便可搭建一个多层传输塔模型。"],[541,"相关参数的计算方法已经给出，可参考以下参考文献进行取值。"],[548,"该模型可以更精准地模拟杆塔上的波过程，但是部分经验参数依赖实验，对于不同塔型也会有所差别，因此参数取值稍有困难。"],[562,"另外，该模型不能直观地反映杆塔的大小和形状，这也是该模型的一个缺点。"],[571,"以上就是本节的所有内容，主要讲解了杆塔的几种建模方法，供大家参考选择进行雷电过电压的仿真计算。"],[580,"谢谢大家。"]]},{"p":70,"t":"13.3 雷电过电压3-绝缘子模型","d":992,"s":[[1,"大家好，本节视频主要和大家讲解绝缘子或间隙的放电模型，并结合绝缘子的闪络判据，向大家介绍 model 的基本使用方法。"],[15,"我们使用绝缘子的闪络判据主要有以下几种，第一种是规程法，在 ATP 中使用压控开关建模，第二种是相交法，第三种是先导法，后两种判据在 ATPDraw 中没有直接使用的元件，需要使用 model 元件，由用户自行编程实现相应的功能。"],[42,"首先我们先来看规程法，规程法是指当绝缘子两端电压大于该绝缘子的50%闪络电压时，绝缘子发生闪络，若两端电压一直小于设置的临界值，则绝缘子不闪络。"],[61,"在 ATP 中使用压控开关模拟该特性。"],[65,"压控开关的位置在右键 switches，switch voltage control，压控开关，双击该开关来看相关参数。"],[78,"该开关正常状态下处于开断状态，只有当开关两端电压大于给定值时，开关才闭合，用来模拟绝缘子闪络或间隙的击穿。"],[93,"该给定值就设置为绝缘子的50%闪络电压，也就是 Vflash 这个值。"],[101,"其余参数均可保持默认，其中 tclose 代表从该时刻以后，当开关两端电压大于 Vflash 时，开关才闭合，否则该时刻之前电压大于 Vflash，开关也不闭合。"],[123,"tdelay 代表保持闭合状态的最小时延，开关在闭合后，tdelay 时间内，开关均保持闭合状态。"],[135,"Imar 代表一个临界电流，当开关闭合的时间大于 tdelay，并且流过开关的电流小于 Imar 时，开关重新打开。"],[136,"在 ATP-EMTP 及其在电力系统中的应用修订版一书中，第158页有压控开关动作特性的示意图。"],[138,"可供大家参考，来理解这几个参数。"],[138,"接下来我们来看香蕉法判别绝缘子闪络。"],[139,"使用绝缘子的伏秒特性，相较使用单一数值的50%闪络电压更加精准。"],[140,"判别依据和规程法类似，不再赘述。"],[140,"我们主要来看 model 的使用方法。"],[141,"一 model 的语法，以220千伏绝缘子为例，编程的大致思想是：一先描绘出绝缘子伏秒曲线，该曲线可以使用三要素法描绘。"],[212,"曲线零时刻和 y 轴交点定义为 u 零，时间无穷大时无限逼近的电压定义为 u inf，描述衰减速度的时间常数 tau。"],[228,"所有电压等级的绝缘子伏秒特性均可由这三个变量描述，只不过取值不同。"],[237,"二定义两个输入端子，分别把绝缘子上端电压和下端电压取出，用来做差和伏秒特性对比。"],[248,"三判断，若绝缘子两端电压大于伏秒特性曲线，这时应有一个输出发出命令让绝缘子闪络。"],[260,"了解完编程思想，我们来看 model 元件的位置和编程语法。"],[267,"右键 model，选择 default model。"],[272,"双击元件，点击 edit 进行编程。"],[278,"为了节约时间，我们直接粘贴编制好的程序来讲解 model 的使用规则。"],[286,"首先需要说明的是，model 编程必须为英文字符模式，编程不区分大小写。"],[297,"编程以 model 加模块名开头，end model 结束。"],[306,"input 和 output 分别叫做定义输入变量和定义输出变量，名称由用户来定义，应该尽量简洁容易识别。"],[319,"我们定义了两个输入 up 和 un，分别取出绝缘子两端的电压，定义了一个输出叫做 close，用来控制绝缘子闪络及开关的闭合。"],[334,"data 叫做定义数据。"],[338,"比如本例中定义了 uinf、u零和 tau。"],[344,"定义这三个数据后，双击 model 会出现在 attributes 属性界面中，以便改变相应的参数。"],[359,"因此，一般当某些变量可能数值需要调整，以便观察该参量对计算结果的影响时，一般定义为 data，以方便后续修改参数，而不是每次都需要点击 edit 到编程界面当中来修改。"],[380,"比如本例中，如果增加一片绝缘子，或者给绝缘子加防污闪的涂层，就会间接影响绝缘子的伏秒特性，就会影响 uinf、u零和 tau 这三个参数，所以我们把这三个参数定义为了 data。"],[398,"一般以大括号括起来，里面是 dflt 冒号加一个数值，来定义这个变量的默认值。"],[411,"var 叫做定义变量，除输入外，在编程过程中数值会发生改变的量，都需要在 var 后面定义。"],[424,"init 叫做定义初始值，必须与 end init 成对存在。"],[432,"exec 叫做开始编程，必须与 end exec 结束编程成对存在。"],[442,"close 的初始值定义为零，代表开关为断开状态，绝缘子未闪络。"],[449,"tt 为仿真时间，在 model 编程界面中，赋值语句用冒号等于号进行赋值。"],[459,"u 为绝缘子两端电压，它的值等于 up 减 un 取绝对值。"],[470,"仿真时间等于当前仿真时刻加仿真步长。"],[475,"flash 为绝缘子的伏秒特性，是用三要素法描绘的。"],[482,"判断语句，若绝缘子两端电压大于绝缘子伏秒特性，则 close 等于一，输出一让开关闭合，模拟绝缘子发生闪络。"],[498,"end if，编程结束后点击 done。"],[502,"提示成功定义了两个输入。"],[506,"一个输出和三个 data，点击 yes。"],[510,"接下来是 model 模块定义编辑界面，在这个界面中可以设置 model 的图形界面、节点的位置和类型等。"],[523,"一般我们保持默认即可，点击 OK。"],[528,"OK 即可。"],[531,"在7.3版本中有一个 bug，就是 data 参数的默认值不是我们设置的参数，必须点击 reset 才会自动变成我们设置的默认值，在6.3版本中就不存在这个问题。"],[550,"以上就是编程的基本语法，其大致必须包括的就是 model、input、output、var、exec、endexec、endmodel。"],[567,"接下来我们来看二 model 节点的类型，本例中我们有两个输入，输入的是电压，有一个输出 close。"],[580,"我们给两个输入变量命名为了 up 和 un，但并不是命名为 u 输入的节点就会输入电压，还应该设置节点的类型。"],[594,"有两种方法，一种是双击节点，就会显示这个节点是 up。"],[603,"输入类型可以在这个下拉菜单进行设置，可以设置为是输出节点、输入电流、输入电压、输入开关的状态等相关变量。"],[622,"这是方法一。"],[626,"方法二是双击 model，点击 edit definitions，点击 nodes，在 kind 处可以设置节点的类型。"],[642,"两种方法是相通的，使用一种方法进行修改后，另一处会自动调整。"],[649,"kind 的值可以点击 help 查看，其数值从0~9代表不同的节点类型。"],[662,"本例中两个输入节点为 input voltage。"],[668,"输出节点设置为 output 即可。"],[678,"接下来向大家介绍一些 model 编程常用的内部变量和函数。"],[685,"常用的内部变量有仿真时间 t，仿真步长 time step，和上一仿真步长的仿真时间 previous time。"],[700,"t 减 previous time 等于仿真步长。"],[705,"二，常用的函数，取绝对值，开根号，自然对数 e 的多少次方，以 e 为底取对数，以10为底取对数，以二为底取对数。"],[724,"x 的倒数，sin，cos，tan，arcsin，arccos，arctan，以及在一组数中取最大值或最小值，产生一个0~1之间的随机数。"],[743,"求 x 对时间 t 的一阶导数，上一仿真步长的 x 的数值是多少等。"],[754,"四，向大家提一个注意点，以例九 n 为例。"],[760,"这是一个变电站侵入波过电压的一个仿真。"],[768,"在这个仿真中，绝缘子 a 相、b 相、c 相均采用相同的闪络判据。"],[779,"当一个模块被多次调用时，model 的 use as 应保持不同。"],[789,"最后向大家介绍 record 记录由 var 定义的变量的变化情况。"],[806,"同样以例九 n 为例，我们来看 a 相绝缘子。"],[811,"这个是 model 的 record 记录功能，点击 record，可以看到由 var 定义的变量均出现在变量列表中。"],[826,"我们输出绝缘子的伏秒特性，添加到 record 当中。"],[833,"我们输出 a 相绝缘子两端的电压。"],[837,"并将它可以重新命名，定义为 Ua，点击 OK，OK，运行仿真。"],[846,"下滑，在最后 M 的标识为 Model 模块中变量的名称，点击 Flash，点击 Ua，可以看到。"],[870,"绝缘子的伏秒特性曲线，以及绝缘子两端电压的绝对值。"],[878,"到此 Model 的基本使用就介绍完了，Model 编好后，由其控制的开关应选用 TACS 开关，位置在右键开关，TACS 开关。"],[895,"双击开关，参数保持默认即可。"],[900,"选中 Ctrl 加 L，让元件进行翻转，Output 连接到开关的控制端，然后 Model 的两侧连接开关的两侧，这样由 Model 控制的开关搭建的绝缘子模型就搭建好了。"],[925,"针对第三种建模方法先导法，亦是用 Model 编程的语句来实现的，具体不再介绍，我们给出 Ciguery 先导发展的速度推荐计算方法，其中 G 代表先导发展的长度，L 代表绝缘子串的长度或者是空气间隙的长度，E 零为临界场强，相关推荐数值见下表。"],[956,"好，今天的大致内容就是这些，最后和大家做一个总结。"],[962,"我们介绍了绝缘子的建模方法，一规程法，使用压控开关进行建模，二相交法，我们介绍了 Model 的使用方法，三先导法，我们给出了 Ciguery 的推荐公式，大家可以尝试自行编程。"],[984,"有问题可以留言或在交流群中讨论。"],[989,"好，谢谢大家。"]]},{"p":71,"t":"13.4 雷电过电压4-线路耐雷水平及电气设备建模","d":758,"s":[[0,"大家好，本节视频主要和大家分享 ATP 确定线路耐雷水平的方法，以及变电站内电气设备的建模。"],[11,"首先我们先来看线路耐雷水平的确定。"],[16,"前几节视频已经讲过雷电流、杆塔和绝缘子的建模，通过以上视频搭建一个求解线路耐雷水平的简单模型，以软件自带的例九 n 为例，简化掉变电站模型。"],[35,"简化掉变电站模型之后，仿真模型如图所示。"],[41,"首先我们先来讨论是否考虑工频电源对线路耐雷水平计算所产生的影响。"],[53,"电力推荐标准620杠1997中有给出线路耐雷水平计算的经验公式，大多数高电压技术的教材也都引用了该规范。"],[67,"需要说明的是，这些计算中没有考虑工频电源的影响。"],[73,"对于220kv及以下的系统，工频电压在耐雷水平计算中占的比例相对较小，这种处理方法在工程上是可以接受的。"],[87,"但是330kv及以上的电压等级的系统，即超特高压系统进行防雷计算时，则必须考虑自电位的影响。"],[99,"注意是否考虑工频电源以及雷击时刻处于工频电源正极性幅值还是负极性幅值，对绝缘子的闪络情况是有一定影响的，可以参看输电线路电磁暂态仿真及应用一书中，当雷击处于工频电源正极性幅值时，C B A 三相绝缘子先后发生闪络，同样大小的雷电流作用在电源负极性幅值时，A C 两相绝缘子发生闪络。"],[135,"其二我们来讨论是否考虑反射波对耐雷水平的影响。"],[143,"单纯研究线路耐雷水平时，一般不考虑反射波的影响，这就要求仿真末端线路相对较长，我们同样以例九 n 为例，当末端线路为0.3km和10km时，仿真结果如图所示。"],[166,"可以看出，当末端线路为0.3km时，即右端线路总长度为0.9km时，在第一个波峰出现在大约二微秒时刻，滞后六微秒时，即八微秒时刻，会出现一个波峰。"],[192,"大致以光速300m每微秒来计算雷电波的传播速度，波传播到末端再反射回来，900m乘以2=1000800m，除以光速300m每微秒，正好是六微秒。"],[210,"同理，以后每六微秒就会有一个反射波，14μs、20μs、24μs都有相应的波峰。"],[219,"当然，在本例中这个反射波并不影响我们对耐雷水平的计算，但是有时这个反射波会带来很大的影响。"],[231,"比如超特高压直流线路进行耐雷水平计算时，此时需要考虑电源电位。"],[239,"当线路末端较短，电源电压会经过多次折反射，±800kv的线路经过全反射后就是1.6兆伏。"],[250,"在没有雷击的情况下，这个电位都是不容小觑的。"],[256,"当线路末端设置的长度较长时，它的线路电位就会在800kv、1.6兆伏的电源电位对雷电过电压的分析会带来很大的影响。"],[270,"其三，我们给出 ATP 计算线路耐雷水平的确定方法。"],[277,"在 ATP 中逐步增大雷电流的大小，导致绝缘子刚好发生闪络的雷电流的幅值就是线路的耐雷水平。"],[288,"判断绝缘子闪络的条件，我们总结为了以下三点：一、绝缘子两端电压降为零；二、流过绝缘子电流不为零；三、当绝缘子采用伏秒特性相交法、先导法等 model 编程建模时，model 输出一则绝缘子发生闪络。"],[315,"通常情况下，我们主要观察绝缘子两端电压，但当绝缘子并联间隙且间隙击穿时，由于两者是并联关系，此时绝缘子两端电压也降为零。"],[330,"这时就需要结合流过绝缘子的电流，或 model 的输出，来判断绝缘子是否发生闪络了。"],[339,"其次，和大家聊一下绕击和反击。"],[343,"在例九 n 中，这是一个明显的反击。"],[347,"它等同于雷击铁塔塔顶，或者理解成雷击塔顶避雷线架设处，如图。"],[357,"雷击避雷线和雷击塔顶都属于反击，绕击是雷电流直接注入相线。"],[365,"绕击哪一相就选择哪一相，点击 OK，这样就是一个绕击。"],[376,"绕击相别一般和线路架设的相对位置有关。"],[381,"绕击耐雷水平要低于反击，而且根据电气几何计算模型可以知道，绕击的雷电流大小也要远小于反击的雷电流。"],[395,"最后我们给出了电力行业标准 D L T 620杠1997中，一些常见电压等级反击情况下的耐雷水平，供大家参考。"],[410,"接下来我们来看本节视频的第二部分，变电站电气设备的建模。"],[418,"对于主要研究线路耐雷水平的仿真来说，无需对变电站内设备进行建模。"],[426,"但是当研究变电站侵入波过电压时，这当然是10分有必要的。"],[433,"同样我们引用例九 n，根据《输电线路电磁暂态仿真及应用》一书，我们对模型做了相关调整。"],[445,"首先我们先来看站内引线及母线。"],[451,"对于变电站内引线、跨线和母线而言，一般每段长度很短。"],[459,"为了减小计算量，我们使用分布线路元件，单一频率下恒定参数贝杰龙模型来说是足够的。"],[471,"对于贝杰龙模型的参数，我们设置 L C C 元件，拟合到0.2Thz，并通过设置拟合参数来查看0.2Thz下线路的参数。"],[492,"这是它的拟合效果。"],[497,"为了方便得到序参数，我们将线路进行了完全换位。"],[506,"一模下就是它的零序参数，二模下是它的正序和负序参数。"],[513,"我们能够看到不同频率下线路的 R、L、C 和波阻抗参数。"],[520,"需要说明的是 R、L、C 是每千米的参数，R 的单位是欧姆，电感的单位是毫亨，电容的单位是微法。"],[532,"我们将0.2Thz下的参数单独拿出来放到一个新建的文本文档当中，这是它的零序参数，我们计算了它的波速。"],[545,"同理，我们把正序参数取出并计算了正序波速和软件自带的引线参数做对比，除了电阻参数有较大的差异之外，其他参数基本吻合。"],[562,"在仿真中，我们可以采用我们自己设置的 R、L、C 参数，也可以使用软件自带的电阻、波阻抗和波速的参数。"],[573,"电阻较大对波过程的衰减有一定影响，大家可自行验证这两者的区别。"],[580,"第二，我们来看电气设备。"],[582,"由于雷电过电压波头时间短，等值频率高，设备的感性特性体现的并不明显，流过电感的电流很小，可以忽略其影响，相当于断路状态。"],[597,"对于变电站内电气设备建模，一般都采用等效入口电容表示。"],[604,"这是 PT，这个是处于断开状态下的 CB，也就是断路器。"],[612,"此外，对于变压器而言，一般只考虑变压器一侧的入口电容，但若分析波在绕组间的传递过程，则必须考虑高低压绕组的对地电容以及绕组间的电容。"],[628,"电容的取值和变压器的结构密切相关，不同的厂家做出的同一型号的变压器也有所差别，因此对于国标推荐的和 I Triple E 以及日本推荐的数值相差都很大。"],[645,"具体可以查看 ATP-EMTP 及其在电力系统中的应用一书4.2节。"],[653,"最后我们来重点看一下避雷器模型。"],[658,"通常情况下，我们使用非线性电阻模拟非线性伏安特性足以。"],[665,"当工频时，只有很小的泄漏电流流过。"],[669,"当出现过电压时，避雷器会流过较大的电流，从而将电压钳制在残压水平。"],[677,"这个特性在雷击情况下，由于一般布长设置的很小，使用非线性元件99型电阻就可以模拟这个特性。"],[690,"但是有时专门研究避雷器的高频特性时，使用 Pansetti 等人对 I Triple E 模型的简化模型，通常能够获得更为精准的仿真结果。"],[704,"相关参数的计算方法可以参看《输电线路》一书。"],[709,"最后和大家交流一下使用氧化锌避雷器经常汇报牛顿迭代法不收敛的问题。"],[719,"造成这个问题的原因一般有两个，一是避雷器的参考电压设置的不合理，一般设置为2~8倍的额定电压，这个参考电压没有实际的物理含义，仅是 ATP 用于拟合曲线所使用的参考电压。"],[741,"二是避雷器的非线性伏安特性设置的组数较多，一般设置为3~4组就可以表征这个非线性曲线了。"],[753,"好，今天的分享就到这里，我们下期见。"]]},{"p":72,"t":"14.1 变压器的XFMR模型1-模型建立","d":824,"s":[[1,"大家好，今天给大家介绍变压器的 X F M R 模型。"],[7,"这个名称比较长，我们后面把它简称为变压器的 X 模型。"],[15,"变压器的 X 模型最早于2005年加入 ATPDraw 4.2版本中。"],[25,"而 ATP 的用户手册成型于上个世纪末，所以在 ATP 的用户手册中没有包含这个模型。"],[37,"前面我们已经讲过了变压器的饱和模型和 BCTRAN 模型。"],[42,"变压器的饱和模型是工频等效模型，它是这三种模型中最简单的模型。"],[53,"三绕组变压器的中间绕组的工频等效电感往往为负值，这样在暂态计算中会发生数值震荡问题。"],[65,"在 BCTRAN 模型中，变压器的绕组被看作是互相耦合的电感，所以不存在有负电感的问题。"],[76,"变压器的 X 模型是这三种模型中最复杂也是最准确的模型，体现在两个方面：一，在铁心表面人工添加了一个绕组；二，变压器的励磁特性使用 Kizilcay 方程，使得深度饱和下的励磁特性更加接近真实。"],[99,"首先，我们通过由三台单相自耦变压器组成的三相变压器组来介绍 X 模型。"],[111,"这是一个单相三绕组自耦变压器，H 是高压端，L 是中压端，T 是低压端。"],[124,"在变压器的 X 模型中，不把这个变压器看作是两个线圈，而是三个线圈。"],[135,"三台这样的单相变压器就组成了三相变压器组。"],[143,"自耦侧的绕组肯定是 Y 连接，非自耦的这个绕组往往采用三角形连接，就像这样。"],[155,"右面的这是变压器的 X 模型，这是高压线圈、中压线圈、低压线圈。"],[166,"还人工增加了另外一个线圈，L一。"],[172,"L一和变压器的逆磁电感并联。"],[179,"这是变压器的逆磁电阻。"],[183,"R a是一个很大的电阻，它是为了便于计算稳定，在X模型中，这个三相变压器组共有12个绕组，A B C相各有四个绕组。"],[202,"因为这是由三个单相变压器组成的绕组，所以A B C相之间的绕组没有互感。"],[212,"对于非自偶变压器，模型类似，只不过高压绕组和中压绕组之间不再连接。"],[223,"现在我们通过书上第5.33节的例子来介绍变压器的X模型。"],[233,"为了节省时间，我们事先已经建立了这个完整的电路。"],[239,"但是我们首先来看变压器的X模型。"],[247,"模型的有关数据我们也事先输入了。"],[251,"在模型的最上面是相数，这个它已经固定死了，是三相，不能选择。"],[262,"第二行是绕组数，我们这个例子有三个绕组。"],[269,"第三个铁芯的形式，它里面有多个选项，第一个选项triplex，这个就是我们常说的有三台单相变压器组成的变压器组。"],[289,"其他的选项还有三柱叠装、五柱叠装、壳式A和壳式B。"],[300,"在我们这个例子中选择triplex。"],[305,"这是试验的频率，在我们国家通常就是50hz。"],[316,"这个区域是额定参数和连接方式，第一行是变压器的额定电压，第二行额定容量，前面这两个绕组的额定功率都是1500兆伏安。"],[333,"后面的它不是1500兆伏安，但是我们把它折算到了1500兆伏安，因为我们发现如果不折算，计算的数据有错误。"],[350,"希望在后续的 ATPDraw版本中，这个错误能够修改。"],[357,"接下来一行是连接组别，它有四个选项，在765这一栏我们选 A，表示是自五连接，345这一栏我们也选 A，在63kv这一栏，我们是选 D，表示三角形连接。"],[380,"第四行相移，第三行选择以后，第四行的数据会自动出现，如果是相移影响计算结果，我们修改这一个值，但是在大部分不牵扯联网的情况下，这个值不需要修改。"],[399,"下面一行是三个节点的名称，这一行的选项是变压器绕组的排列顺序。"],[408,"这是铁芯，通常情况下对于升压变压器来说是中压绕组、低压绕组和高压绕组，对于降压变压器来说通常是低压绕组、中压绕组和高压绕组。"],[428,"在我们的这个算例中是低压、中压和高压，高压绕组。"],[437,"这个区域是各种数据来源的选项，这些数据包括电感、电阻、电容和铁芯。"],[448,"它的来源有三个方面，设计数据、试验数据和典型数据。"],[456,"在大部分情况下，我们只有试验数据，在我们这个算例中也是仅仅有试验数据，大家可以尝试使用其他来源的数据，因为在我们的这个算例中，数据来源于试验，所以下面的这个区域是有关试验的数据。"],[480,"电感和电阻，它的数据都是来源于短路试验，它们两个的数据也是相同的，在这个地方我们把试验的数据输入。"],[498,"要提醒一点的是。"],[502,"我们把所有的试验都折算到了1500兆伏安容量下。"],[508,"还有一点需要注意，书上的变压器 T R 一的值是单相的值，所以在这个地方我们要把损耗值乘以三。"],[520,"在输入电感和电阻参数时，如果有连续参数，选择这个选项，在随后出现的区域中填入相应的数值即可。"],[532,"在大部分情况下，连续参数不可得。"],[536,"下面我们再来看电容参数，它分为左右两块区域，左边的这一块区域中是绕组之间的电容，右边的这个区域是相之间的电容。"],[554,"部分电容参数在测绕组的介质损耗的时候可以得到，如果要准确的参数，需要进行计算。"],[565,"电容参数只有在进行频率很高的仿真中才需要，比如进行雷电过电压的仿真或者 VFTO 的仿真，在普通的操作过电压的仿真中不需要电容参数，这些参数全都保持缺省值零就可以。"],[588,"下面我们来看铁芯相关的数据，在这个区域选择空载试验加在哪一个绕组上，通常都是在第二绕组或者第三绕组。"],[603,"在我们这个算例中选择第三绕组，这是连续空载试验选项，通常情况下这个数据是不可得，如果有，这个地方选择下面会出现一个有关连续试验的区域。"],[624,"在这个区域输入正序空载试验的数据，需要注意，对于损耗，书上的原始数据是单相变压器的值，我们在这个地方把它乘以三。"],[637,"下面我们来设置磁化曲线，点击 Sentience，在出现的这个小窗口中，最上面是磁化曲线的点数，它的最大数量是九，我们选择九。"],[655,"这个区域是磁化曲线使用的方程，有两种可选，有关手册中没有介绍哪一种更加准确，在一般情况下，公式越复杂越准确。"],[671,"所以我们选择第二个公式。"],[674,"这一片区域是关于公式中的参数 L A 的选择。"],[681,"通常我们选择 estimate，就是让程序来估计这个 L A 值。"],[688,"在这个区域选择使用哪种形式的非线性电感来表示磁化曲线，有98型的准非线性模型，93型的真正非线性模型和96型的磁滞曲线模型。"],[708,"一般不要选96型，计算可能会不稳定，我们选择98型。"],[716,"这一片是连续电感的区域。"],[720,"根据情况我们选择，如果没有试验报告就忽略这个选项。"],[728,"这个区域是阻尼电阻，我们选择基于磁化曲线的最后一段，点击 OK。"],[740,"ATPDraw 会自动计算磁化曲线公式的 A B C 参数，这是 A 值，这是 B 值，C 等于零。"],[756,"那这种情况下，第一个公式和第二个公式就完全相同了。"],[763,"点击 View Coil，我们看看铁芯的结构。"],[768,"显然这是由三个单相变压器组成的三相变压器组。"],[777,"我们再点击 View FI，又出现了 A B C 参数的拟合值，而且和前次的拟合值不一样。"],[787,"通过验证，我们发现 ATP 使用的是最后生成的这个 A B C 值。"],[795,"点击 OK，接下来在屏幕上显示变压器的磁化曲线，可以看出磁化曲线的电流范围大大超过了我们输入的原始值。"],[813,"峰值最大值达到了429.9安培，这样我们就建立了变压器的 X 模型。"],[822,"嗯。"]]},{"p":73,"t":"14.2 变压器的XFMR模型2-空载试验校核","d":528,"s":[[0,"大家好，本期视频将介绍变压器 X 模型的空载试验数据。"],[9,"我们已经建立了书上第5.33节的例子。"],[15,"这是电压源，首先我们取电源电压的有效值为63kv，选择单向。"],[25,"这个例子中的变压器，它是三个单向变压器组成的变压器组，空载试验是在单向变压器上进行。"],[37,"这个阻抗的作用是抑制开关合闸以后的暂态过程。"],[42,"在这里我们取一、五、10欧姆，它们与变压器的励磁电感的数值相比非常小，不会影响励磁电流达到稳态时的计算结果，但是对初值的影响非常大，所以在实际仿真中，这个阻抗要尽可能取实际值。"],[65,"这个开关用来测功率和能量，这个电流测量仪用来测量电流，这个是变压器的 X 模型，我们在上次视频中已经介绍过了。"],[80,"这是66型 TACS 元件，我们用它来测量回路中的电流有效值。"],[88,"这个电路其实是有问题的，这是单向电压源，一端接地，另外一端接变压器三角形绕组的一角。"],[103,"当这个开关合上的时候，这个电压没有施加到这个三角形绕组上。"],[112,"两台仿真的最大时长取三秒，步长是10的负四次方秒。"],[121,"下面我们按 F 二仿真，看会有什么计算结果。"],[129,"我们先看它生成的 ATP 文件，ATP 文件是完整的。"],[142,"我们再来看计算结果文件，历史文件一直往后面走，后面出现了错误信息，从这个信息上我们很难看到发生了什么问题。"],[156,"尽管我们已经知道是因为电路的不完整导致了这个问题，要解决这个问题进行单向空载试验。"],[169,"我们采用的方法是。"],[172,"手工修改 ATP 文件，让这个电压施加在这其中的一个绕组上，我们把它施加在 A 相绕组上。"],[183,"这个实现很简单。"],[185,"在变压器的 X 模型中，把三角形绕组 A 相的下端不要接 TACS，而是直接接地。"],[199,"在 ATP 文件中找到变压器的绕组。"],[204,"第一个绕组、第二个绕组、第三个绕组，总共有12个绕组。"],[213,"只要把 TX 后面的这个 TACS 删掉，它就表示 TX 的下端接地了。"],[225,"保存，回到 ATPDraw，点击主菜单上面的 ATP，这时候不能选 Run ATP，或者是不能按 F2，否则 ATPDraw 又会自动生成刚才的 ATP 文件。"],[244,"点击 Subprocess，Run ATP File，这样我们刚才修改过的 ATP 文件就是仿真文件。"],[254,"现在我们通过绘图来看仿真结果。"],[258,"这是通过这个开关的功率，这是通过这个开关的能量。"],[270,"标注为四的这一项是通过这个电流测量仪的电流。"],[277,"第五项是 TACS 的输出，是流过这个电流测量仪的有效值，也就是励磁电流的有效值。"],[288,"我们先来看励磁电流，屏幕上从上到下依次是电阻等于一、五和15欧姆时的励磁电流。"],[301,"可以看出，不同的电阻值，它的初值区别非常大。"],[310,"电阻为一欧姆时，这个电流接近9000安培。"],[318,"电阻为五欧姆时，这个电流接近6000安培。"],[325,"电阻为15欧姆时，电流接近5000安培。"],[333,"但是那次电流的稳定值相差不大。"],[336,"我们先看最上面这个电流的稳定值。"],[339,"我们把它放大。"],[346,"我们选择显示的时间范围为19.95~20s。"],[356,"电流的幅值是14.9六安培，有效值是6.47安培，这两个值都有进一步下降的趋势。"],[368,"用类似的方法，我们再来看电阻为五欧姆和10欧姆时的电流。"],[376,"电阻为五欧姆时，电流的峰值是13.44安培，有效值是6.3六安培。"],[387,"当电阻为10欧姆时，电流的峰值是13.38安培，有效值是6.35安培。"],[400,"如果想要很精确的值，大家可以在 LIS 文件中去找。"],[406,"可以看出不同的电阻对稳态值的影响比较小，在后面的计算中，我们取这个电阻为五欧姆。"],[416,"下面我们来看这次功率或者空载损耗。"],[420,"我们先看我们测量的这个功率，把它局部放大。"],[428,"这个功率是损失功率，有正有负，既包括有功，也包括无功，所以不能用于计算变压器的逆磁损耗。"],[441,"现在来看变压器吸收能量的曲线。"],[444,"取逆磁过程稳定后一秒内变压器吸收的能量作为它的空载损耗。"],[457,"从18.2s开始到19.2s。"],[473,"现在这两根竖线的时间间隔是1.0001s，我们就认为它是一秒吧。"],[486,"对应的能量之差是117.95kw，这个值就是逆磁损耗。"],[497,"截至目前，我们计算了。"],[501,"励磁电压为63kv时的，励磁电流和，励磁损耗，分别为，6.3六安培和，117.95kw。"],[514,"分别接近原始数值。"],[517,"可以用类似的方法，计算在其他的，励磁电压下的，励磁电流和励磁损耗。"]]},{"p":74,"t":"15.1 频率扫描及应用1-频率扫描","d":719,"s":[[0,"大家好，在本期视频中，我们介绍频率扫描。"],[5,"所谓频率扫描，就是在一系列的频率下进行电压或者电流的稳态计算。"],[13,"这里特别要说明的是，频率扫描是一系列的频率下的稳态计算，计算的输出是电压或者电流。"],[22,"如果需要阻抗，最简单的办法是把电源设为电流源，电流源的幅值取一，那么得到的电压就是阻抗。"],[33,"我们还是以一条750千伏架空线路为例进行说明。"],[40,"架空线路的几何参数已经录入在 data 标签页下面。"],[52,"点击 view，能够看到五根导线的整体布置情况。"],[59,"第四和第五号导线就是两根架空地线，前面的这个 phase number 都是零，表明把它们都已经接地了。"],[72,"再到 model 页面，这个选项是表明导线进行换位，这个自动合并导线数，这个是考虑肌肤效应，这个我们没有选，表示线路的地线都是主塔接地。"],[94,"这项也没有选，表明在计算过程中我们使用的是复变换矩阵，因为我们进行的是稳态计算，选择随频率变化的建模基模线。"],[109,"大家在前面的视频中已经了解了其他这些参数的含义。"],[118,"点击 run ATP 或者 OK，程序开始进行建模计算。"],[124,"计算结束，模型已经建好了。"],[134,"点击 OK 返回到原来的界面，这个程序还要重新计算一次。"],[145,"现在给线路的左端连接电流源。"],[152,"给它的幅值取为一，因为我们进行扫频。"],[169,"这个频率其实是没有作用的。"],[172,"选择三项正序电流。"],[177,"输出线路首端的电压。"],[185,"我们仅仅选择其中的一项。"],[188,"这样线路首端的电压值就是从线路首端望入的阻抗。"],[202,"现在选择要扫描的频率。"],[208,"点击 frequency scan，不要选 harmonic frequency scan，这个我们要在后面讲。"],[217,"这个是输出选项，这一项输出幅值，选这一项输出幅值和相角，这一项输出实部和虚部，选择这一项输出以上所有内容。"],[235,"我们选择这一项。"],[238,"下面输入扫描的频率范围，这是最小频率，0.5hz，最大频率5000hz。"],[251,"这个是频率步长，如果把这个值设为一个非零的值，那就是按这个步长来走。"],[263,"如果把这个 df 设为零，它的步长由后面这个参数来决定，它表示每10倍频频率点的个数，我们选择10。"],[279,"经过以上的设置，现在我们就可以计算这条长度为200km线路末端空载时首端的正序电压，也就是首端的正序阻抗。"],[297,"点击 F 二进行计算。"],[299,"现在我们看计算结果。"],[309,"计算结果在 lis 文件的后面。"],[311,"第一条在0.5hz下的计算结果，幅值和相角，这是下一个频率下的计算结果。"],[321,"下面我们来绘图。"],[322,"第一个变量是幅值，第二个变量是相角。"],[328,"这就是整体的计算结果，因为点数选择的比较少。"],[336,"所以相角曲线看起来折线段比较多。"],[341,"下面我们要把这种计算结果与线路 LCC 下面的 Verify 所给的结果进行比较。"],[350,"Verify 计算的是长度为1000m的线路，末端短路的时候，从首端看入的阻抗。"],[361,"所以我们把这个线路的长度改为1000m。"],[368,"另外，我们把它的计算范围扩大。"],[377,"把线路末端接地。"],[390,"这个地方有两个选项，第一项是 Line Model Frequency Scan，线路模型频率扫描，这个是 ATP 本身的一个子程序。"],[408,"现在我们看到的是长度为1000m的线路，末端短路时，线路分别使用 J Ma T 模型和准确π模型时，从首端望入的线路的连续阻抗。"],[435,"准确π模型就是准确模型。"],[438,"可以看出，在低频段，J Ma T 模型就是蓝颜色的这条曲线，误差较大。"],[447,"当频率逐渐增高的时候，J Ma T 模型的误差越来越小。"],[452,"我们再来看正序的情况，在频率较低的时候，J Ma T 模型的误差稍大，但是正序 J Ma T 模型的整体情况要好于零序 J Ma T 模型。"],[470,"还有一点要说明，进行 Verify 的时候，线路首端接不接电源都不影响计算结果。"],[479,"现在我们返回来，把这个最大值也改为10的七次方，然后再进行扫描。"],[490,"我们直
