<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ATP-EMTP 课程索引</title>
<style>
  :root{
    --bg:#F7F5F0; --surface:#FFFFFF; --surface-2:#FBF9F5;
    --ink:#1C1E26; --muted:#6B6F7B; --faint:#93979F;
    --line:#E2DED5; --line-2:#EFEBE3;
    --accent:#B4531A; --accent-soft:#F4E6D8; --on-accent:#FFFFFF;
    --mark:#FFDF9E; --mark-ink:#5A3B00; --cur:#FBEFD9;
    --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"DejaVu Sans Mono",monospace;
    --cjk:"PingFang SC","Microsoft YaHei","Hiragino Sans GB","Noto Sans CJK SC",system-ui,sans-serif;
    color-scheme:light dark;
  }
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]){
      --bg:#14161C; --surface:#1B1E26; --surface-2:#20242D;
      --ink:#E9E7E2; --muted:#9BA1AF; --faint:#6E7480;
      --line:#2B2F39; --line-2:#242831;
      --accent:#E08542; --accent-soft:#2F2318; --on-accent:#14161C;
      --mark:#6A5218; --mark-ink:#FFE8B8; --cur:#2A2318;
    }
  }
  :root[data-theme="dark"]{
    --bg:#14161C; --surface:#1B1E26; --surface-2:#20242D;
    --ink:#E9E7E2; --muted:#9BA1AF; --faint:#6E7480;
    --line:#2B2F39; --line-2:#242831;
    --accent:#E08542; --accent-soft:#2F2318; --on-accent:#14161C;
    --mark:#6A5218; --mark-ink:#FFE8B8; --cur:#2A2318;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{background:var(--bg);color:var(--ink);font-family:var(--cjk);font-size:15px;line-height:1.7}
  .wrap{max-width:1360px;margin:0 auto;padding-inline:16px}

  header.top{position:sticky;top:0;z-index:40;background:var(--bg);
    border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
  .brandrow{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;padding-block:11px 6px}
  .brand{font-family:var(--mono);font-weight:600;font-size:15px}
  .brand b{color:var(--accent)}
  .sub{color:var(--muted);font-size:12.5px}
  .searchbar{display:flex;gap:8px;padding-bottom:11px}
  #q{flex:1;min-width:0;font:inherit;font-size:16px;color:var(--ink);background:var(--surface);
     border:1px solid var(--line);border-radius:8px;padding:11px 13px;outline:none}
  #q:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
  .btn{font:inherit;font-size:13px;color:var(--muted);background:var(--surface);
       border:1px solid var(--line);border-radius:8px;padding:10px 12px;cursor:pointer}
  .btn:hover{color:var(--ink);border-color:var(--accent)}
  .btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

  .cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,460px);gap:20px;
        align-items:start;padding-block:14px 30px}
  @media (max-width:900px){ .cols{grid-template-columns:minmax(0,1fr)} .side{order:-1} }

  .chips{display:flex;gap:6px;flex-wrap:wrap;padding-block:0 12px}
  .chip{font-family:var(--mono);font-size:12px;color:var(--muted);background:var(--surface);
        border:1px solid var(--line);border-radius:999px;padding:4px 10px;cursor:pointer}
  .chip:hover{border-color:var(--accent);color:var(--ink)}
  .chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
  .chip .c{opacity:.6;margin-left:4px}
  .statline{font-family:var(--mono);font-size:12px;color:var(--faint);padding-bottom:10px}
  .statline b{color:var(--accent)}

  h2.sech{font-size:12.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;
          color:var(--faint);margin:18px 0 9px;font-family:var(--mono)}
  .topicgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:8px}
  .topic{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:9px;
         padding:10px 12px;cursor:pointer;font:inherit;color:var(--ink)}
  .topic:hover{border-color:var(--accent)}
  .topic .t{font-weight:600;font-size:14px}
  .topic .w{display:block;font-family:var(--mono);font-size:11px;color:var(--muted);margin-top:2px}

  .lecrow{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--line-2);
          cursor:pointer}
  .lecrow:hover{color:var(--accent)}
  .pnum{font-family:var(--mono);font-size:11px;color:var(--faint);min-width:34px;text-align:right;
        font-variant-numeric:tabular-nums}
  .lectitle{flex:1;min-width:0;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .lecdur{font-family:var(--mono);font-size:11px;color:var(--faint);font-variant-numeric:tabular-nums}

  .grp{background:var(--surface);border:1px solid var(--line);border-radius:10px;
       margin-bottom:12px;overflow:hidden}
  .grphead{display:flex;align-items:center;gap:9px;padding:9px 13px;background:var(--surface-2);
           border-bottom:1px solid var(--line)}
  .grphead .gt{flex:1;min-width:0;font-weight:600;font-size:13.5px;
               overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .gn{font-family:var(--mono);font-size:11px;color:var(--accent);background:var(--accent-soft);
      border-radius:4px;padding:1px 6px}
  .hit{display:block;width:100%;text-align:left;background:none;border:0;
       border-top:1px solid var(--line-2);padding:9px 13px;cursor:pointer;color:inherit;font:inherit}
  .hit:first-of-type{border-top:0}
  .hit:hover{background:var(--surface-2)}
  .hit:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
  .hitmeta{display:flex;align-items:center;gap:9px;margin-bottom:3px}
  .tc{font-family:var(--mono);font-size:11.5px;color:var(--accent);font-variant-numeric:tabular-nums}
  .axis{flex:1;height:3px;background:var(--line-2);border-radius:2px;position:relative;min-width:40px}
  .axis i{position:absolute;top:-2px;width:3px;height:7px;background:var(--accent);border-radius:1px}
  .hittext{font-size:14px;line-height:1.65}
  mark{background:var(--mark);color:var(--mark-ink);border-radius:2px;padding:0 1px}

  .side{position:sticky;top:96px}
  @media (max-width:900px){ .side{position:static} }
  .player{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
  .frame{position:relative;width:100%;aspect-ratio:16/9;max-width:100%;background:#000}
  .frame iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
  .pinfo{padding:9px 12px;border-top:1px solid var(--line);display:flex;align-items:center;gap:8px}
  .pinfo .pt{flex:1;min-width:0;font-size:13px;font-weight:600;
             overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  a.play{font-family:var(--mono);font-size:11px;color:var(--accent);text-decoration:none;
         border:1px solid var(--line);border-radius:6px;padding:2px 7px;white-space:nowrap}
  a.play:hover{background:var(--accent-soft)}
  .noplayer{padding:26px 16px;text-align:center;color:var(--muted);font-size:13.5px}

  .script{margin-top:12px;background:var(--surface);border:1px solid var(--line);border-radius:10px;
          max-height:46vh;overflow-y:auto}
  .script .sh{position:sticky;top:0;background:var(--surface-2);border-bottom:1px solid var(--line);
              padding:7px 12px;font-family:var(--mono);font-size:11px;color:var(--muted)}
  .ln{display:flex;gap:9px;padding:5px 12px;cursor:pointer;border-bottom:1px solid var(--line-2)}
  .ln:hover{background:var(--surface-2)}
  .ln.cur{background:var(--cur)}
  .ln .lt{font-family:var(--mono);font-size:11px;color:var(--faint);min-width:42px;
          font-variant-numeric:tabular-nums}
  .ln .lx{flex:1;min-width:0;font-size:13.5px;line-height:1.6}

  .empty{text-align:center;color:var(--muted);padding:32px 8px}
  .empty .big{font-size:15px;color:var(--ink);margin-bottom:8px}
  .altbox{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-top:10px}
  footer{border-top:1px solid var(--line);color:var(--faint);font-size:12px;
         padding-block:15px 28px;line-height:1.8}
  footer a{color:var(--muted)}
  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

模型，模型之一，贝杰龙模型。"],[11,"，之所以强调行波，因为我们有时候还会用到π模型。"],[19,"输电线路的π模型它不是行波模型，它也是一种电磁暂态模型。"],[28,"本期视频的主要内容有三个方面，首先是单相输电线路的波过程简单介绍，然后利用波过程得出单相输电线路的行波电磁暂态模型，就是我们今天要讲的贝杰龙模型。"],[49,"最后通过一个简单的例子来验证贝杰龙模型。"],[57,"参考的书目是这两个，尤其是左边的这一本《输电线路电磁暂态仿真及其应用》。"],[66,"好，我们首先介绍单导线上的波过程。"],[81,"介绍单导线上的波过程通常所用的等效电路就是图五杠一这么一个等效电路。"],[90,"这个电路里边有一些基本的参数，就是导线单位长度的电阻、电感、电容，还有嗯电导。"],[108,"在线路的线路上 x 处，x 处是保持距离，x 处取微长度，我们把这个微长度叫做嗯暂时读作二 x 吧，取微长度二 x。"],[129,"然后画这么一个等效电路，在这个长度上对应的电阻就是 r 乘二 x，电感是 l 乘二 x，c 乘二 x 就是对应电容，g 乘二 x 就是对应的电导。"],[151,"在 x 处它的电压是 u，电流是 i。"],[159,"经过这个微小的长度二 x 之后，它的电流变成了 i 加二 x。"],[168,"电压增加到 u 加二 u，这个之前都是它的微小增量二 u 和 i。"],[179,"然后在这个地方我们要提醒的是，在这个电阻和电感上的压降就是负的二 u，然后流过这个对地支路的这两个支路的总电流，这个电流是二 i，所以我们就有这两个方程。"],[209,"第一个方程是在嗯线路的串联阻抗上的压降，压降是负的二 u 等于本来是 R 乘二 x i 再加 L 乘二 x，然后这个是电流的导数。"],[233,"我们把所有的二 x 写到外面，对电流也有类似这么一个方程。"],[243,"我们把这两个方程进行变形，把等式两边统统除以二 x，就得到了这么一个方程。"],[253,"这个方程就是通常所说的一阶波动微分方程。"],[261,"我们进行理论分析的时候，为了简化起见，首先把电阻和电导这两部分忽略掉，就认为它们是为零，就得到了五杠三、五杠四这么两个方程。"],[276,"这就是单相无损线路一阶波动微分方程。"],[283,"对这两个方程我们进行进一步变形，对五杠三两端再对 x 求导，就我们得到五杠五。"],[299,"对五杠四两端对 t 求导，我们得到了五杠六。"],[314,"现在五杠把五杠六整个带入到五杠五里边，我们就得到了五杠七这么一个式子。"],[331,"同样呢，我们对两端，我们求导的时候倒过来。"],[339,"对五杠三两端先对 t 求导，对五杠四两端对 x 求导，我们就能够得到公式五杠八。"],[351,"五杠七和五杠八，这就是我们常说的二阶波动微分方程。"],[364,"一阶方程和二阶方程的区别是，一阶方程里面既有电压，有也有电流 i，但是在二阶波动微分方程里面，每个方程只有电压或者电流。"],[378,"求解五杠七和五杠八，就得到五杠九和五杠10所示的波动方程。"],[391,"对于这个波动方程的稍微详细一点的求法，可以参考这一本书。"],[405,"电力系统分析与设计，这本书的第12.1节，哎，比较详细的介绍了它的这个波动方程的求解过程。"],[421,"这个波动方程里面有一个量 v，v 等于根号 L C 分之一，在在空气中它基本上就是等于光速的。"],[442,"这个呢我们也把它叫做波速，波的传播速度。"],[450,"因为从这个波动方程里边可以看到 v 的位置，v 它是在 x 减个 v t 或者 x 加 v t，它是在速度的位置上。"],[464,"式五杠九和五杠10表明，线路上的电压和电流是以波的形式向两个方向传播的。"],[479,"箭头向右的这个量，我们把它叫做前行波，它是沿着 x 的正方向流动。"],[490,"箭头向左的这个量，我们把它叫做反行波。"],[498,"它是反着我们规定的正方向前行的波。"],[503,"而且电流波和电压波有关系，它们之间的关系是五杠12和五杠13，式子里面的 Z 等于根号 C 分之 L，这就是我们常常说的波阻抗或者特征阻抗。"],[525,"在五杠12中，前行的电流波和电压波的关系是，电压波等于波阻抗乘以电流波。"],[539,"那对于反型的电压波和电流波，它的关系之间是乘的负 Z，这个也可以理解的。"],[551,"因为反型波，电压，不论是正型和反型的话，我们都认为它是正的，那么反型的电流肯定是负的。"],[564,"上面讲的这一部分就是线路的波动方程。"],[574,"下面我们要对波动方程进行变形，得出我们需要的电磁暂态计算用的行波模型。"],[590,"我们先从五杠19和五杠10入手，对五杠10两端都乘以波阻抗 Z，然后把五杠九和五杠10相加，我们就得到了五杠15。"],[613,"U 加 Z I 等于 U 前行波加 U 反行波，再加 Z 乘 I 的前行波，再加 Z 乘 I 的反行波。"],[633,"然后我们把再把五杠12和五杠13带入五杠15里面，我们就得到五杠16。"],[651,"U 加 Z I 等于二倍的电压的前行波。"],[659,"同理可得，U 减 Z I 等于二倍的电压的反行波。"],[666,"我们把五杠16叫做前行波特征方程，这个波也叫做前行混合波。"],[681,"类似的，我们得到式五杠17，这是反行波特征方程，这个波叫反行混合波。"],[696,"对于式五杠16和五杠17，我们不是用这个公式本身，而是利用这个公式表达出来的这个物理意义，就是波。"],[716,"假设输电线路的长度是 l，如图五杠二所示的，我们把它的始末端分别定为 k 和 m 点，它对应的电压是 u k 和 u m，对应的电流是 i k 和 i m。"],[750,"嗯，注意在这个地方呢，嗯，在基本上所有的教科书上，电流的方向都是这么定的，就是五杠图二中的 i，都是从从点流向线路的。"],[766,"所以 i k 和 i m 从这看起来方向是反反的。"],[771,"这样的话，在线路前行就有三个波，电流前行波，电压前行波，还有它们电流和电压合起来的混合前行波。"],[789,"在 k m 点还有反行波，同样有三个反行反行的波。"],[802,"既然我们用到了波的概念，根据波的传播特性，点 k 在 t 减套时刻的混合前行电压波等于点 m 在 t 时刻的混合前行电压波，我们就得到了式五杠18。"],[832,"我们把五杠18进行变形，相当于是两边统统除以负 z，然后把 u m 拿到等式的另外一边，嗯，正最后再把整个等式两边，左右两边的内容进行调换，就我们得到了是五杠19。"],[857,"i m t 时刻的等于 u m 还是 t 时刻的除以 z，再加方括号里面的这两个东西，它是 t 减套时刻，就是过去的，过去的 k 点的电压和电流它决定的一个参数，这电压要除以 z，它就具有电流的量纲了。"],[890,"我们把方括号的这一些东西用一个符号表示，i m t 减套。"],[901,"嗯，回头看五杠19。"],[904,"五杠19这个等式我们可以用电路的形式来表示，就是五杠二 b 右端的这一部分。"],[924,"这个电路有两部分，一部分是 z 支路，z 支路贡献的电流是 u m 除以 z，另外一部分是电流源 i m t 减套。"],[942,"这个公式非常重要。"],[952,"类似的我们也可以画出 k 点的等效电路，如图五杠二 b 中左端所示，它和右端的这个是对应的。"],[977,"同样的 k 端的，按 k 点 t 减套，这个我们把它叫历史电流源，取决于 m 点在过去的时刻，t 减套时刻的电流和电压。"],[1001,"t减后时刻的线路两端的电流和电压都是已知量，所以利用式五杠19和五杠22，或者图五杠二的b电路，可以计算t时刻的电压和电流。"],[1032,"用这种方法，就一直把随着时间往前走，你一个步长一个步长往前算，整个就能计算出整个线路的电磁暂态过程。"],[1048,"上述的方法叫做特性线法，这个是比较早就有这种方法，在49年的时候，1949年的时候，贝杰龙在法文著作中进行了详细描述，所以我们通常把它称作贝杰龙法。"],[1074,"对应的这个线路模型，我们叫贝杰龙模型，它是是行波模型。"],[1081,"哎，另外一种常见的行波模型是金马金模型。"],[1087,"在前面的介绍中，我们嗯忽略了线路的损耗，假设r和z都是等于零的。"],[1107,"，线路的z确实是非常小，通常情况下是可以忽略的。"],[1113,"嗯，电阻在进行电电磁暂态计算的时候，一般是不能忽略的。"],[1119,"那电阻是怎么考虑的呢？"],[1123,"嗯，在电磁暂态计算中，嗯通常是采用的办法是把它采用集中考虑，分成三三个电阻。"],[1135,"图5~3a所示，线路的左端是嗯总的电阻的1/4，右端也是1/4，线路的中间是1/2的总电阻。"],[1154,"这样的话就把整个线路其实分成了两段，对每一段用刚才说的方法，就得到了图五杠三b所示这么一个电路。"],[1171,"这样的话，在计算的时候会多，，一些节点出来。"],[1177,"因为原来的是它仅有 k 点一个节点，m 点一个节点，这样的就会多出两个，k 一和 m 一。"],[1187,"通过合并，把 k 一和 m 一可以去掉，就得到了我们刚才 c 这么一个简化电路，这和原来的电路是完全形式上完全相同，但是这个电路的电阻再不是 z，它的历史电流源也有也是发生变化的。"],[1221,"上述就是贝杰龙模型的整体情况，对它进行一个简单的总结。"],[1232,"第一，它线路是用波阻抗 z 和波的传播时间套来描述的。"],[1241,"第二，如果不考虑线路损耗，线路每端的等效电路为波阻抗 z 与一个历史电流源的并联。"],[1253,"，线路两端呢再没有没有其他的任何元件。"],[1259,"如果考虑线路的电阻，线路每端的等效电路也是一个电阻，但是它阻值不再是 z 和一个历史电流源的并联，但是这个历史电流源并不同于不考虑线路损耗时的历史电流源。"],[1285,"嗯，除用波阻抗和传播时间来描述以外，这是最直接的描述方法。"],[1292,"描述贝杰龙模型还可以用其他两种方法，一种是电感、电容和线路长度，用这个三个参数可以导出 z 和套，也可以用波阻抗 z 和波速 v 来描述，，这两个参数也可以导出传播时间套。"],[1331,"图一所示。"],[1332,"有一电波沿着单相输电线线路从左向右传播。"],[1340,"线路的参数是波速等于3×10的五次方千米每秒，波阻抗等于500欧姆。"],[1352,"，电阻忽略掉。"],[1354,"线路的末端有一个200欧姆的电阻接地。"],[1361,"我们现在要求当波到达线路末端的时候，线路末端电阻上的电压。"],[1371,"雷波的峰值是35伏，这是一个直角波。"],[1383,"根据电路原理，我们可以把图一画成图二所示的集中参数等值电路。"],[1399,"其中直流电压源的电压是两倍的雷波的幅值，就是70伏。"],[1407,"整个等值电源部分它的内阻是波阻抗，也就是500欧姆。"],[1417,"这个电路很简单，我们很容易算出末端电阻上的电压 U 等于20伏。"],[1427,"下面我们用 ATP 再来计算图一中的电压 U。"],[1439,"选择11型直流电压源。"],[1453,"电压是，幅值是35伏。"],[1462,"选择输电线路，分布参数线路，选择单相。"],[1475,"这个里面参数刚好合适，应该是500，V 是3×10的八次方每秒米，这个地方可以把这个米。"],[1497,"每秒米，长度和有关的这个，可以看到千米，这样数字会小一些，就3×10的五次方。"],[1507,"线路的长度，我们选择300，这就变成千米了。"],[1523,"末端再加上个电阻。"],[1528,"电阻值200欧姆。"],[1534,"一端接地。"],[1541,"我们测这样点的电压。"],[1553,"这个里面现在我们只有一个输出，就是这个电压。"],[1561,"步长我们就取10的负四次方秒。"],[1565,"仿真的最大时长我们取两个毫秒。"],[1571,"我们保存一下。"],[1575,"计算。"],[1580,"我们现在通过绘图，先看看它的波形。"],[1587,"从这个图上很明显。"],[1599,"电压是20伏。"],[1605,"我们可以把坐标，上面的坐标再变大一点。"],[1612,"放到30。"],[1615,"我还可以再加上网格，看得更清楚。"],[1631,"这个地方它本来是一个应该是垂直向上的，但是呢，因为我们计算的是，这是前一个步长，这是下一个步长，两个步长连起来就成了一个斜线。"],[1648,"显然 ATP 的仿真结果和我们的理论计算是一致的。"],[1656,"我们再可以从历史文件里面，也可以看到这个值。"],[1661,"在计算结果文件 LIS 文件中也可以看到这个结果。"],[1670,"看，这一片的都是20。"],[1684,"ATP 的仿真计算与理论计算结果完全一致。"]]},{"p":7,"t":"3.1 RLC电路稳态计算","d":1414,"s":[[1,"大家好，本期视频给大家介绍。"],[6,"利用 ATP 进行简单的交流稳态计算，我们要计算的是一个 RLC 回路，电阻五欧姆，电感100毫亨，电容1000微法，电源电压幅值100伏。"],[27,"打开 ATPDraw，新建项目文件或者我们叫它电路文件。"],[36,"点击右键，出现的这个菜单就是 ATPDraw 的所有的元件。"],[47,"我们先选择集中电阻。"],[53,"再选择电感，把它们两个连起来。"],[62,"点击右下角可以放大。"],[68,"点击这个按钮，把我们的电路组装。"],[76,"我们再选选择电容。"],[83,"给它赋值五个欧姆。"],[94,"现在我们给电感改值。"],[101,"从这个符号上看出电感它并了一个电阻，这是 EMTP 为了防止数值震荡引入的一个大电阻。"],[114,"电感是100毫亨，KP 表示这个阻尼电阻的大小，一般情况下取它的缺省值零。"],[131,"给它赋值1000微法，下面的 操作，在 t 等于10ms的时候，开关打开，这时候暂态过程才真正开始，按 F 二开始仿真计算。"],[707,"好，下面我们开始绘图。"],[712,"我们先看两个节点的电压。"],[718,"我们再看电流，把电流波形画在 plot 二上。"],[730,"下面我们来看这两个波形，我们设定的是在第10ms开关打开。"],[743,"这是在10ms之前它的电压波形，这个其实还是稳态过程，在10ms的时候，这个开关并没有打开，因为我们设的开关的节流值为零，所以开关在电流过零的时候才打开，电流过零大约发生在第18ms之后，电路才真正进入了暂态过程。"],[777,"通过这个视频，我们介绍了 ATP 中负的时间设置的方法和目的。"]]},{"p":11,"t":"3.5 开关的Imar参数及数值振荡","d":747,"s":[[1,"大家好，在本期的视频中，我们介绍开关的一个参数，IMAI。"],[2,"这个参数我们把它叫做开关的截流值。"],[3,"我们还要介绍因为开关的截流而引起的数值震荡，以及数值震荡的抑制措施。"],[4,"在这个电路中，开关是闭合的，流过开关的电流如图中蓝颜色的这条曲线所示，它是连续的数值。"],[6,"在进行暂态数值计算的时候，其实我们得到的是一个个离散的点。"],[7,"如果我们要打开这个开关，必须要提前设定一个截流值。"],[8,"截流值可以为零，也可以大于零。"],[9,"如果截流值等于零，我们通常说没有截流。"],[10,"如果截流值很小，我们也可以认为没有截流。"],[10,"如果截流值比较大，会发生我们通常意义上的截流，如切除空载变压器时发生的截流。"],[12,"如果设置的截流值为零，程序在计算中检测流过开关电流的方向，当开关的电流由负变到正，或者倒过来由正变到负的时候，开关打开。"],[112,"在图中的这种情况下，电流是由负变到正，所以真正开关打开是在这一个时间步长的下一个时间步长，开关中实际流过的电流是这样的。"],[132,"如果截流值大于零，当开关中的电流的绝对值小于截流值时，开关打开。"],[151,"在图中，在这个时刻，开关的电流值仍然大于截流值。"],[162,"在这个时刻，开关的电流值已经小于截流值。"],[167,"在此之后开关断开，开关中的电流实际上是这样的。"],[179,"从前面的介绍中可以看出，不论截流值是否选为零，实际计算中都会发生截流，只是大小不同而已。"],[190,"我们建立了这么一个 RLC 串联回路，来演示不同截流值的计算结果。"],[201,"我们看看开关的参数，在0.002s时合闸，在0.024s时分闸。"],[215,"我们先取截流值等于零安培。"],[219,"按 F 二计算，我们看计算的电流波形。"],[228,"从电流波形上可以看出，合闸时间0.002s，但是分闸时间不是0.024s，因为在0.024s的附近，电流不过零，直到这个地方电流过零的时候，开关才打开。"],[251,"把截流值改为2.5安培，我们再看计算的结果。"],[260,"把两种情况下的电流波形并联比较。"],[266,"上面这是截流值等于零的情况，下面是截流值等于2.5安培的情况。"],[274,"在0.0024s开关预定的打开时间，它的电流值还是4.167六安培，大于2.5安培，所以这个时候开关没有打开。"],[295,"只当开关中的电流小于2.5安培，时间大概是0.028s的时候，开关才打开。"],[310,"现在我们再来看节点 X 三的电压。"],[320,"根据严谨电路理论，在开关打开后，X 三点的电压应该是等于节点 M O R I C 上的电压，也就是电容上的电压。"],[338,"但是在仿真计算中，因为有节流，所以 X 三上的电压发生了振荡。"],[351,"屏幕上中间部分的曲线是节点 X 三和电容上的电压。"],[360,"上面这种情况是对应的节流为零的情况，下面对应的是节流为2.5安培的情况。"],[375,"红颜色的曲线是电容上的电压，它的纵坐标在右侧。"],[386,"蓝颜色的曲线是点 X 三的电压，它的纵坐标在左侧。"],[394,"可以看出，当节流为零的时候，它的振荡电压比较低，在±100伏左右。"],[407,"但是当节流为2.5安培的时候，它的振荡电压相当高，在±5000伏左右。"],[420,"把节流的电流部分放大。"],[428,"在两种情况下，这个正振振荡值就是上一个、下一个、上一个、下一个。"],[443,"下面这种情况也是这样的。"],[446,"在 ATP 中有两种方法可以消除这种数值振荡，一是给电感并联一个电阻，或者给电容串联一个电阻。"],[465,"二是把输出的数值进行平均。"],[472,"下面我们分别看一看这两种方法的效果。"],[480,"在第一种方法中，打开这个电感元件，这个参数 K P 就是阻尼电阻的系数，它设置的范围是5~10。"],[499,"在通常情况下，K P 的缺省值是零，不需要改变。"],[507,"在我们这个算例中，我们取最大值10。"],[514,"进行仿真计算。"],[522,"我们看它的阻尼效果。"],[526,"这是在节流为零的情况下，在电感上并联阻尼电阻前后的效果。"],[536,"上图有震荡，下图震荡被消除。"],[545,"在下图中，点 X 三上的电压等于电容上的电压。"],[554,"从图上看出来，它们两个好像是不相等。"],[559,"这两个曲线的纵坐标分别在左边和右边，而且零位置也没有对齐。"],[567,"我们把纵坐标都放到左侧。"],[575,"在这个地方可以看出来，点 X 三的电压等于电容上的电压。"],[588,"下面我们再用第二种方法，即把两个相邻点的输出进行平均。"],[600,"我们先把这个电感的阻尼电阻去掉，把 Kp 恢复为零。"],[609,"在菜单中选择 Additional，打开，在这个地方敲入 Average Output。"],[626,"这个是 ATP 的功能，在 ATP Draw 中目前还没有实现，所以只能是用这种半手工的方法进行。"],[638,"在 Additional 这个选项中，我们选择 Request，这就是特殊请求卡。"],[652,"进行仿真计算，然后我们看计算结果。"],[657,"计算结果是最下面的这张图，数值震荡被彻底消除。"],[669,"屏幕上现在显示的是节流为2.5安培时的。"],[676,"节点 x 三上的电压和电容上的电压，从上到下依次是没有阻尼，采用电阻阻尼，使用数值平均法。"],[691,"在这种情况下，数值平均法仍然有一个很大的尖峰。"],[701,"如果在仿真中发生数值振荡情况，大家可以尝试两种方法并进行比较。"],[712,"有一点需要注意，今天我们所说的数值振荡不同于变压器截流后发生的数值振荡。"],[721,"这个数值振荡是因为电感中的电流突变发生的，由于数学计算引起的。"],[732,"而变压器截流发生的振荡，同样由于电感中的电流突变而发生，但是振荡的机理是电路中电感能量和电容能量的互相转换。"]]},{"p":12,"t":"3.6 波形数据文件(pl4)的导出","d":522,"s":[[0,"大家好，本节视频和大家分享波形文件数据的导出方法。"],[7,"有时我们需要对 EMT P 的计算结果，通过 Matlab 二次编程进行数据处理，加之 EMT P 绘制的图形距离论文投稿要求有一定的差距，有时需要导入到 Excel 或者 Origin 中重新绘图，这就需要将波形文件中的数据取出，进行二次处理。"],[31,"今天我们大致和大家介绍三种方法，供大家使用。"],[36,"一、使用 plotxy 绘图软件直接导出变量。"],[41,"我们以雷电过电压仿真为例，运行仿真，进行绘图。"],[49,"plotxy 提供了数据导出的功能，即 save variables，选中需要导出的数据，添加到绘图列表中，点击 save variables，提示选择保存路径、文件名和文件格式。"],[79,"应注意三点，一、应将文件的保存路径设置为盘符的根目录下为加，若包含文件夹，文件夹名称不能包含中文和空格，推荐直接保存到桌面即可。"],[101,"二、保存文件的格式可以设置为多种，点 adf 的文件可以直接使用 Excel 来打开，点 mat 格式的文件需要使用 Matlab 来打开，大家根据需要进行选择。"],[117,"三、文件名应以英文开头，后面可以配以不同的数字来区分多组数据。"],[126,"点击保存，可以看到我们选择的变量成功被保存到了以下文件中。"],[134,"再次强调，文件的保存路径一定不要包含中文或空格，否则就会提示错误，显示不能打开文件。"],[146,"接下来我们来介绍第二种方法，使用 convert 或 pl 四 to mat 等第三方软件进行转换。"],[157,"首先我们先来看 convert 的使用方法，直接双击 convert。"],[166,"输入文件我们选择 P L 四文件，输出文件我们选择 mat V 四格式，或者是 A D F 格式都可以，大家根据需要选择输入文件的类型和输出文件的类型即可。"],[186,"点击 convert，会让你选择 P L 四，或者是你所选择的输入文件类型，这个文件所在的路径。"],[201,"我的这个路径是在软件安装目录下 ATP ATPDraw，ATP 的计算结果存放在这个文件夹下。"],[214,"我们选中它，点击打开，很快软件就会成功的转换完成，点击确定，我们在相应的路径文件夹下，我们能够看到产生了一个和 P L 四文件相同文件名的 mat 格式的文件，这就代表转换成功了。"],[242,"接着我们来看 P L 四 to mat 的软件使用方法，这需要将 P L 四文件放到 P L 四 to mat 这个程序所在的文件夹里，然后将 P L 四文件向 P L 四 to mat 点 e x e 拖动，会显示用 P L 四 to mat 点 e x e 打开，松手，软件会自动运行，然后会生成一个同文件名的 mat 文件。"],[276,"有时经常会遇到 P L 四文件过大，达到数 G，convert P L 四 to mat 等软件是无法运行的。"],[287,"大致的思想就是减小图形文件的大小，可以从以下几个角度入手，一，保持精度的前提下调大步长，二，无碍观察仿真结果的前提下缩短仿真时长，三，调整输出变量的数量，去掉不关注、不重要的电压、电流等输出。"],[312,"接下来我们来介绍第三种方法，通过 ATP 软件 tools 文件夹下的 ATP launch，或者是 P L 四 viewer 来导出 C S V 格式的数据文件，这两个文件在 ATP 文件夹下的 tools 文件夹里，这个是 ATP launch。"],[335,"这个是 P L 四 Viewer，使用这两个工具来进行数据转换。"],[343,"首先需要在项目文件里面生成文本形式的 ATP file，我们保存到相应的文件夹里，双击打开 ATP launch。"],[355,"Open，我们选择我们刚才生成的文本形式的输入文件，Run ATP。"],[365,"我们选择 P L 四到 C S V，它会自动打开 P L 四 Viewer，我们可以先不用管它。"],[374,"在这个提示框中选择 Save，这样在 P L 四文件夹下就会生成同文件名的 C S V 文件。"],[386,"有时大家的 ATP launch 并不能运行 ATP 进行计算，这个时候我们可以直接在项目文件当中 Run ATP 进行计算。"],[399,"然后我们打开相应的文本形式的 ATP 文件，直接在这里选择 P L 四 to C S V，效果是一样的。"],[412,"如果 ATP launch 还是无法使用，我们可以将生成的 P L 四文件放入到 Runplot 点 e x e 文件夹中。"],[425,"然后将 P L 四文件向 Runplot 点 e x e 拖动，使用 Runplot 点 e x e 打开，这样就是 P L 四 Viewer 的界面。"],[440,"在这里也可以同样选择 Save C S V 文件，弹出的对话框的设置是一样的，直接点击 Save 即可。"],[451,"C S V 文件是由逗号分隔的纯文本形式的，储存表格数据的一种文件，可以使用 Excel 直接打开。"],[465,"也可以使用 Ultra Edit 或者是记事本等文本编辑器来打开。"],[474,"最后我们来做一个总结，本节视频其实为大家提供了五种方法，即用 Plot X Y 直接导出，使用 Converter 转换，使用 P L 四 to Mat 转换，使用 ATP launch 转换，使用 P L 四 Viewer 进行转换。"],[501,"大家可以根据需要选择其中一种方法进行转换，将数据导出，在 MATLAB 或者是其他软件中编程对数据进行二次处理，也可以对图形进行再处理。"],[518,"好，今天的课程就到这里，我们下期见。"]]},{"p":13,"t":"4.1 TACS基础1","d":1128,"s":[[1,"大家好，今天介绍 TACS 的简单应用，参考书是 ATP-EMTP 及其在电力系统中的应用，第2.6节。"],[15,"我们首先看这一节的第一个例子。"],[22,"建立左边这个图所示的纯粹的一个 TACS 电路。"],[33,"TACS 这个电路它没有任何物理意义，仅仅是 TACS 的各种元件的练习。"],[48,"这个电路上包括三个电源 S 一、S 二和 S 三。"],[59,"还有五种 TACS 的逻辑运算，或、与、非、或非、与非。"],[72,"另外呢还有 TACS 的两种代数运算，加法运算和减法运算。"],[84,"下面我们在 ATP Draw 中演示如何建立这么一个电路。"],[96,"，为了方便起见，我们把刚才的图先拷贝到这个文件中，我们要创建的新文件中，这个不影响结果，这仅仅是这个项目文件的注释。"],[118,"我们先创建电源 S 一，TACS 的电源。"],[130,"从0.25s开始，结束时间我们选择1000s。"],[140,"它命名。"],[143,"同样我们可以建立 S 二和 S 三。"],[159,"把 S 关参考书。"],[1741,"下面我们看电压的波形。"],[1744,"两种模型计算的电压波形在细节上有差别，但是总体趋势是一致的。"],[1758,"取线路长度为20km，重新计算。"],[1763,"上面这个波形是贝杰龙模型计算的结果，下面的是π模型的计算结果。"],[1772,"可以看出暂态过程中π模型的衰减比贝杰龙模型要慢。"]]},{"p":23,"t":"6.2 输电线路的JMarti模型参数计算及简单电路仿真","d":873,"s":[[1,"大家好，本期视频的内容是输电线路的阶码器模型及应用。"],[8,"在观看本期视频之前，请首先观看有关输电线路的贝杰龙模型和π模型的视频。"],[22,"使用的参考书是《输电线路电磁暂态仿真及应用》。"],[27,"使用的算例是这本书第三章中图三杠一所示的500千伏线路。"],[37,"这是我们前面在介绍输电线路的贝杰龙模型和π模型时使用的一个简单电路。"],[49,"现在我们把这个电路再扩展，再加入一条使用阶码器模型的输电线路。"],[61,"我们直接拷贝，选择阶码器模型。"],[73,"这个线路的长度是150km，使用阶码器模型，它的参数设置比较多。"],[83,"这个频率在使用贝杰龙模型和π模型的时候是工频频率，在使用阶码器模型的时候是一系列频率中最小的频率，也可以理解为电磁暂态过程中出现的最小的频率。"],[105,"我们选00:05，它的最大频率在哪设置？"],[110,"它是在这个地方设置，但并不是直接设置最大频率，而是10倍频的个数。"],[120,"比如我们在这个地方取六，意思是。"],[126,"从最小到最大频率共有六个10倍频，因为最小的频率是0.05hz，那最大的频率就是5×10的四次方赫兹。"],[140,"这一个值，每个10倍频选的频率的点数，大家通常把这个数字选10。"],[151,"这个数值，这是进行相模变换的时候，使用在哪个频率下的相模变换？"],[167,"因为输电线路的相模变换矩阵是。"],[170,"随频率变化的，只能取暂态过程主导频率作为进行相模变换的频率。"],[179,"一般情况下，暂态的主导频率可能是在5000hz左右。"],[191,"工频是50，我们取一个中间值500。"],[197,"这个参数在仿真暂态过程之前往往要进行稳态计算，这就是进行稳态计算的频率，这个值一般取50hz。"],[211,"把这个线路名称叫为5.0L三。"],[219,"模型建立就结束了。"],[233,"把它连成连接为一个完整的电路。"],[236,"有一点要提醒，解码器模型和贝杰龙模型要选择实数变换矩阵。"],[248,"对于π模型，因为它里面不进行这种变换，所以实数变换矩阵选或者不选都不会影响计算结果。"],[265,"测量它的三相电压，给这个节点起个名称。"],[284,"开关的合闸时间，A相0.005s，也就是五毫秒，B相二毫秒，C相八毫秒，它们的分闸时间都是1000s。"],[300,"也就是在暂态过程中不分闸，电源还是100伏50hz三相正弦电源。"],[315,"最大仿真时长0.1s，五个周波。"],[326,"仿真步长5×10的负五次方秒。"],[331,"这个地方的 frequency 频率。"],[339,"一般是不会起作用的。"],[342,"好，下面我们进行仿真计算。"],[346,"计算结束。"],[351,"下面我们看仿真波形，我们把九条曲线都画在一张图上。"],[360,"三个模型，它的计算结果，它总体趋势是一致的，但是在前几个周波的暂态过程中，明显的有一些细节上的区别。"],[378,"把最大时长取为0.2s。"],[386,"这是仿真的波形，可以看出，在0.2s时它们都达到稳态，末端电压都趋于一致。"],[400,"我们再看看细节。"],[405,"我们在这个地方设置了输出电压的极值，下面我们在历史文件中看一看输出电压的最大值和最小值。"],[425,"直接到历史文件的最后面。"],[441,"这一块区域是最大值和最小值，过电压计算中在很多情况下关心的是极值。"],[450,"这是贝杰龙模型三个节点对应的电压，在相应位置的正下方。"],[464,"这是π模型三个电压，这是JMarti模型的三个电压。"],[471,"我们先看A相，贝杰龙模型A相最大电压1117，π模型的是105，JMarti模型的是113。"],[484,"再看负的最大值，贝杰龙模型A相是122，π模型是负的105，JMarti模型是负的114。"],[498,"对于初学者，观看这一段视频之后就可以基本掌握JMarti模型的使用。"],[508,"下面我们对JMarti模型做比较深入的介绍。"],[512,"前面介绍的参数选择，对于电磁暂态计算过程来 ],[253,"这是零序、正序参数，波阻抗的幅值、相角、衰减系数、波速、波长、电阻、电抗、导纳。"],[281,"在 ATPDraw 的界面上，ATP 的一部分线路计算的输出功能没法选择，其中对我们比较有大的用处的是频率扫描功能。"],[302,"要使用这一部分功能，我们要修改 ATPDraw 形成的线路参数计算文件。"],[312,"我们先建立贝杰龙模型，在贝杰龙模型的线路计算输入文件基础上进行修改，这样会方便一些。"],[326,"这个地方，我们把它改为00:05，表示线路扫描的频率是从0.05hz开始。"],[340,"选择 OK，程序进行了计算，我们现在要对它生成的数据文件进行修改。"],[355,"它生成的线路参数计算输入文件是500 L 一点 data。"],[365,"我们把它打开。"],[369,"根据书上第86页和第104页，我们把这个文件中的部分参数进行修改。"],[389,"首先，我们在第62列输入五，表示我们从0.05hz开始，共进行五个10倍频的扫描，也就是从0.05hz到5000hz。"],[409,"然后在64和65列，我们输入10。"],[419,"表示在每个10倍频输出10个频率参数，接下来我们进行计算。"],[430,"要注意的是 ATP，我们用 ATPDraw Launch 这个程序来进行计算。"],[442,"我们给它输入需要的文件。"],[451,"OK，也可以在这个地方 open。"],[460,"这个地方输入需要计算的线路参数输入文件。"],[472,"计算。"],[475,"现在我们来看计算结果。"],[480,"这是文件头，这部分东西我们就不详细说了，看这一部分内容。"],[495,"这是我们需要的计算结果。"],[498,"这一部分是连续参数，这一部分是正序参数。"],[504,"最后是频率，这两个就是传播系数伽马的对应的实部和虚部，也就是阿尔法加j贝塔，这是阿尔法，这是贝塔。"],[526,"这是单位长度电体，单位长度电感和单位长度电容。"],[533,"这一部分是连续参数，右边的这一部分是正序参数。"],[539,"从0.05hz到了5000hz。"],[545,"下面我们把有关参数进行修改，以绘制线路参数随频率变化的曲线。"],[562,"为了和书上的一致，我们把大地电阻率修改为100。"],[571,"在第62列输入九，表示总共计算九个10倍频，从00:05开始到5×10的七次方赫兹。"],[595,"在每个10倍频输出10个点。"],[601,"运行 ATP。"],[613,"下面我们看计算结果。"],[624,"这是频率。"],[628,"我们先把频率按列选择，拷贝到 Origin。"],[644,"同样，我们把连续电阻和正序电阻选择拷贝到 Origin。"],[654,"现在我们绘制连续电阻和正序电阻。"],[662,"随频率变化的曲线。"],[665,"我们把坐标轴都变成对数的。"],[679,"改变坐标轴的名称，再修改其他的一些参数，就得到我们想要的曲线。"]]},{"p":25,"t":"6.4 输电线路的pi模型及其在稳态计算中的使用和验证","d":1014,"s":[[2,"大家好，今天给大家介绍输电线路的π模型及其在稳态计算中的使用。"],[12,"用到的参考书是《输电线路电磁暂态仿真及应用》。"],[18,"我们在使用 ATP 的时候，对于输电线路经常会看到有两种模型，一种叫准确π模型。"],[36,"在 EMTP 的相关的理论书中叫 exact pi circuit，还有一种叫标称π模型。"],[48,"那叫 nominal pi circuit。"],[52,"准确π模型严格的基于电路理论推导的一种模型，它是精确模型。"],[62,"标称π模型是近似模型，通常也称简化π模型。"],[68,"也进一步我们把它叫做π模型，通常大家所说的π模型一般指的是简化π模型。"],[79,"现在我们来看图四杠一，这是一个单向的输电线路，首端的电压电流 u 一 i 一，末端是 u 二 i 二。"],[93,"根据电路理论，我们得到四杠一是等式的左边是线路左端的电压和电流，等式的右端是线路右端的电压和电流。"],[108,"这里面有几个我们经常会在电磁暂态计算中碰到的参数，波阻抗 ZC 和传播系数伽马。"],[119,"把四杠一变形，如四杠四所示，这左端是电流，右端是电压。"],[131,"这个和节点导纳矩阵的形式相同，变成这个的目的是为了把电路转化为这种直观模型。"],[147,"根据节点导纳建立的方法，我们把它变形为这样。"],[155,"明显 Y A 加 Y B 是等于这个，负的 Y A 等于这个，这样 Y A 已经得到了。"],[171,"把 Y i 带到式四杠五中，我们就得到了 Y i b。"],[177,"在有些场合，我们希望把这元件表示为阻抗形式。"],[184,"Y i 的倒数 Z i。"],[188,"Y i b 的倒数 Z b。"],[195,"这样我们把输电线路就简化成了一个准确π模型。"],[204,"当线路不太长的时候，我们把输电线路的准确π模型往往进行简化。"],[211,"另外呢，准确π模型要涉及到复数运算，在暂态计算中不能使用，也需要把它进行简化。"],[222,"简化之前我们先假假设线路的电阻远远小于电抗，线路的电导远远小于电纳。"],[237,"那么波阻抗就仅仅和 C 和 L 二有关，传播系数也是仅仅和 C 和 L 二有关。"],[250,"这样前面的 Z i 和 Z b 就简化成这个式子。"],[259,"前面的双曲正切函数变成了正弦函数，Z b 同样变成这种形式。"],[266,"前面的双曲正切函数变成了三角函数里面的正切函数。"],[276,"对上面两个式子进一步简化，把 sin x 展开为泰勒级数是这样，当 x 很小的时候，我们把后面的从第二项开始所有的项可以省略掉，就 sin x 近似的等于 x。"],[300,"同样，tangent x 近似的等于 x。"],[310,"这样把式4~12和13进一步简化为4~16和4~17。"],[321,"在4~16里面，Z i 线路的等效的串联阻抗就是电抗。"],[332,"Z b 线路每端等效的容抗。"],[340,"它是线路的总电容的一半。"],[348,"我们再把电阻的影响考虑进去。"],[354,"那线路的串联阻抗就是这个公式。"],[362,"我们一般不需要考虑线路的电导，因为电导非常小。"],[368,"这样前面的准确π模型就变成了像图四杠三所示的简化π模型。"],[377,"下面我们来看这种简化的误差。"],[383,"一条500千伏线路为例说明。"],[388,"上面一行这两个图是线路的正序的参数 ZA 和 ZB 的幅值误差，这是这个图是相角误差。"],[401,"下面是零序参数的幅值误差和相角误差。"],[410,"总体而言，当使用简化π模型的时候，正序参数的误差要小一些。"],[420,"导线的长度是200km的时候，正序参数 Z2 的误差达到1%。"],[433,"但是零序的误差要大一些。"],[438,"当线路长度200km的时候，零序误差已经达到了3%。"],[451,"所以进行计算的时候，当线路长度在50km，可以选用简化π模型。"],[460,"如果线路更长，简化π模型的误差就过大。"],[464,"下面介绍输电线路的π模型在稳态计算中的使用。"],[474,"ATP 中有两种稳态计算，第一种就是纯粹的稳态计算，第二种是为暂态计算赋初值。"],[490,"这是一条500千伏线路，线路的参数见书上33页图三杠一，这是交流稳态电源，线路的几何参数我们已经输入完毕。"],[508,"选择贝杰龙模型，但是 ATPDraw 的这种设置里面没有我们想要的电阻、电感和电容参数。"],[524,"当然你可以从它的波阻抗和波速参数中求出来，这样比较麻烦一点。"],[534,"为了直观起见，我们把线路参数计算的数据做一下修改。"],[544,"在这个地方第52列输入五，表示我们输出五个10倍频，从50hz开始。"],[563,"其实按照我们的计算要求，我们只需要50hz，这个地方设一就可以了。"],[571,"在65列设一，表示我们在一个10倍频只取一个点，因为我们的目的不是绘图，一个点就够了。"],[588,"好，我们重新进行计算，这时候要从这个地方进行计算。"],[593,"这是计算结果。"],[604,"关于这一部分计算的有关详细的说明，在其他的视频中已经有介绍。"],[614,"这第一行参数就是在50hz下的参数。"],[618,"左边这是零序参数，右边是正序参数。"],[625,"我们关心的是电阻、电感、电容。"],[631,"假设线路末端的阻抗是 ZR，根据式四杠一，我们能够得到线路首端和线路末端电压的关系是这样的。"],[660,"从前面的计算中，我们已经得到了线路的传播系数伽马、波阻抗 ZC，假设线路末端的阻抗为500欧姆。"],[676,"U一知道。"],[678,"我们很容易计算得线路末端的电压。"],[684,"为了方便起见，我们在 MATLAB 中编程计算。"],[692,"取 U 1=100，相角是零度。"],[702,"在线路首端施加连续电压，所以在这个地方我们用的是连续参数。"],[713,"计算得到 U 二，这是 U 二的幅值87.8269伏，相角-28.3867°，这是严谨理论计算的结果。"],[731,"下面我们在 ATP 中进行计算。"],[739,"我们先选择的是贝杰龙模型。"],[748,"我们把相三相的参数设置成相同，这就是三相连续电源。"],[759,"Tmax 取负值进行稳态计算。"],[768,"这是稳态计算的结果。"],[777,"末端的电压幅值和相角。"],[785,"把它和 MATLAB 计算的结果比较，两者非常接近。"],[795,"当把线路的模型选为贝杰龙模型的时候，ATP 进行稳态计算的时候，其实它里面使用的是线路的准确π模型，所以它和 MATLAB 计算的结果完全相同。"],[816,"假设首端施加的是正序电压源，我们重新进行计算，这是 ATP 和 MATLAB 计算的结果，可见两个也是非常接近的。"],[836,"下面我们选择 JMarti 模型看计算结果。"],[844,"我们把解码器它开始的频率选的比较小，00:05。"],[858,"它总共选五个设备频，就相当于选到5000hz。"],[872,"好，我们再进行正序情况下的稳态计算。"],[896,"这个结果和采用贝杰龙计算的结果是完全相同的。"],[910,"也就是说，如果你选择的是解码器模型，在进行稳态计算时，ATP对线路仍然采用的是准确的π模型。"],[926,"但是，如果采用π模型，计算结果会完全不一样。"],[937,"我们还是在线的首端施加正序100伏电压。"],[945,"现在我们采用的是π模型。"],[951,"这是计算结果，显然这个结果远远小于准确π模型的计算结果。"],[968,"所以，当线路比较长的时候，不能使用集中参数π模型。"],[977,"取线路长度为40km，重新进行计算。"],[984,"这上面是 ATP 的计算结果，下面是准确π模型的计算结果。"],[993,"ATP 计算的电压是102.6伏，准确计算结果是99.8伏，两个的角度也是比较接近的。"],[1006,"所以在线路长度比较短的情况下，可以使用π模型。"]]},{"p":26,"t":"6.5 输电线路参数的相模变化-理论","d":1073,"s":[[1,"大家好，今天给大家介绍输电线路参数的相模变换。"],[10,"有两个目的，一，使大家理解相模变换的数学原理，二，能够看懂 ATP 输电线路计算子程序的输出结果。"],[27,"这个内容可以使用的参考书比较多，推荐之一是《输电线路电磁暂态仿真及应用》。"],[39,"我们首先回顾一下单导线的波动方程。"],[48,"这是单导线我们常用的等效电路。"],[57,"R、L、C、G 参数大家都知道，分别是单位长度的电阻、电感、电容和电导。"],[72,"U 是这一点的对地电压，I 是导线中的电流。"],[78,"由电路定理得到线路的基本的微分方程是这样的，把它变形为像是五杠一和五杠二，是为了方便理论分析，我们先把电阻和电导忽略掉，就得到的是五杠三和五杠四。"],[106,"五杠三和五杠四就是导线的一阶微分方程，把它进一步变形就得到五杠七和五杠八导线的二阶微分方程。"],[123,"解这个二阶微分方程就得到了导线的波动方程。"],[132,"这两个波动方程之间的联系，就是通过这个波阻抗联系起来的。"],[144,"通过深入分析波动方程，得到了单相无损线路的等效电路。"],[157,"这就是在电磁暂态计算中单相无损线路的贝杰龙模型。"],[168,"在 ATP 中，对多相导线来说，它的模型的基本思路是把它转换为单相导线。"],[183,"那么单相导线的贝杰龙模型也可以适用到多相导线中。"],[193,"多相导线的一阶微分方程和二阶微分方程和单相导线的类似，如式五杠二4~5杠二七所示。"],[211,"但和单相不同的是，这里面 u i 是列向量，l 和 c 是方阵。"],[227,"如果有 n 条导线，那 l 和 c 就是 n 乘 n 阶方阵。"],[233,"那 l c 和 c l 同样是 n 乘 n 阶方阵。"],[241,"由于导线之间存在电磁耦合，l c 和 c l 它的非对角元素不等于零，所以不能像求解单导线的波动方程一样求解这几个式子。"],[259,"虽然我们在物理上能够直观的理解模量，我们平常所说的正序、零序和负序，在数学上它有严谨的变换过程。"],[278,"我们对这个严谨的变换过程做一简要介绍。"],[286,"首先，令 u 等于 t v u m，i 等于 t i 乘 i m。"],[293,"u m 和 i m 就是我们从相域变到模域的量，叫模量电压和模量电流。"],[309,"t v 和 t i 分别称为电压电流变换矩阵。"],[316,"把它们代入上面这个式子中进行变形，就得到了五杠30和五杠31这两个式子。"],[332,"这一部分内容。"],[337,"让我们很容易想到了线性代数中的相似变换。"],[344,"同样这一部分也是。"],[349,"通过选择适当的 t v 和 t i。"],[354,"我们就可以把 l c 和 c l 分别变换成对角矩阵 lambda v 和 lambda i，即这一部分等于 lambda v，这一部分等于 lambda i。"],[376,"这样因为 lambda i 仅仅是个对角阵，就相当于对应的 n 个方程之间没有互相耦合，其实就是 n 个独立的没有关系的方程。"],[396,"对这个方程也是同样的，这样我们就完全用分析单相电路的背景能法来分析多相电路。"],[411,"相模变换与输电线路的换位方式有关。"],[418,"输电线路有两种换位方式，平衡换位和非平衡换位。"],[426,"首先我们介绍平衡换位输电线路的相模变换。"],[431,"平衡换位线路的电感矩阵 L，它的对角元素是相等的，它的非对角元素也是相等的，也就是说这个矩阵里边只有两个不同的数值。"],[449,"电容也是同样的，它们两个相乘以后得到的 L C 和 C L 也有这种可能性，而且 L C 等于 C L。"],[465,"我们简单回顾平衡矩阵 P 的相似变换过程。"],[472,"这个 P 可以是咱们刚才说的 L C 或者是 L C 或者是 C L。"],[481,"现在对角元素是 P s，非对角元素是 P m。"],[489,"通过我们所学的线性代数的变换，我们很容易得到把 P 这个矩阵变换为三角矩阵以后。"],[505,"它的对角元素是兰姆达一和兰姆达二，其中兰姆达一等于 ps 加 n 减一乘 pm，兰姆达二一直到兰姆达 n 它是同一个值，就是 ps 减 pm。"],[524,"其实这个在我们的嗯电学里面，通常把这个值叫做地模的量。"],[537,"兰姆达二一直到兰姆达 n 就叫线模。"],[543,"如果是三相线路，n 等于三，这样兰姆达一等于 ps 加二倍的 pm。"],[552,"这是我们通常很熟悉的一个连续参数的计算公式。"],[562,"把平衡矩阵变换为对角阵，它对角阵上的元素是唯一的兰姆达一和兰姆达二，但是它的变换矩阵有多种多样。"],[581,"第一个就是我们常说的对称分量变换。"],[585,"在这个变换矩阵里面，a 等于 e 的 j 120°，这个是交流三相稳态计算中使用的。"],[595,"我们常说的正序、负序或者零序，都指的是稳态参数。"],[603,"第二，克拉克变换是这么一种变换。"],[608,"这种形式呢，我们可以把它归一化，就是把它的每列的模变成一。"],[618,"还有零伽马 c 他变化，还有卡隆波变化。"],[625,"在 M T C 里面通常用的是这么一个通用变化矩阵。"],[632,"以上的变换过程源自于对 L C 矩阵或者 C L 矩阵的变换。"],[642,"同样可以证明，对单独的 L 或者 C 矩阵的变换，也可以用同样的相似变换矩阵进行变换，得到模量的电感和电容参数。"],[660,"模量的电感参数，对三相来说有三个模量，但是两个是相同的。"],[674,"变换后矩阵的对角元素，它的形式和前面说的 P 矩阵也完全相同。"],[684,"对 C 矩阵也是同样的，L s 加二倍的 L m，这就是我们通常所说的零序电感。"],[696,"L s 减 L m 正序电感或者是负序电感。"],[702,"对电容来说，正序和零序的公式的计算和电感的计算公式类似。"],[711,"前面我们讲了平衡换位线路的相模变换，接下来我们讲非平衡换位线路的相模变换。"],[721,"对于平衡换位的线路的相模变换，相模变换矩阵是通用的矩阵，也就是说，不管你是330千伏还是750千伏线路，也不管你导线对地的高度是多少，变换矩阵都可以是相同的。"],[748,"对于非平衡换位线路来说，L 和 C 相乘不等于 C 乘 L。"],[757,"在这种情况下，变换矩阵和具体的线路有关，没有通用变换矩阵。"],[769,"我们分别介绍在实数域和频域内非平衡换位线路的相模变换。"],[777,"先介绍在实数域中的变换。"],[780,"首先把电阻和电导忽略掉，可以推导出矩阵 L C 和矩阵 C L 可以变换为相等的对角阵，统一用兰姆达表示。"],[795,"有一点需要提醒，在很多教科书中提到，如果要满足式五杠77，必须要满足条件五杠75，也就是要满足电压变换矩阵等于电流变换矩阵逆阵的转置矩阵。"],[796,"其实这个条件是不需要的。"],[796,"这样非平衡换位线路的经过模量变换后的波动方程和平衡换位线路的模量方程完全相同，它的模量电压和电流分别是 n 个相互独立的方程。"],[797,"我们可以把它们当做单导线来对待，可以用贝杰龙法建立电磁暂态模型。"],[852,"有一点需要注意的是，由于线路参数是随频率变化的，所以 C L 和 L C 都是随频率变换的。"],[869,"但是呢，在我们关心的频率范围之内，它的变换矩阵变化不是很大，所以我们采用固定在某一个频率下的变换矩阵来进行电磁暂态计算，整个计算过程被大大简化。"],[894,"在很多情况下，我们关心的是模量参数，模量电感、电容和电阻。"],[906,"通过前面的计算，我们得到了变换矩阵 T I 或者 T V，通过推导可以得到模量变换的公式，是五杠99，就是把电感参数变换为模量电感。"],[924,"五杠100是把电容参数变换为模量电容。"],[931,"在前面的讨论过程中，电阻被忽略掉了。"],[941,"那么模量电阻是怎么求的呢？"],[944,"因为电阻它是和电感是串联的，模量电阻的计算公式和模量电感是相同的，都是这种形式，像是五杠110所示。"],[959,"前面我们介绍了在实数域进行线路参数的相模变换，接下来我们介绍在复数域进行变换。"],[975,"很容易得到在某一频率下输电线路的一阶和二阶微分方程，这个形式和实数域的一阶二阶微分方程的形式基本相同。"],[994,"在频率内，电压电流都是向量。"],[999,"Z 取代了 L 的位置，Y 取代了 C 的位置。"],[1010,"在这个里面，Z 肯定是包含电阻的，如果不包含电阻，那就又回到时域了。"],[1019,"Y 是导纳矩阵，它可以包含电导，也可以不包含电导。"],[1029,"在频域内对线路参数进行模量变化的理论推导过程和在时域内的推导过程完全类似，用这个公式。"],[1045,"把阻抗矩阵 Z 转化为对角矩阵。"],[1051,"这个公式把导纳矩阵转化为对角矩阵。"],[1058,"对角矩阵的元素就是我们通常称之为的模量阻抗和模量导纳。"]]},{"p":27,"t":"6.6 输电线路参数的相模变换-验算","d":1074,"s":[[1,"大家好，今天讲输电线路参数的相模变换在 ATP 中的应用。"],[8,"使用的参考书是《输电线路电磁暂态仿真及应用》，主要内容是其中的第五章。"],[17,"这一章使用了第3.2节500千伏线路作为例子，所以我们这也以这条500千伏线路为例进行示范。"],[35,"线路的参数我们已经全部输入，我们选择不换位，线路的地线、主塔接地。"],[49,"选择π模型，这个选项表示有打印输出。"],[56,"我们输出的是 Z、ZE 和 ZS，还有 C、CE 和 CS。"],[67,"Z 是所有的14根导线的阻抗矩阵。"],[75,"ZE 下标 E 表示是等效的相导线的阻抗矩阵。"],[85,"它和 Z 的区别是，第一把所有的分量导线合并为一条导线，第二消去了地线。"],[95,"阻抗 ZS 它是对称分量阻抗，就是对 E 进行转换变成了我们通常说的是正序、负序、零序或者是一序、二序、三序。"],[113,"对于 C 电容来说也是同样的，这个 C 表示的是14条导线的电容矩阵。"],[126,"CE 是消除了地线，合并了相导线以后的电容矩阵。"],[134,"CS 是对 CE 进行变换之后的矩阵。"],[144,"给这条输电线路命名为500 L 一，然后我们计算线路参数。"],[152,"注意计算线路参数不需要建立一个完整的电路。"],[161,"我们点 run ATP。"],[167,"线路参数计算结束。"],[173,"我们想要的结果在文件500L一点LIS。"],[183,"或者是500L一点LIB里边也有。"],[190,"我们下面看500L一点LIS里面的内容。"],[201,"前面这一部分。"],[205,"是它的输入数据的重复。"],[213,"这一部分。"],[215,"把集中输入的相导线。"],[222,"变成了单独的导线，单独共有14条导线，每一相有四条，再加上两根地线。"],[236,"这一部分是电容C。"],[240,"这是14相导线的电容C。"],[246,"我们对它不做过多讨论，这一部分内容是。"],[252,"等效的相电容，也就是这14条导线中合并了分裂的相导线，消去了地线以后的结果。"],[266,"，这个内容呢，它是前面等效相导线电容经过转换以后得到的。"],[276,"需要注意的是，在 ATP 中，在输出这种矩阵的时候，由于矩阵是嗯对称的，所以它只输出了下三角矩阵。"],[294,"下面我们看如何把等效相导线电容矩阵转换为对称分量电容矩阵，也就是把前面的 C E 转换为 C S。"],[317,"我们常见的矩阵 C E 是这种形式，把 C E 矩阵转换为 C S 矩阵。"],[333,"用的去转换矩阵是这个 S 矩阵。"],[337,"其中 A 等于 e 的 j 120°次方。"],[349,"转换使用的公式是这个公式。"],[355,"我们利用 MATLAB 计算，这个是转换的结果。"],[367,"我们简单的看一看在 MATLAB 中转换的情况。"],[377,"这是 C E，我们已经事先把它复制好了。"],[389,"我们也建立了转换矩阵 S。"],[396,"利用刚才的公式，我们很容易算的是 C S。"],[406,"这是 MATLAB 转换的结果。"],[415,"在这个地方大家有个疑问，就是在 C S 中，它的元素有实部有虚部。"],[430,"出现这个问题是因为 ATP 仍然把 C E 当作平衡矩阵，使用平衡矩阵常用的转换矩阵进行转换，而实际上 C E 不是平衡矩阵，所以转换的结果里面包含实部和虚部。"],[462,"其实 C S 的这个转换对我们一般工程上没有多大用处。"],[471,"在这我们仅仅想让大家明白这个 C S 是怎么计算得来的。"],[478,"仔细比较 ATP 和 MATLAB 的 C S 的计算结果，发现这两个电容并不完全相同。"],[492,"其实在 ATP 中它已经有说明，它的元素的排列是。"],[501,"对行来说就是零序、一序、二序，但是对列来说是零序、二序、一序。"],[514,"也就是说，它把 Matlab 计算结果的第三列和第二列进行了对调。"],[524,"这么对调以后，这个矩阵就是一个对称矩阵，仅仅显示矩阵的下三角不会引起误解。"],[534,"类似的，我们可以比较 ATP 计算的和 Matlab 计算的 ZS 矩阵。"],[546,"这是 ATP 计算的结果，这是 Matlab 计算的结果。"],[553,"我们把它们放在一起比较，可以看出两者的计算结果是一致的。"],[566,"同样需要注意的是，ATP 计算结果中，对列元素的排列是零序、二序、一序，对行元素排列的顺序是零序、一序和二序。"],[582,"实际上对于非平衡化为线路，它的线路参数通常不会使用前述的 S 矩阵来进行转换。"],[596,"ATP 转换的这部分参数在工程上很少用到。"],[603,"下面分别在实数域和复数域把非平衡化为线路的参数转换为工程上使用的模量参数。"],[613,"首先我们利用 Matlab 在实数域进行变换。"],[620,"在实数域变换的时候，电阻要忽略掉。"],[626,"我们已经得到感抗矩阵 Xe，把它转化为电感矩阵，这是等效相导线的电抗矩阵。"],[640,"然后我们计算 Ce 乘以 Le 变换后的三角矩阵以及变换矩阵 Ti，就是我们想要的电流变换矩阵。"],[659,"D 就是变换之后的三角矩阵。"],[666,"我们在 ATPDraw转。"],[670,"刚才给线路选择的是π模型。"],[674,"但是 ATPDraw的π模型中不输出电流变化矩阵，电流变化矩阵在贝杰龙模型中输出。"],[683,"所以这个时候我们选择贝杰龙模型，再选择实数变换矩阵。"],[693,"在 LIS 文件中，电流变化矩阵是这个。"],[700,"因为我们选择的是实数变换矩阵，所以变换矩阵的所有的虚部都是零。"],[711,"刚才我们使用的是实数变换矩阵，接下来我们使用复数变换矩阵，这个地方不打勾就可以。"],[721,"这是计算结果，这一部分是转换矩阵。"],[731,"前面三行是实部，后面的三行是对应元素的虚部。"],[742,"我们在在 MATLAB 中看转换矩阵。"],[751,"注意这一部分内容把电容 C e 变成了 j 欧米伽 C e，也就是导纳。"],[762,"这一部分是阻抗，也就是电阻加电抗。"],[769,"我们把刚才计算的四个矩阵放在一起进行比较。"],[775,"首先我们看实数变换矩阵，总体来说 ATP 和 MATLAB 计算的实数变换矩阵比较接近。"],[787,"但是有一点需要注意，变换矩阵的第一列，ATP 和 MATLAB 计算的结果符号是相反的。"],[799,"因为变换矩阵的每一列乘以一个常数得到的结果仍然是变换矩阵，所以这个不影响计算结果。"],[814,"最后一列它的符号也是相反的。"],[818,"我们再来看复数变换矩阵，两个复数变换矩阵的实部比较接近，虚部相差比较大。"],[830,"两个变换矩阵都是准确的，因为算法不同，结果也不同。"],[838,"下面我们对前面所说的四个变换矩阵变换的模量阻抗进行比较。"],[850,"首先需要说明，变换矩阵可以有很多个，取不同的变换矩阵所得的模量也不相同。"],[863,"我们先比较使用实数变换矩阵变换的情况。"],[869,"这一部分是 ATP 计算直接输出的模量阻抗。"],[878,"为了比较期间，我们把 ATP 利用复数变换矩阵的结果也放在这。"],[888,"它们两个的值其实是非常接近的。"],[896,"这一部分是对 ATP 计算结果的直接验证。"],[908,"使用的变换 "],[369,"这是右端小电抗中流过的电流，峰值大概是100安培。"]]},{"p":37,"t":"8.1 非线性电阻","d":1147,"s":[[1,"大家好，本期视频介绍 ATP 中的非线性电阻。"],[9,"图中左端的图是 ATPDraw 中菜单中的非线性电阻和非线性电感，我们仅仅看电阻部分。"],[21,"右端是 ATP 的用户手册中的非线性电阻和非线性电感。"],[28,"首先我们看看它的编码，九九、九二、九七等等。"],[37,"在 ATP 的输入文件中，每一个元件第一行的前两列是这个元件的标识字或者标识符或者标识码。"],[53,"这是一个 ATP 输入文件的一部分，我们把它作为例子来说明。"],[62,"这个地方的负一、负二、负三，这是表示一条输电线路的三相。"],[72,"这个地方的14表示这是交流电源，九九是一种非线性电阻的标识码，通常我们把这种电阻叫做九九型电阻或者九九型元件，其他的情况类似。"],[94,"大家能看到九九型是只有一种，但是九二型有两种，九一型也有两种。"],[104,"为了区分这两种九二型或者九一型，还需要更多的标识符或者标识字、标识码，这就是大家在右边图上看到的是四个五、四个三或者四个四，这些标识符并不出现在元件数据行的前两位，而是出现在其他地方。"],[130,"我们先对这几个电阻的总体情况进行说明。"],[136,"九九和九二型是电阻随着电流变化，其实也是电压随电流变化。"],[148,"九七和九一型是电阻随时间变化。"],[155,"再往下面走，倒数第二行 MOV 九二型，这个九二型是我们通常用于氧化锌避雷器。"],[169,"最后一行，R TACS，这个电阻，它是计算出来这个值，它是个 TACS 元件，我们在前面的 TACS 算例中曾经使用过。"],[185,"那么九九型和九二型非线性电阻有什么区别？"],[190,"它们的输入数据几乎相同，主要区别是解它们的电压和电流的方法不同。"],[200,"从 ATP 的使用说明的标题中可以看出，九九型叫做总非线性电阻，而九二型包括用于氧化锌避雷器的九二型，叫做真正非线性电阻。"],[222,"总非线性电阻的解法是这样的，在这一个步长，假设这个电阻的工作点和上一个步长的工作点是相同的，那么在解的过程中一步就把这个值解出来了。"],[241,"这种方法的问题是，如果你假设错了，不重新计算，而是在下一步计算的时候改正过来，这样就会产生一定的误差。"],[252,"当非线性电阻的工作点从一段到另外一段计算的过程中，总会发生这种情况。"],[261,"好在我们一般计算的步长取得很小，所以这种误差的影响很小。"],[270,"而 ATP 中真正非线性电阻的求解是采用的牛顿迭代法。"],[276,"首先给一个迭代初值，然后通过几次迭代得到结果。"],[283,"所以如果不考虑迭代的收敛判据所产生的这种极其微小的误差，这种方法得到的值是真正的解。"],[293,"从工程实用角度来看，因为我们在计算中取的时间步长很小，所以两种方法两种元件对应的计算结果相差很小。"],[305,"现在我们就有两种九二型非线性电子，我们把这种叫做常规的九二型非线性电阻，这种叫做避雷器用九二型非线性电阻。"],[324,"这两种非线性电阻有什么区别？"],[327,"我们用它们的伏安特性来说明，我们在输入的时候不同的非线性电阻。"],[338,"输入值都是以前电压和电流的离散值，就像这个图上一样。"],[345,"对于常规的九二型非线性电阻，在内部处理的时候，把这些点用直线段连接起来，就像图中的绿色的折线所示。"],[359,"而对于避雷器用九二型元件内部处理的时候，把这些点拟合为曲线，如图中橙色的这个曲线所示。"],[373,"显然这种光滑曲线更符合实际情况。"],[377,"对于氧化锌避雷器或者消谐电阻，我们通常采用后一种模型。"],[385,"下面我们再说说两个时变非线性电阻，九七型和九一型。"],[394,"从名称上可以看出，九七型非线性电阻的时间电阻特性是这样的，就从一个时间到下一个时间，它的电阻是一条直线。"],[410,"而九一型非线性电阻的特性是这样的，如图中的这一条绿色的线，从这个时间到下一个时间，它是一条线段。"],[425,"关于时变电阻，即九七型和九一型电阻的使用，请大家参考 ATP 的使用说明。"],[437,"今天我在这里给大家示范一下九九型和九二型非线性电阻的使用。"],[445,"在介绍电路之前，我们先说明一点，在 ATP 中，几乎所有的非线性元件在稳态计算的时候都是断开的，都没有连接在电路中。"],[461,"我们已经建立好了两个电路，这两个电路在同一个 ATPDraw 的电路文件中。"],[469,"两个电路的电压源和线性电阻是相同的。"],[478,"这是交流电源，我们给它取的幅值是40伏。"],[484,"这是一个两欧姆的电阻。"],[491,"这上面这个电路是九二型电阻，下面这个电路中是九九型电阻。"],[501,"我们先看这个九二型非线性电阻的参数。"],[507,"它有四个参数，打开帮助文件。"],[513,"第一个参数，unflash，这个是和串联间隙有关的。"],[527,"因为最早的避雷器是有串联间隙的，现在的氧化锌避雷器大部分都没有串联间隙。"],[535,"它有负一、零和正一三个值。"],[540,"r内和这个非线性电阻串联的一个线性电阻的值，这个值通常应该是零。"],[549,"第三个，vflash，这个也是和间隙有关的。"],[556,"在暂态过程中，当间隙上的电压高于vflash时，间隙被击穿。"],[562,"通常我们取负值，表示没有间隙。"],[567,"这个参数使用牛顿迭代法求解电压电流过程中使用的迭代初值，通常情况下可以把它设为零。"],[581,"在characteristic这个标签页下面，我们已经输入了它的伏安特性。"],[594,"点位有，我们能看到它的伏安特性曲线。"],[605,"另外大家在输入的时候记得不要输入坐标原点，只需要输入正半轴的数值。"],[613,"下面我们再来看这个九九型非线性电阻。"],[620,"它的伏安特性和刚才的九二型非线性电阻的伏安特性完全相同，是从那边拷贝过来的。"],[636,"它的参数也有四个，我们打开它的帮助文件来看参数的含义。"],[646,"这个非线性电阻也是有间隙的。"],[651,"vflash在暂态过程中，间隙上的电压超过vflash的时候，间隙被击穿。"],[659,"t内间隙在击穿后保持击穿状态的最短时间，即便在这段时间内电流过零了，间隙还是在击穿状态。"],[675,"jump暂态过程工作的第一段，vcell如果这条支路上的电压低于vcell间隙就打开，这几个参数vflash、tdelay和vcell都是和间隙有关的，我们在暂态计算中，除非确实有间隙，一般情况下我们不会用这个元件，在这个九二型元件中，vflash取负一，它表示没有间隙。"],[716,"在九九型元件中，它的vflash是零，就是在零伏的时候，它间隙击穿了，也相当于是没有间隙。"],[731,"我们把这个jump，就是在第一次进行暂态计算的时候，它的这个段取第四段，第四段就是在这个最大的这一段上。"],[747,"下面我们我们计算半个周波，它的步长取得比较大，是0.5ms，按f二进行计算，看计算结果。"],[763,"我们对这两个节点分别命名为n九二和n九九，方便区分曲线。"],[774,"这是它们上的电压，我们在plot二上绘制它们的电流曲线。"],[785,"总体看来计算结果还是比较接近的，下面我们把步长变小，再看看计算结果。"],[799,"取步长为0.05ms，按f二计算。"],[803,"这个地方按refresh，使用两种非线性元件计算的结果就完全一致了，使用九九型元件有一个地方要特别注意，即对这个jump值的估计，暂态过程它的第一个工作点在哪一段上，因为我们估计的是在第四段上，而且这个估计值是符合情况的，所以它的计算值是准确的。"],[838,"对于九二型元件来说不存在这个问题，它是通过牛顿迭代法。"],[844,"所以它的值总是正确的。"],[848,"如果九九型元件的这个jump值估计的不准确，比如说选一，我们可以看看它的计算结果。"],[859,"我们把这个补偿选大一点，还是0.5，按F二进行计算。"],[867,"Refresh，这样我们就明显能看出它们的区别了。"],[877,"所以在一般情况下，我们不建议大家使用九九型非线性电阻。"],[886,"我们在比较常规型九二型元件和避雷器用的九二型元件。"],[893,"前面我们已经介绍过，ATP中的避雷器用九二型元件，它是把非线性电阻的伏安特性进行了拟合，它拟合成了屏幕上所示的这种指数形式，P是一个常数，Q是指数，也是一个常数，但是Uref不是拟合结果，是人工选择的一个数据，Uref值得选择和仿真计算有很大的关系，如果选择不合理，仿真计算有可能不能顺利进行。"],[935,"一般情况下，Uref可以取一个饱和段的电压值，对于实际的避雷器来说，就取铭牌参数参考电压。"],[950,"我们先把这个元件隐藏了。"],[955,"我们还是在帮助中看这些参数的含义。"],[983,"Vref，这个我们刚才讲过了，Vflash，这个也是和串联间隙有关的，用pu值表示的击穿电压，如果没有间隙，这个地方选一个负值。"],[997,"Vzero，这是进行牛顿迭代的初始值，这个我们也是选缺省值为零，下面这两个参数。"],[1011,"这都是和多柱的避雷器有关的，一般情况下我们建议大家，即便是多柱的避雷器，你也把它作为一柱一个整体来考虑。"],[1023,"这个是它的柱数，这是每柱的阀片数。"],[1029,"我们把非线性电阻作为一个整体来考虑的时候，这两个值都取一。"],[1035,"这是拟合允许误差，这一个值，电流在这个值以下，这个电阻的伏安特性是线性的。"],[1044,"我们直接把这个元件就叫做避雷器吧，它的伏安特性我们从上面这个九二型电阻拷贝得来。"],[1056,"这个避雷器的 VREF，我们选择它的伏安特性段的一个饱和值，20。"],[1077,"给这个节点命名为 M，选择输出它的电压和电流，看计算结果，两个结果略有差异。"],[1092,"通常情况下，我们碰到的非线性电阻是避雷器和削谐电阻。"],[1099,"建议一般使用避雷器用九二型非线性电阻，也就是在 ATPDraw中前面有 MOV 的这个非线性电阻。"],[1112,"关于非线性电阻的选择，ATP 的用户手册中有一般原则。"],[1120,"种非线性电阻不能与线性电感并联，但是它可以与电容并联。"],[1132,"还有一个很重要的原则，非线性电阻要放在不同的子网络中。"],[1140,"通常的做法是用输电线路把它们隔开。"]]},{"p":38,"t":"8.2 非线性电感","d":567,"s":[[0,"大家好，在上期视频中介绍了非线性电阻，在本期视频中介绍非线性电感。"],[10,"在仿真计算中常见的非线性电感有变压器和电磁式电压互感器的励磁电抗。"],[20,"这个图上红颜色标注的是非线性电阻，绿颜色的是非线性电感。"],[31,"左端是在 ATPDraw的菜单中的罗列形式，右端是 ATP 用户手册中的列表。"],[41,"非线性电感有九八、九三和九六型，也有 TACS 控制的非线性电感。"],[52,"九八型非线性电感与九九型非线性电阻对应，叫做种非线性电感。"],[61,"同样，九三型非线性电感与九二型非线性电阻对应，叫真正非线性电感。"],[71,"还有一种九六型非线性电感，它也是一种种非线性电感。"],[79,"与九八型和九三型不同的是，九六型包含了磁滞回线。"],[86,"另外，在左下角绿颜色的框中有三个非线性电感选项菜单，其实它们不是独立元件，而仅仅是在刚才的三种非线性元件上增加了剩磁。"],[101,"种非线性电感的求解和种非线性电阻的求解是相同的，同样真正非线性电感的求解与真正非线性电阻的求解是相同的。"],[115,"换言之，利用真正非线性电感模型计算到的结果是准确值，但是在工程实际上种非线性电感的值是完全可以接受的。"],[129,"在本期视频中，我们讲九八型和九三型非线性电感，它们的数据输入形式完全相同。"],[139,"我们在 ATP Draw 中选择一个九八型非线性电感，放大。"],[152,"打开，在 Attributes 这个界面上有两个参数，第一个参数从名字上可以看出是电流，第二个是磁通。"],[168,"这两个值是用于稳态计算中，磁通除以电流就得到了电感。"],[176,"需要注意的是，非线性电阻没有对应的两个值，因为在稳态计算中，非线性电阻总是断开的。"],[186,"再看它的特性页。"],[188,"点 Add，在这个地方输入电流和磁通，如果是多于一对值，继续点 Add。"],[200,"从帮助上，我们可以得到几点信息。"],[207,"第一点，不要输入坐标原点。"],[212,"第二点，只输入正半轴的部分，也就是说不要输入负电流和负磁通。"],[222,"也许有人会问，我们通常得到的是非线性电感的电流电压曲线，如何转化为它的电流和磁通曲线？"],[236,"本来 ATP 有一个单独的转化程序，有经验的用户可以使用。"],[243,"对于没有经验的用户，因为这个程序已经被嵌入到了变压器元件中，可以利用变压器元件来转化。"],[255,"下面我们还是利用在非线性电阻视频中用到的例子，来示范非线性电感的使用。"],[267,"电压源基本上没有变化，我们把它的相角变为60。"],[278,"电阻没有变化，电阻还是二欧姆。"],[284,"非线性电阻还是原来的92型真正非线性电阻。"],[293,"新增了一个93型非线性电感。"],[300,"它有两个数值点，这是它的拟磁曲线。"],[310,"通常把第一个点输入到这个位置，在稳态计算中使用。"],[323,"这样在稳态计算中的电感值和暂态计算中第一段的电感值是相同的。"],[334,"输出是这样的。"],[336,"非线性电感的组的电压和电流，因为非线性电阻一端是接地的，所以相当于输出的是这个节点电压，还有非线性电感上的电流。"],[351,"另外，为了比较，下面的这个电路是上面的这个电路，但是不包含非线性电感。"],[363,"按 F 二进行计算，我们先看波形，共有两个电压和三个电流输出。"],[374,"这两个支路都有电流输出，它的电流都是从 R and L，这是它的节点名称，流到 D。"],[383,"在 plot X Y 的界面里面，也有两个从 R and L，R and L 到 D，这就嗯有时候会有点搞混淆。"],[395,"解决的办法有很多种，如增加小电阻或者测量开关。"],[403,"因为非线性元件中已经包含了开关，所以我一般不会再串联一个开关。"],[414,"通常情况下，最稳妥的办法是加一个小电阻，一般我们加0.1欧姆或者00:01欧姆。"],[423,"我在这个电感支路中加一个00:01欧姆的小电阻。"],[430,"给这个节点起个名称叫 M。"],[436,"输出这个电阻的电流，这个元件的电流不再输出。"],[447,"按 F 二运行，下面我们来看曲线，直接点 refresh。"],[459,"我们先看上面的电压曲线，在零时刻电压是不一样的，因为在包含非线性电感的这个回路中，整个回路是通的。"],[484,"但是在下面的仅仅包含非线性电阻的这个支路中，在稳态计算的时候，电阻它是断开的，所以在零时刻的时候，两个电压是不相同的。"],[501,"下面我们再来看电流曲线。"],[507,"在零时刻，这两个电流都是零。"],[511,"这是两个非线性电阻的电流。"],[515,"在稳态计算的时候，刚才说过它们是断开的，但是在稳态计算的过程中，非线性电感它是接入的。"],[527,"非线性电感的电感值就是这个变量 flux 除以这个电流得到的结果。"],[542,"对于非线性电感 ATP 的使用建议不同于非线性电阻。"],[549,"ATP 的建议是这样的，为了减少迭代，节省计算量，使用准非线性电感是可以接受的，包括九八型和九六型。"]]},{"p":39,"t":"8.3 单相双绕组变压器饱和模型(SAT)1_模型建立","d":705,"s":[[1,"大家好，从本期视频开始，将分几期介绍变压器模型的一种，饱和变压器模型。"],[12,"饱和变压器模型也叫 SAT 模型，这是比较简单的一种模型，也是用的最多的一种模型。"],[22,"饱和变压器模型分为单相和三相模型。"],[26,"我们首先介绍单相饱和变压器模型。"],[29,"这种模型用于单相变压器，如 PT、单相电力变压器、三相五柱式变压器。"],[41,"单相饱和变压器模型又分为双绕组变压器和多绕组变压器。"],[48,"前几期视频将介绍单相双绕组饱和变压器模型。"],[55,"这是它的等效电路，也是电机学中常见的一种等效电路。"],[62,"这边是原边，这边是副边。"],[67,"原边的漏抗和电阻，副边的漏抗和电阻。"],[76,"这是理想变压器，反映两个绕组之间的电压变比关系。"],[83,"这个是励磁电阻，图上感觉它是一个线性的，但是我们在应用的时候，也可以把它设成非线性的。"],[97,"这是励磁电感，在图上显示的是非线性电感，如果需要，也可以把它简单的用线性电感来表示。"],[111,"演示使用的算例来自 ATP-EMTP 及其在电力系统中的应用一书。"],[120,"因为算例内容比较多，建议对照书中的相关内容看本视频。"],[132,"第一个算例是第7.4节110千伏中性点接地系统空母线铁磁谐振中的一个电磁式电压互感器。"],[146,"在变电站现场，在 PT 的二次侧，通过实测得到了 PT 的伏安特性，也就是常规的励磁特性。"],[161,"像这个表中所示，上面是电压的有效值。"],[169,"下面是电流的有效值。"],[171,"在 ATP 中，饱和变压器模型的励磁电感它是放在原边的，所以我们把这个电压和电流折算到原边，PT 的变比是1100，折算后的数据如图中绿框中所示。"],[197,"在 ATP 帐中选择变压器，饱和变压器，单相。"],[209,"我们打开这个模型，先看 attributes 这个标签页，这是电压，是原边和副边的额定电压。"],[224,"这是原边，我们输入1103个零，副边是100。"],[238,"其实，在 ATP 中起作用的不是电压的具体值，而是它们的变比。"],[250,"所以你也可以在原边这个地方输入1100，在副边输入一。"],[258,"第二行是 PT 1~2次绕组的电阻，一次绕组的电阻比较大，应该在千欧这么个数量级，但是和励磁电感相比，它仍然非常小，所以我们简单取为一。"],[289,"PT 二次的电阻就更小了，因为我们在将来的示范中，PT 的二次侧是开路的，所以我们把它也简单取为一。"],[303,"第三行是 PT 的1~2次漏感，它都非常小，为了简单省事，我们把它都取为一。"],[316,"如果要进行精确模拟，可以取它们的实际值进行比较。"],[324,"由于励磁电感是非线性电感，这两个值决定它在稳态计算的时候它的电感。"],[337,"这是电流，这是磁通。"],[341,"它们两个相除就得到电感。"],[345,"如果这两个都取缺省值零，在稳态计算的时候，这个电感不存在。"],[354,"这是励磁电阻，这个值通常是一个很大的值，一般情况下，嗯它都不会影响我们的仿真结果。"],[368,"这个算例中它是80兆。"],[371,"这个选项 RMS 决定后面的特性是电压电流还是磁通电流。"],[386,"如果选 RMS，表示在后面我们将会输入电压和电流。"],[394,"如果是不选，在后面我们就会选输入的是磁通和电流。"],[404,"在大部分计算中，我们会选 RMS。"],[409,"在特性标签页下面，是这个非线性电感的特性曲线，这和我们前面讲过的非线性电感的输入基本相同。"],[422,"不同之处是在非线性电感元件中，不能选择是电压电流或者是磁通电流曲线。"],[434,"实际上在 ATP 的计算中，使用的是磁通电流曲线，即便我们输入的是电压电流曲线，ATPDraw 也把它转换成了磁通电流曲线。"],[451,"另外有一点要继续提醒，输入的特性曲线是折算在原边的，电安的，因为我们前面选的是 RMS，所以这个地方出现的是电流和电压。"],[465,"现在我们直接从 Excel 中把电流和电压的特性拷贝到 ATPDraw 中。"],[482,"按 Paste。"],[486,"这时候要注意，刚才我们选择的电流和电压又变成了电流和磁通，所以我们要返回到前面的 Attributes 页，在 EMS 前面点击打勾。"],[504,"我们再看看它的曲线，看来整体还是挺光滑的。"],[513,"下面我们要把这个电压电流曲线转换成磁通电流曲线。"],[523,"保存项目文件，我们不进行仿真，仅仅生成它的 ATP 文件。"],[534,"再看生成的文件中的内容，这一片就是这个 PT 的数据。"],[543,"可以看出，中间这一块，它不是我们输入的，而是已经转化成了磁通和电流的曲线。"],[558,"我们再回到 PT 的励磁曲线，在前面我们用了14对成对的电压和电流值。"],[570,"实际上在电磁暂态仿真中不需要这么多。"],[577,"第一，它增加了计算机的计算量。"],[581,"第二，点太多，计算的精度降低，出错的可能性增加。"],[590,"那么我们怎么选择一些特殊的点呢？"],[596,"第一个点，在额定电压的附近的这个点一定要选择。"],[604,"在额定电压之前，我们认为 PT 没有饱和，而在额定电压之后，PT 发生饱和。"],[614,"之后根据情况选择2~3个点就可以了。"],[622,"我们选择了这四对电压和电流值，我们再生成 ATP 文件，这是减少了电压和电流的对数之后，PT 的模型，对应的有四对电流和磁通值。"],[643,"我们把第一对电流和磁通值分别赋给 R 二零和 phi 二零。"],[650,"phi 二零除 R 二零就是稳态计算的时候的电感值。"],[658,"用 control C control V 就可以。"],[663,"比较前面生成的 ATP 文件和刚才生成的 ATP 文件，其他的都一样，在刚才生成的 ATP 文件里面有这两个值。"],[689,"这这是两个值，在这个地方是分开的。"],[696,"这样就建立了单相 P T 的饱和变压器模型。"]]},{"p":40,"t":"8.4 单相双绕组变压器饱和模型(SAT)2_模型验证","d":415,"s":[[1,"在上期视频中，我们介绍了单相饱和变压器模型。"],[9,"在本期视频中，我们对所建的模型进行验证。"],[16,"把这个PT放在这么一个交流电路中。"],[22,"电压源的幅值是140kv，为了避免涌流太大，我们选的初始相角是160°，开关的合闸时间是0.001s，也就是一毫秒。"],[42,"我们要计算磁通电流曲线。"],[47,"ATPDraw不能直接给出磁通，所以我们把PT上的电压进行积分，电压的积分就是磁通。"],[63,"我们用TACS积分元件对电压进行积分。"],[69,"TACS传递方程，这里面选择它的积分元件。"],[81,"把这个积分元件和这个PT的一次侧这个节点连接，我们还需要把这个节点电压转换为TACS信号，它才能进行积分。"],[101,"Sources选择电路变量。"],[110,"把它们两个相连，点击它，在TACS耦合到电路，在这个里面它有四个选项，我们选择节点电压，这样就把这个节点电压转换为了TACS信号，然后TACS的元件对这个节点电压进行积分，就得到了PT的磁通。"],[152,"这个积分元件里面 序试验结果和原始数据相差很小。"]]},{"p":44,"t":"8.8  中性点接地系统空母线上铁磁谐振的统计计算1_PT模型","d":481,"s":[[0,"大家好，从本期视频开始，我们介绍中性点接地系统空母线上铁磁谐振的统计仿真计算。"],[10,"本期视频内容是PT模型建立，使用ATP-EMTP及其在电力系统中的应用一书中第7.4节的算例来进行演示。"],[25,"关于原始参数的获得内容比较多，我们在视频中不详细说明。"],[34,"图上是发生铁磁谐振的变电站的主接线，通常情况下有两段母线。"],[44,"空母线上发生铁磁谐振的主接线基本上都是这样的。"],[49,"变电站通过两条输电线路供电，也就是说它有两个电源点。"],[55,"可能发生铁磁谐振的开关或者倒闸操作方式很多，我们仅仅介绍其中的部分操作。"],[67,"在这个图中，左边这个变压器，我们把它断开，就打开这个开关，这时候这个母线一母不带负荷，这是电磁式电压互感器。"],[85,"断开母联开关CB零，由于CB零有断口均压电容，所以这时候一母和二母它还是有电气联系的。"],[99,"然后我们再断开CB一，CB一也有断口电容，在这种情况下会发生铁磁谐振，其原因为PT一的励磁特性为非线性。"],[117,"打开断路器CB零和CB一之后，变电站的等效电路如屏幕上的右图所示。"],[129,"图中我们是简化了某一相的电路，但是保留了相间的耦合电容CCA、CAB和CBC，在本期的视频演示中，我们在仿真的时候没有包括这三个电容，这不影响发生铁磁谐振这一趋势。"],[155,"我们在现场在PT一的二次侧实测它的励磁特性，得到电压和电流的有效值。"],[169,"把之前测量值按变比折算到一次侧，因为在饱和变压器模型中，励磁电感是放在一次侧的。"],[180,"另外也实测了线路的对地电容 Cg。"],[186,"在 ATP校中选择元件变压器，饱和变压器单相。"],[194,"我们先看 attributes 这个页面的参数。"],[199,"电压，这是原边的额定电压和副边的额定电压，其实 ATP 只关注的是它之间的比值，也就是变比，具体数值倒是无所谓。"],[213,"所以我们不输相电压，直接输变比，因为它的变比是1100，所以原边的电压输成11100伏，右边的输成一伏。"],[227,"在我们的这个例子中，副边是开路的，所以这个变比也是不起任何作用的。"],[236,"这是原边的电阻，副边的电阻，原边的漏电感，副边的漏电感，我们都把它设为一，因为副边是开路的，副边的这些值它都是不会起任何作用的。"],[255,"对于原边来说，漏电感、绕组电阻与励磁电感相比可以忽略不计，所以可以取任意比较小的值。"],[270,"我们再输入 P T 的励磁特性，点 and，在这个地方最快的办法是事先在 Excel 或 Word 中把这个参数布置好，在这个地方直接按 paste 按钮。"],[292,"我们看看曲线的形状，现场实测的励磁特性曲线总体上还是比较光滑。"],[305,"关闭这个窗口，我们回到前面的页面，因为我们刚才输入的是电流和电压曲线，所以记得把这个 Rms 选择。"],[318,"Rm 是励磁电阻，80兆欧，8×10的七次方欧姆。"],[329,"这两个值 R 零和 F 零决定的是。"],[336,"稳态计算的时候的励磁电感暂时不改变缺省值。"],[342,"等把伏安特性转换为电流和磁通曲线之后，我们用额定电流等于I零，对应额定电流的额定磁通等于F零。"],[358,"有一点要注意。"],[361,"刚才我们输入伏安特性的时候，输入了14个值。"],[368,"这个值并不是越多越好。"],[373,"在实际计算中，一般我们取2~4个点。"],[380,"在电磁暂态仿真中，一般把额定点或者额定点附近的一个点作为第一个点。"],[391,"这是我们筛选后留下的四个点。"],[394,"第一个点的电压对应的是原边的额定电压，第一个电流是在额定电压下的励磁电流。"],[406,"在菜单选项 ATP 下面，选择 Subprocess，再选择 Make ATP File，我们生成 ATP 文件。"],[419,"在这种情况下，虽然电路不完整，ATP Draw 能把这个不完整的电路生成一个 ATP 文件。"],[434,"打开生成的 ATP 文件，这一部分对应的是我们刚才建立的这个 PT 的模型。"],[447,"而这一部分就是电压和电流励磁特性转换成的电流和磁通励磁特性。"],[462,"我们把第一个电流和第一个电压分别拷贝给 I 零和 F 零。"],[472,"这样用于铁磁谐振计算的 PT 的模型就完整了。"]]},{"p":45,"t":"8.9  中性点接地系统空母线上铁磁谐振的统计计算2_单次计算","d":641,"s":[[0,"大家好，在本期视频中，我们介绍中性点接地系统空母线上铁磁谐振的某一次仿真计算。"],[12,"根据铁磁谐振电路，在 ATPDraw中建立了仿真电路，如屏幕上的下面这个图。"],[22,"这个图和教科书中的仿真电路图看起来稍有不同，其实是相同的。"],[30,"因为 PT 二次是开路的，所以它起作用的仅仅是它的励磁特性。"],[37,"在教科书中的仿真电路中，仅仅保留了这一个励磁特性，也就是非线性电感。"],[49,"另外，在教科书中的仿真电路中，有一个对地的电阻，这个就是 PT 的励磁电阻。"],[61,"但是在下面的这个电路中，PT 的励磁电阻已经包含在 PT 模型中了，因为这个励磁电阻非常大，有或者没有这个电阻都不会影响计算结果。"],[77,"前面我们已经介绍了 PT 模型，现在我们对这个仿真电路中的其他元件进行简单的介绍。"],[88,"S 一 R 和 S 二 R 对应的这两个就是电源，它的线电压是110kv，初始相角都是零度，它们的开始时间都是负值，也就是说在稳态计算的时候它们已经存在的。"],[109,"两个电源紧接着接的都是断口电容，这个断口电容呢仅仅有900皮法，非常小，所以这不需要考虑这两个电源的内阻。"],[124,"这个开关在稳态的时候已经打开，所以只剩下断口电容。"],[130,"这个开关的断口在稳态的时候是闭合的，断口两端并有断口电容，这个是母线对地电容，584皮法，这个是 model 的元件，用来测量电压的谐波，我们仅仅选择了九次谐波。"],[152,"这个频率是工频频率，这个 scale 一般选择缺省值一就可以，选择九项输出，即选择所有我们监测的九个谐波都输出。"],[170,"注意 models 输出的这个相不同于三相的相。"],[175,"我们要打开这个断路器一次，看看铁磁谐振发生的情况。"],[183,"首先我们看看断路器的有关参数。"],[189,"三相断路器它的合闸时间都是负值，表示在稳态计算的时候，这个断路器是在合的状态。"],[203,"A相在0.02s断开，B相在0.022s断开，C相在0.021s断开。"],[215,"另外还有截流参数，这个值的通常缺省值是零，我们在这个地方取一个比较大的值，10安培。"],[226,"因为这个断路器在打开前，整个系统处于稳态，断路器打开要开断的电流是0.0104安培，非常小。"],[239,"断路器可以在任意相角的时候截断，所以我们就随便取了一个比较大的值，表示到那个开关断开的时间，不管开关中的电流是多少，开关就打开。"],[257,"delta t等于10的负四次方秒，t max等于四秒，我们进行一次暂态仿真。"],[266,"我们监视母线三相电压，还有A相电压的九次谐波，M开头的这个量是 models 的输出。"],[277,"现在我们先看母线的电压波形，很明显发生了铁磁谐振，我们进行局部放大。"],[294,"先把在铁磁谐振发生初期的波形放大。"],[303,"然后我们再看看铁磁谐振稳定以后的电压波形。"],[316,"很明显，A相和C相发生了铁磁谐振，B相电压正常。"],[329,"铁磁谐振的频率是工频。"],[332,"我们再来看A相电压的各次谐波，把它们放在。"],[340,"plotter中。"],[342,"在这片区域，这是谐振的暂态过程，到了这一片，铁磁谐振达到了稳定状态。"],[355,"我们把这一片可以去局部放大。"],[361,"显示各自分量的幅值。"],[368,"从上到下的数值依次是时间，一次、二次、三次一直到九次谐波的幅值。"],[381,"可以看出，它的单数次谐波的值比较高，基波也就是一次谐波的值最高。"],[393,"这是二次、三次、四次、五次、六次、七次、八次、九次谐波。"],[403,"上图就是我们刚刚进行的仿真电路，PT使用的是饱和变压器模型。"],[417,"下面这是教科书中的仿真电路，饱和变压器模型的非线性励磁电感被保留。"],[427,"我们现在看看这两个模型计算的结果有没有差异。"],[432,"上面这个图中的曲线是母线A相的电压，蓝颜色的是教科书中的模型，红颜色的是我们刚刚使用的模型。"],[448,"下面这张图是A相电压的基波分量，很明显，蓝颜色的这个数值要大于红颜色的数值。"],[459,"当铁磁谐振达到稳定时，蓝颜色的这个数值为4.71乘以10的五次方，这与教科书中的是一致的。"],[481,"而红颜色的这个数值是3.9167乘以10的五次方。"],[487,"这种差异并不是因为我们把非线性电感用了两种方式表达而引起的，而是两种模型中非线性电感的数据略有差异导致的。"],[503,"实际上，两种模型的非线性电感的电流磁通曲线略有差异。"
