现在看在这个地方新增了菜单选项 jtpplot，现在我们通过 jtpplot 给阿姆菲特拟合准备数据，jptplot 会读入我们刚才生成的 pl 四文件中的数据，这一行说明有101个点，最小频率最大频率分别是0.1hz和10的四次方赫兹，变量的顺序是幅值、相角、幅值、相角。"],[216,"这个软件的命令提示符是 plot，我们敲入命令 choice。"],[217,"现在显示的是刚才生成的 pl 四文件中变量的情况。"],[217,"四型变量是节点电压，八型变量是支路电压，这个我们没有选择，九型变量支路电流，这是我们想要拟合的数据，幅值的编号是三，相角的编号是四，下面我们输入三号、四号。"],[293,"在新出的 plot 后面我们输入 go。"],[304,"程序绘制了三号幅值曲线和四号相位曲线，现在我们输入 k zok，表示我们要提取频率相关的数据，输入编号三和编号四，再输入 go，现在我们想要的数据在这个文件中，它位于项目文件，也就是电路文件的目录中。"],[339,"但是如果再输入一次三号四号，接着再输入 go，它会生成文件的名称是 kzl 002点 aft。"],[349,"这个文件又不在刚才的路径下，经过寻找发现它在目前的 ATPDraw 所在的目录下面。"],[360,"为了方便，我们还是把这个文件以及 amfit 文件放在和 jtpplot 相同的目录下面。"],[370,"现在我们来看这个文件的内容。"],[375,"在第一列是大写的 C，表示是注释语句。"],[383,"这一行是关键词，意思是要进行频率相关的拟合。"],[389,"这里的 S 表示要进行的是拉普拉斯变换的形式。"],[393,"这一行是频率等于零和等于无穷大时的倒拉，它选择的都是负一。"],[402,"这是拟合的阶数，最小是一阶，最高是15阶。"],[407,"这一行是误差，频率相关的数据在后面。"],[416,"第一列是频率，第二列是幅值，第三列是相角。"],[421,"下面我们用 amfit 进行拟合。"],[425,"同样的，我们可以把 amfit 放在 ATP 菜单下面，但是我们在运行过程中发现这样会出错，所以我们还是在 dos 窗口中执行 amfit。"],[438,"我们先看有关 amfit 的帮助。"],[456,"amfit 缺省的输入文件是是这个 tmp 点 aft，如果在这个目录下没有这个缺省文件，我们要输入实际的文件名称。"],[471,"计算结束，生成两个新的文件，其中 tmp 点 pch 就是 kzlk 模型。"],[490,"有关 kzlk 频的相关模型，我们在前面的视频中已经讲过。"],[497,"现在我们来看这个文件的内容，第一行和第二行，第一个字母是 C，是注释行。"],[505,"第三行就是这个模型的关键字。"],[510,"后面的 s 表示是拉普拉斯变换的形式。"],[516,"下面其实是两列，左边一列是分子的系数，右边的一列是分母的系数。"],[528,"但是直觉觉得这个数据有问题，因为第一行和其他两行的数据没有对齐，ATP 对数据的对齐要求非常严格。"],[540,"可能的原因是在前面的 IFT 文件中，频率为零和频率为无穷大时候的导纳值为负值，所以我们把这两个值改为一个非常小的正值。"],[556,"进行重新计算，上面是新的计算结果，下面是前面的计算结果，新的计算结果是正确的。"],[568,"它对应的导纳函数是这样的，而实际的导纳函数是下面这个函数，两个非常接近。"],[576,"我们也尝试使用 MATLAB 进行拟合，但是发现阿尔法费特的拟合效果更好。"]]},{"p":76,"t":"15.3 频率扫描及应用3-电网的频率等值","d":509,"s":[[0,"大家好，在本期视频中介绍电网的频率等值。"],[7,"对电网的频率等值，可以采用图中的这种模型。"],[20,"Y零和Y一分别是电网的零序和正序导纳，它们都是频率的函数。"],[30,"Ea、Eb和Ec通常是等效的三相正序电源电势。"],[31,"在系统里面，通常零序电源电势和负序电源电势为零。"],[32,"在模型中使用理想变压器，左边是Y连接，右边是三角形连接。"],[33,"它的变比取一比根号三，这样左侧和右侧的线电压相等。"],[34,"从左端向电网侧望入，它的正序导纳是Y一，零序导纳是Y零。"],[35,"注意，在Y绕组的中性点需要接三倍的Y零的导纳。"],[76,"在这个模型中，不包括变压器，系统的元件只有四个，系统模型被大大简化。"],[85,"这是我们要讨论的网络。"],[88,"不简化是虚框内的这一部分，把虚框外的所有这一部分简化成刚才我们所说的那种模型。"],[99,"在不简化部分有一条输电线路，两端有避雷器，输电线路前面是断路器，断路器的前面是变压器。"],[112,"需要简化的是220千伏电网，有三处电源，三台变压器，六段线路，还有三个集中的等值负荷。"],[125,"三处电源都采用14型，它们都包含内阻。"],[130,"线路采用阶码器频率相关模型，不考虑这三处变压器的漏抗。"],[136,"集中负荷采用ATPDraw的PQV模型，ATPDraw在建立ATP的输入文件时，将它们转换为阻抗。"],[147,"下面我们介绍对需要等效部分进行频率等值。"],[154,"对这三处电源，我们可以取它的电势为零，它相当于接地，或者我们直接把它隐藏，但是把它的内阻进行接地。"],[164,"在需要等值的入口处，我们连接一个电压源。"],[168,"它的幅值是一伏。"],[172,"首先我们选择是正序电压源。"],[175,"输出从电压源流出的电流，那么这个电流的值就是我们想要的导纳。"],[187,"选择 frequency scan，计算输出这个电流的幅值和相角。"],[196,"扫描的最低频率10hz，最大频率3000hz，这个值我们可以稍微取高一点，在每个10倍频内，在50个点进行计算。"],[208,"我们既可以在 lis 文件中看扫频的结果，也可以绘制曲线。"],[213,"下面首先我们用 jtp plot，从刚才计算所生成的 pl 四文件中提取我们想要的频率参数。"],[223,"这个地方程序显然有一个 bug，它把二号相角没有显示出来，我们从前面的绘图中已经知道相角是输出的。"],[251,"这是 jtp plot 生成的频率参数文件。"],[254,"把刚才生成的 kzl 001点 aft 文件拷贝到 arm fit 点 exe 所在的目录下面。"],[266,"参照前面视频中的步骤，对导纳的频率相关参数进行拟合，这是拟合结果。"],[275,"注意因为软件版本更新的问题，所以这个数据和书上的数据稍有不同。"],[282,"把这个电压源更换为连续电压源，重复刚才的过程，就可以得到这个网络的等效的连续导纳参数。"],[293,"现在我们已经得到了正序和连续的导纳参数，在等值点的稳态开路电压就是 ea、eb 和 ec。"],[305,"现在我们建立了简化后的电网模型，这是电网的正序导纳。"],[310,"这是电网的连续导纳，注意它的增益是三。"],[321,"这四个元件都是 kz k 模型。"],[326,"kz k 模型是频率相关模型，有关这个模型的使用，在以前的视频中讲过。"],[336,"下面我们通过一次合闸计算，比较电网等效前后的暂态过程。"],[344,"我们用这台断路器进行空载线路合闸，这是断路器的合闸时间，最大仿真时长是0.06s，时间步长是2×10的负五次方秒。"],[357,"在简化前的电路中，我们进行相同的设置。"],[362,"下面我们看计算结果，上面这两张图是电网等效前后线路末端的电压，下面这两张图是电网等效前后末端避雷器上的电流。"],[380,"总体来说，计算结果基本一致，下面把它们进行叠加比较。"],[393,"注意两个文件中对应节点的名称完全一致。"],[396,"现在我们可以看出线路末端的电压基本一致，末端的避雷器只有在A相发生了动作，避雷器的电流两者相差比较大，这是因为他们对电压非常敏感，我们把这一部分进行放大，但是他们吸收的能量比较接近。"],[422,"另外在通常计算过电压过程中，还有一种简单的等效方式，即在工频下把电网进行等效。"],[433,"从前面的扫频过程中，提出50hz下的连续导纳和正序导纳，它们的倒数分别为连续阻抗和正序阻抗。"],[445,"现在工频下的等效电路是这样的，这是等效电源的内阻抗，我们用了连续参数和正序参数来表示，在同样的合闸时间以及同样的仿真步长下进行计算。"],[463,"现在我们来叠加计算的结果。"],[469,"在plot一中绘制所有的末端避雷器上的电压，在plot二中绘制所有的末端电流。"],[485,"通过设置x轴的范围，能显示曲线的一部分，可以看出如果对电网进行单纯的工频等效。"],[506,"计算所得的电压和电流值都偏大。"]]},{"p":77,"t":"16.1 IGBT构建（包含Compress使用）","d":991,"s":[[1,"大家好，在本期视频中，我们介绍如何利用 ATP 中的现有元件来构建 IGBT 元件。"],[13,"在 ATP 的早期开发过程中，IGBT 还没有广泛使用，所以在 ATP 中没有 IGBT 这个模型。"],[26,"大家在各种模型中看到的 IGBT 模型其实是通过其他的元件构建的。"],[36,"在这期视频中，我们将介绍的是其中的一种构建方法。"],[41,"我们首先分析一个现有的 IGBT 组件，有助于大家 ,"所以这个地方选择11。"],[549,"接下来我们来看第二个元件，这个电阻。"],[556,"它也是只有一个电阻值，首先我们来看 data，它也是有一个电阻值，10的负六次方欧姆。"],[568,"它也有两个端点，这个元件的电阻参数，我们也不希望它出现在最后的 IGBT 元件的参数中，所以这个地方不选择 and add data，它的两个节点是 IGBT 元件的内部节点，所以在这个地方我们也不选择。"],[595,"现在大家看到的这个地方有一个 from，这个 from 节点来自于这个节点。"],[604,"我们再来看这个二极管，它有四个参数。"],[613,"这个参数我们已经事先赋给它了，将来也不会出现在 IGBT 的参数窗口中。"],[625,"在 data 页面，这四个参数都显示，但是我们不点击 and data 这个按钮。"],[633,"这是它的两个端点，它的这两个端点也是将来的 IGBT 的内部端点，我们也不点 add node，同样这个 from 还是这个 from。"],[653,"下面我们来看最下面这个电阻，它也是一个电阻值，这个参数值同样不出现在右面。"],[662,"再来看它的节点，上面这个节点是将来的 IGBT 的内部节点，下面的这个节点是将来 IGBT 与外面连接的三个节点之一，我们要选择它。"],[679,"点击and node，它会出现在右边，它的缺省名称还是to，在这个地方如果需要也可以进行修改。"],[689,"我们要求这个节点出现在将来 IGBT 这个元件的五这个位置，所以在这个地方选择五。"],[703,"对于这个电阻的处理和这个电阻完全相同，中间的这个电阻和电容组成了阻尼回路，对它的处理与其他几个电阻不同。"],[722,"我们先来看 date，它有三个参数 R、L、C，但是我们还是希望它的 R、C 出现在 IGBT 参数窗口中，可以对它们进行修改，所以把 R 和 C 选择到右边的窗口中。"],[744,"同时我们把这个 R 给名为 RS，把这个 C 给名为 CS，它的两个节点同样是 IGBT 的内部节点，不把它们增加到右边的这个窗口中。"],[762,"现在我们来看这个组件的最后一个元件，TACS 控制的开关，它有两个参数，这两个参数都不需要出现在右端，也就是将来的 IGBT 的参数窗口中。"],[782,"我们再来看它的节点，它有三个节点 from、to 还有 TACS。"],[791,"From 和 to 是将来的 IGBT 的内部节点，TACS 它是 IGBT 的一个外部节点。"],[804,"我们把它添加到右边的这个组的节点之中。"],[814,"现在从这个窗口之后，我们能看到将来的 IGBT 有三个节点，一个是 from，一个是 to，一个是 TACS。"],[826,"对于 TACS 这个节点，我们希望出现在二这个位置上。"],[833,"对所有的参数和节点选择结束，我们在这个地方给它一个名字。"],[841,"点一下 OK。"],[850,"现在我们来看刚才建立的这个 IGBT 元件。"],[858,"左边是数据窗口，将来需要输入 RS 和 CS。"],[866,"右边是节点参数，有三个节点，这个和我们最初的设计是一致的。"],[875,"我们再来看它的细节。"],[878,"这三个 IGBT 的端点，每个都有一个红色的圆圈。"],[893,"再看最上面这个元件，右边的这个 from 节点就是这个 from 节点。"],[905,"再看最下面的这个，右边的这个 to 就是这个 to。"],[915,"再看这个元件，这个 TSAS 就是这个 TSAS。"],[923,"我们再来看它的参数，只有这个支路上的两个参数出现在 IGBT 的参数窗口中。"],[935,"但是现在又有一个新的问题，这个 IGBT 导通的时候，它的电流是从上往下流，在这个元件上这个方向很不直观。"],[950,"解决的办法是自己绘制。"],[954,"打开 edit definitions，打开 nodes，点击 icon edit，在这个地方进行手工绘制。"],[971,"手工绘制比较繁琐，这个是我绘制的结果。"],[979,"注意二极管的方向总体上和 IGBT 导通时电流的方向是相反的。"]]},{"p":78,"t":"16.2 基本Buck电路","d":316,"s":[[0,"大家好，在本期视频中，我们介绍基本 Buck 电路。"],[7,"主电路部分已经事先建立好。"],[10,"这个是直流电源，幅值是200伏，开始时间是零秒，截止时间是1000s，截止时间肯定是大于我们最长的仿真时间。"],[26,"这是一个电感，0.01毫亨，如果没有这个电感，仿真的结果会完全不一样。"],[35, 种基本的调制方式，左边是单极性调制，右边是双极性调制。"],[325,"我们看左边的单极性调制，粉红色的正弦信号是调制信号，也叫参考信号。"],[336,"蓝颜色的三角锯齿波叫做载波信号。"],[340,"在调制信号的正半波，当载波信号大于参考信号时，不发出触发信号；当调制信号大于载波信号时，发出触发信号。"],[357,"所以发出触发信号的区间是这个区间、这个区间、这个区间、这个区间，还有这个区间。"],[369,"在参考信号的负半周波，比较的是绝对值。"],[376,"当参考信号的绝对值大于载波信号的绝对值时，发出触发信号；如果是小于，则不发出触发信号。"],[388,"对于双极性调制，不论是在参考信号的正半周波还是负半周波，当参考信号大于载波信号的时候，发出触发信号；当参考信号小于载波信号的时候，不发出触发信号。"],[406,"两种调制方式在参考信号的正半波，它的结果完全相同；在参考信号的负半波，结果刚好相反。"],[417,"在 ATPDraw中有产生 SPWM 信号的元件，它产生的是双极性调制方式的信号。"],[429,"下面我们来看如何使用这个元件。"],[436,"在 TACS 菜单下面进行选择。"],[439,"这个元件它能提供三相上下桥臂共六个信号的触发信号，如果需要，用户可以选择其中的一个或者几个信号。"],[454,"这是这个元件的参数窗口，虽然元件的名称是 PWM，但其实它是 SPWM。"],[463,"第一个参数是参考信号的频率，在工程上我们一般选的它是工频50hz。"],[472,"第二个信号是 A 相参考信号的初始角，我们选择零度，注意它是用的是余弦信号。"],[481,"接下来是 B 相参考信号的初始角，然后是 C 相参考电压的初始角。"],[492,"这一项是参考信号的幅值与载波的幅值之比。"],[496,"最后这一个参数是载波的频率，还有另外三项 D、E、F。"],[505,"它们分别与 a、b、c 相反向，我们把这个值改为0.8。"],[511,"现在我们把触发信号与三相逆变电路的 IGBT 的栅极连接。"],[521,"在这个电路中，我们主要的目的是说明原理，所以我们仍然使用的是 TACS 控制的开关，不是真正的 IGBT 元件。"],[534,"我们先从这个元件引出一条线，因为这个元件它本身的输出是六相，所以当我们画这条线的时候，这条线它的缺省的相数就是六相。"],[551,"把第一条支路上桥臂开关的栅极与这条直线连接，刚好缺省值是 a 相，点击 OK。"],[564,"把第二条支路上桥臂开关的栅极与这条直直线连接。"],[570,"这时候我们把它的相改为 b，同样我们把第三条支路上桥臂开关的栅极连接到 c 相。"],[582,"然后把下端的这三个栅极分别连接 d、e 和 f 相。"],[590,"这样整个电路建立就结束了。"],[605,"下面选择输出这几个节点的节点电压、负载电阻上的电压以及相间电压，另外我们还选择 TACS 的输出信号。"],[621,"总共六项，左边我们选择六。"],[635,"按 F2 进行计算。"],[641,"最上面的这是第一支路上桥臂的触发信号，第二个图是 a 相负载上的电压，第三个图是 a 相对地电压，第四个图是 a、b 相之间的线电压。"],[661,"由于载波频率高，所以细节看不清楚，把载波从10 k 赫兹降到两 k 赫兹。"],[669,"这是计算结果。"],[672,"在某些场合，使用 models 更加方便，所以我们用 models 语言建立了 SPWM 元件，它输出的信号和 TACS 的 PWM 元件是相同的。"],[692,"它的输入信号和 TACS 的 PWM 也基本相同，我们增加了一个选项，即单极性的调制或者双极性的调制，选二表示是双极性调制。"],[708,"下面把 TACS 的 PWM 元件更换为 models。"],[712,"注意 models 的输出要使用 models 的测量元件。"],[721,"这是计算结果，对两种结果我们进行比较，TACS 的 A 相触发信号比 models 的 A 相触发信号要超前。"],[737,"在编程中 models 没有进行任何延迟，这是两种不同的算法导致的。"],[744,"这种情况不会造成计算结果的明显差异。"],[749,"最下面两条曲线是负载 A 相上的电压。"]]},{"p":81,"t":"17.1 同步电机1-基本模型","d":1053,"s":[[0,"大家好，本期视频介绍5859型同步发电机的基本模型。"],[6,"这两种模型从用户的角度上看没有区别，在 ATP 内部，五八型在相域进行求解，而五九型在模域进行求解。"],[18,"这是 ATP 用户手册中介绍模型原理使用 汽轮机的低压缸和高压缸转子。"],[302,"这是发电机的输出，在最左边选择发电机组的电气和机械参数。"],[314,"在中间选择质量块二的三个参数，也就是发电机转子的三个参数，最右边 TACS 只输出一个量。"],[329,"这是 TACS 的输出，它具体选择的是质量块二的角速度。"],[340,"这是发电机的二次电压输入端子，通过 TACS 或者 MODELS 元件输入。"],[351,"这是质量块转矩输入端子。"],[356,"看起来只是一个连接端子，其实它对应于四个质量块，编号从 A 到 D，对应前面的质量块1~4。"],[369,"质量块一和质量块二不能直接接受未施加的转矩，所以未施转矩只能施加在质量块三和四上，就是对应的端子 C 和 D。"],[382,"这两个端子，即发电机电压和高压气缸的转矩，也是通过 MODELS 或者 TACS 输入。"],[390,"在这个算例中全部通过 MODELS 元件输入。"],[394,"这一部分有两个 MODELS 元件，上面这个 MODELS 元件计算发电机端口的电压有效值，下面这个 MODELS 计算发电机输出的有功和无功。"],[409,"最左端这一部分也有三个 MODELS，上面的这两个 MODELS 输出发电机的二次电压，下面的这个 MODELS 给我们刚才所说的高压缸和低压缸输出转矩。"]]},{"p":84,"t":"17.4 同步电机4-同步发电机的控制(exa_22a)2","d":681,"s":[[0,"大家好，接着上期视频，我们继续介绍同步发电机的控制。"],[6,"首先介绍 model u g r m s，它的功能是计算发电机出口电压的有效值。"],[16,"一般说有效值的时候，指三相每一相都有一个有效值，但是在这个 model 元件中，通过 Clark 变换，只计算阿尔法贝塔坐标系中的一个有效值。"],[29,"我们来看它的详细内容。"],[33,"第一行表明这个 model 的名称是 u g r m s，后面的注释说明这个 models 的功能是计算三相线电压的有效值。"],[58,"需要用户输入的数据在 data 区，有两个变量需要输入数据，频率和电压的初始值，它们的缺省值分别是60和22.55。"],[74,"这两个初始值会显示在用户的输入界面中，在这个界面上，用户可以把缺省值改为实际值。"],[82,"接下来是 input，输入三相电压，然后是 output，输出电压的有效值。"],[89,"第六行是变量声明，在本算例中，除了 data 区域和 input 变量，其他的变量都要在这个地方进行声明。"],[100,"第七行是历史数据变量声明，在这个算例中只有一个历史变量，就是 u r m s，这个历史数据变量也是输出变量。"],[111,"接着是两个变量的初始值，在整个仿真过程中，它们的值不会改变。"],[118,"再往下是执行代码，前两行是对输入的三相电压进行 Clark 变换，得到两个电压分量，之后由这两个分量计算得到电压的有效值。"],[133,"最后一行通过 Laplace 变换的形式，对刚才计算的结果进行低通滤波。"],[140,"这个 Laplace 变换的函数书写成我们常用的形式是这样的，在 ATP 的 models 元件中，大量使用这种形式来表示传递函数，在本算例中也用了很多。"],[157,"上面我们详细介绍了 model u g r m s 的功能，它的输入是电压，它的输出只有一个量，这也是一个 model 元件。"],[170,"它的作用是计算发电机输出的有功和无功。"],[174,"它的输入是三相电压和三相电流，它的输出是有功和无功，但是在后续的计算中只用了它的有功数据。"],[186,"接着我们来讲这两个 models 的作用，它们两个联合起来调节发电机的励磁电压。"],[195,"第一个 model 给出励磁电压调节的指令，第二个 model 对这个指令进行执行。"],[203,"我们首先来看第一个 model，它总共有四个输入。"],[210,"第一个输入是发电机的极端电压，它是这个 model 计算的。"],[219,"第二个输入是发电机的 TACS 输出，这个输出是第二个质量块的速度，也就是发电机转子的转速。"],[229,"第三个输入是发电机的电压参考值，第四个输入是发电机的转速参考值，它们都取为一。"],[241,"这两个参考值是由 TACS 元提供的，所以在这个地方要选择 input TACS。"],[252,"这个是同样的，这个输入来自于 models，所以在这个地方要选择 input model。"],[262,"这个输入来自于发电机，所以在这个地方要选择 input machine。"],[269,"这是它的输出，选择 output 就可以。"],[275,"励磁命令执行模块的输入和输出就很简单，它的输入是 input model，它的输出是 output。"],[286,"下面我们来看第一个 model 的具体内容。"],[291,"第一行这个 model 的名称是 AVR PSS，它的含义是自动电压调节器加电力系统稳定器。"],[310,"接下来是在用户界面上的五个参数，然后是 input，就是我们前面介绍过的四个输入量，接着是一个输出，励磁电压控制命令，然后是变量声明，接着是历史变量的初始值，接下来是计算中使用到的一些变量的初始化。"],[335,"现在我们来看这个 models 的执行部分。"],[339,"它对应的框图是这样的，整个模型分为三条信号流，上方是发电机转速偏差的 PSS 支路，中间是主电压调节回路，也就是自动电压调节器 AVI，下方是反馈通道。"],[358,"下面我们按照信号流的顺序，逐步讲解每个环节的作用。"],[365,"首先看上面一条支路，发电机转子的转速除以基准转速，得到归一化值。"],[375,"这个归一化值与参考转速相减，得到速度偏差。"],[381,"这个偏差经过一个一阶超前环节和一个一相环节，输出 PSS 信号。"],[389,"在一相环节进行限幅。"],[393,"下面再来看主电压调节回路，发电机的极端电压除以基准电压，得到归一化电压。"],[402,"这个归一化电压与参考电压相减，得到电压偏差。"],[407,"因为给变量 Krag 负的值是100，所以实际减去的是1:01倍的参考电压。"],[415,"这两个偏差信号进入加法器，输出电压误差，然后经过超前滞后环节和主放大环节，输出励磁电压控制信号。"],[426,"在主放大环节进行了限幅。"],[429,"再来看最下方的支路，这是一条负反馈支路，将励磁电压控制信号反馈到加法器。"],[439,"以上是对 Model AVR PSS 的解释。"],[445,"这个 Model 的输出进入 Model Rot Exc，它的作用是仿真励磁机的动作特性，输出励磁电压。"],[457,"这个 Model 中有两行主要的命令，第一行用一个简化的 Flonish 公式来模拟励磁机的磁饱和现象，第二行是一个积分环节，最后的输出连接发电机的励磁电压控制端子。"],[475,"现在介绍发电机输入功率控制 Model，它控制发电机的输入功率，相应控制了发电机的输出功率，有四个输入。"],[487,"最上面这个输入是发电机转子的转速，最下面的发电机输出的有功功率，这是参考转速，这是参考功率，它有两个输出。"],[500,"上面这个端子输出给汽轮机的高压缸，可以认为它是 C 相。"],[507,"下面这个端子输出给汽轮机的低压缸，可以认为它是 D 相。"],[517,"再来看这个 model 的执行部分。"],[525,"上面是它的流程图。"],[533,"总体上有两支信号流，上面的是转速调节支路，下面的是有功功率调节支路。"],[542,"两个支路的信号经过整形和加权后合并为总的功率误差信号，驱动汽轮机的高低压缸，实现机组输出功率的自动控制。"],[554,"首先看上方这条支路，发电机实际转速除以额定角速度实现归一化，将归一化转速与参考值做差，得到转速偏差信号，再除以下垂系数，对转速偏差归一化，再把信号送入一个超前滞后环节，改善调速系统的动态响应。"],[580,"再来看下方这条支路，首先也是把发电机的输出功率归一化，然后与参考功率进行比较，得到功率偏差信号，同样经过一个超前滞后环节，再对它进行加权，与上方的转速偏差相加，形成功率误差信号。"],[603,"这个误差信号通过积分器得到阀门开度，经过汽轮机的高压缸一阶惯性环节，得到高压缸输出功率，再经过低压缸的一阶惯性环节，得到低压缸的机械功率。"],[620,"注意在这个地方，为了方便起见，我们设输出的功率，实际上输出的是转矩。"],[628,"发电机的模型分别取58型和59型同步发电机，这是仿真计算的结果。"],[635,"左上是发电机输出的有功，右上是发电机输出的无功。"],[641,"两个模型的仿真结果比较接近，但是有明显的差异。"],[649,"其他几个图形依次是质量块二，也就是发电机转子的机械角度的偏移量，发电机转子的转速，励磁电压和励磁电流。"],[662,"在两种模型下，差异最大的是发电机转子的机械角度的偏移量。"],[668,"使用58型模型故障后达到稳态时，这个偏移量为零度，而使用59型模型时。"],[676,"这个偏移量甚至大于5000°。"]]},{"p":85,"t":"17.5 同步电机5-串补引起的机械电气频率耦合","d":480,"s":[[1,"大家好，本期视频介绍串补引发的机械电气频率耦合。"],[7,"使用的算例是 R. Trigeopoulis 的第一个次同步振荡验证模型，具体数值略有不同。"],[15,"模型中的系统是这样的，这是同步发电机，这是升压变压器，这是500千伏线路，经过串补，这边是等效电网。"],[29,"这个模型中的同步发电机有六个质量块，分别是高压缸、中压缸、低压缸 A、低压缸 B 和发电机以及励磁机的转子。"],[45,"根据牛顿第二定律和胡克定律，写出每个质量块的运动方程，把它写成矩阵形式。"],[55,"其中 J 是转动惯量矩阵，D 是阻尼矩阵，K 是刚度系数矩阵。"],[63,"忽略掉阻尼，也就是令 D 等于零，取 t 等于零，这时候方程变为11所示的形式，这就是自由振荡形式。"],[76,"当输电线路不考虑阻尼时，它的方程也是这种形式，两者的分析方法也相同。"],[84,"求矩阵 J 的负一次方 K 的特征值兰姆达，对其开根号就得到各个模量的自由振荡频率。"],[95,"这是轴系的自由振荡频率，电路也有它的自由振荡频率，当两者之和等于系统的频率时，就发生了次同步振荡。"],[105,"首先我们理论计算轴系的固有振荡频率，共有五个分量，从15.71hz到47.46hz。"],[116,"发生次同步振荡时，对应的电网振荡频率为从44.29hz到12.54hz，这一栏是对应的串补电容，最后一栏是补偿度。"],[129,"我们再增加一种情况，取串补电容为47微法，对应的电网振荡频率为30.63hz。"],[139,"在 ATPDraw 中建立电路文件，发电机的参数与 R. Trigeopoulis 的算例中的数据完全相同。"],[149,"在 R. Trigeopoulis 的数据中没有规定发电机的额定电压，我们取它的额定电压为24kv。"],[157,"在这个仿真中，我们不考虑发电机轴系的阻尼情况，升压变压器的变比是24kv比500kv，注意在这个地方使用的是线圈的额定电压。"],[170,"起作用的是它的比值，不是具体数值。"],[173,"这是用集中参数表示的输电线路，在这个算例中，连续参数不起作用。"],[179,"正序电阻是五欧姆。"],[182,"正序电抗是140欧姆。"],[185,"注意，在这里线路的长度是一米，这样在上面显示的是线路的总的电阻和电抗。"],[194,"最右面是等效电网，这是电网的等效内电抗，这是电网的等效电压源电压。"],[200,"用这个开关设置三相短路接地故障。"],[203,"在0.1s时发生三相短路，在0.11s时，这个断路器合闸，短接串补电容。"],[216,"在0.16s时，线路两端的断路器跳闸。"],[221,"在0.2s，线路故障消失。"],[224,"0.56s投入串补电容，0.66s线路两边的开关重合。"],[234,"选择的输出量主要有发电机组轴系六个质量块的转矩，以及发电机的A相电流。"],[244,"首先，我们选择串补电容为47微法，进行仿真计算，仿真时长取30s。"],[256,"我们下面来看仿真结果。"],[259,"上面这个曲线是发电机A相电流，下面这个曲线是发电机轴上的转矩。"],[267,"在仿真计算中，我们没有考虑轴系的阻尼，所以轴系的低频机械振荡被激发。"],[275,"尽管我们选择的电容不是匹配次同步振荡的电容，我们用Convert这个程序，把计算的PL4文件转化为Matlab的MAT文件，在Matlab中进行频率分析。"],[290,"在左边的输入窗口中选择PL4，在右边的输出窗口中选择MAT。"],[298,"这是我们刚才仿真计算形成的PL4文件。"],[302,"转换结束。"],[306,"为了方便，我们在Matlab中编写了一个小程序进行频率分析。"],[312,"在这个界面上可以显示两个时域信号的全局频谱和滑窗频谱。"],[320,"滑窗时间长度取五秒。"],[323,"上面的这个信号是发电机转子A相电流，这是从0.67s到30s的时间波形。"],[331,"第二条曲线是A相电流的全局频谱，第三条曲线是A相电流的五秒滑窗频谱。"],[339,"下面三条曲线分别是发电机转子轴上的转矩时域波形、全局频谱和滑窗频谱。"],[348,"先来看发电机转子转矩的频谱，从全局频谱中可以明显看到四个自由振荡频率分量。"],[358,"这四个数值与理论计算结果一致，在前五秒的滑窗频谱中也明显显示这四个频率。"],[369,"移动滑窗，这四个频率分量一直存在。"],[377,"再来看发电机转子A相电流，在全局频谱中，除了工频60hz外，其他频率分量都不明显。"],[387,"但是在滑窗频谱中，刚开始有明显的29.6hz的频率分量。"],[393,"这个频率分量就是电网的自由振荡频率，理论计算数值是30.63hz。"],[401,"当滑窗向右移动，也就是随着时间增大，这个频率分量很快消失，但是出现其他的频率分量。"],[412,"这些频率数值与轴系自由振荡频率交叉相加，结果刚好是60hz，这是因为轴系振荡频率通过发电机的转子耦合到电网中。"],[424,"接下来我们选择串补电容为37.16微法，对应的电网振荡频率为34.45hz，这个频率刚好与轴系的自由振荡频率25.55hz形成次同步振荡。"],[443,"因为没有考虑轴系阻尼，两种串补电容下的波形差异并不大。"],[449,"再来看频谱，在故障恢复以后刚开始，发电机转子电流中有一个频率分量为33.56hz，与理论计算值34.45hz接近。"],[464,"随着时间增大，这个频率分量逐步消失。"],[470,"其他情况与串补电容为47微法时的情况相似。"]]},{"p":86,"t":"18.1 潮流计算1-基本潮流计算","d":557,"s":[[1,"大家好，本期视频简单介绍 ATP 的潮流计算功能。"],[7,"ATP 安装之后，有一个 benchmark 子目录。"],[14,"在这个目录下面罗列的是 ATP 早期的一些算例。"],[19,"我们用算例文件 dcr 六点 dat 中的第三个算例，来介绍 ATP 潮流计算的基本功能。"],[28,"在我们的演示中，除了节点名称略有不同，其他参数完全相同。"],[35,"我们已经建立了常规电路部分。"],[39,"这个电路中有两个电压源，我们再增加与潮流相关的模块。"],[47,"注意在 ATP 中，注入节点的有功取为正值，注入节点的感性无功也取为正值，与这个规则不相同的则取为负值。"],[60,"我们首先来看本路节点的情况，本路节点是个 PQ 节点。"],[66,"流出节点的有功是0.4，流出节点的无功是0.1。"],[73,"我们选择的元件是 steady state 里面的 load flow pq，打开它的数据窗口，首先填写有功数据，-0.4 e 的负六次方，因为要求的单位是兆瓦，我们的原始数据的单位是瓦。"],[96,"在无功这一栏填入-0.1 e 的负六次方，这两个负值表示实际的功率是流出节点的。"],[105,"象数在我们这个算例中这是单向。"],[111,"再看 end scr 参数，这个参数如果是选一，在潮流计算之后给这一个节点并列一个电压源，这个电压源的电压值就是这个节点的电压值。"],[129,"如果这个节点是一个电源节点，可以选一。"],[132,"在我们这个算例中取零，接下来的两个值是这个节点的电压约束，首先是最小值，我们取0.85。"],[144,"最大值取1.15。"],[151,"接下来两个参数是相角约束，对于我们这个算例中的 PQ 节点没有相角约束，保留缺省参数零，注意这个地方零并不是零度的意思。"],[167,"现在把 blue 节点和这个 p q 节点相连接。"],[173,"在弹出的这个窗口中，第一个是相数，当然我们这个地方只有一相了，它自动选择的是 a 相，这个是正确的，我们选 ok。"],[190,"有一点需要提醒大家，虽然在这个地方屏幕上显示的是 a 相，但是在生成 ATP 文件的时候，可能会把同一节点两处给的名称不一样，其中的一个节点叫 blue a，另外一个节点叫 blue。"],[211,"在这种情况下，要么手动修改数据文件，要不再调整这个地方节点的连接。"],[219,"本人尝试的一种成功的方法是把这个连线稍微倾斜，red 和 yellow 同样是 p q 节点，按照上面类似的方法连接 p q 元件。"],[233,"为了直观，我们把它的负荷在 label 这个地方标注。"],[242,"下面我们来看 green，green 节点是 p v 节点，与前面三个节点不同。"],[251,"选择 node flow vp，输入相关值，这个 v 是1.02伏，p 是一。"],[272,"在这个节点上已经并联了一个14型电压源，所以我们在 and scr 中选零，如果这个地方没有已经并联这个电压源，我们在这个地方选一也是同样的效果。"],[293,"p v 节点的角度约束，最低是-20°，最高是20°，这个根据实际情况来选择，如果选择过大或者过小，潮流可能计算不会收敛。"],[313,"现在我们已经建立了基本的仿真电路，我们来设置潮流相关的有关参数。"],[322,"第一项潮流的 flow，这是一种算法，一般不建议选，可能不稳定。"],[335,"接下来的这两个参数和打印输出的量有关系。"],[339,"如果不知道它能输出什么量，把它都选上。"],[344,"接着这个参数是迭代的次数，缺省值也是500。"],[351,"接下来的这个参数表示在屏幕上显示20列迭代数据，这也是缺省数据。"],[364,"第三个数据 RALCHK，这个是和迭代收敛相关的一个参数，叫做收敛因子，它乘以有功和无功数据中的最大数，就是实际的收敛误差。"],[381,"接下来有三个都是零的参数，它们都是加速因子，如果不确信，保持缺省值零。"],[390,"我们再来看这个1.414，VSCALE，表示在这个算例中所有的电压都是有效值。"],[402,"我们刚才给这个 VP 节点输的这个电压1.02伏是有效值，这个电压源的值1:04也是有效值，这个电压源的电压也是有效值。"],[416,"但是我们在计算中发现，把 PQ 节点转换为电阻和电抗时，这个1.414可能导致错误。"],[425,"如果不出1.414，例如输入1.4，那么程序会把输入数据文件中的所有电压乘以1.4当做这个电压的幅值。"],[438,"所以如果不选择1.414，建议选择一，把输入数据文件中的所有的电压用幅值来表示。"],[449,"现在我们设置的这些参数与原始文件中的数据完全相同。"],[457,"我们做一次稳态计算。"],[460,"下面来看计算结果。"],[467,"直接越过类似文件中前面的部分。"],[470,"这是潮流计算的迭代过程，表示经过164次迭代达到了误差要求。"],[482,"这是潮流计算的结果，有四个潮流节点，节点的电压、角度、有功和无功。"],[490,"另外我们还输出了这个节点的电压。"],[493,"这两个都是同一个 reference 节点，上面这个电压是用有效值表示的。"],[502,"下面常规的 ATP 的输出用幅值表示。"],[507,"另外我们还注意到节点给瑞电压和角度的变化。"],[515,"这是输入值，分别是1:04和两度。"],[522,"潮流计算的结果是1:02和2.43。"],[527,"也就是说，经过潮流计算，把这个节点的电压和角度进行了调整。"],[533,"在这个算例中，如果取 tmax 大于零，不要认为程序进行潮流计算之后会自动开始暂态计算，因为程序不知道如何处理 PQ 节点。"],[548,"如果希望把 PQ 节点转换为电阻加电抗的形式，请看下集视频。"]]},{"p":87,"t":"18.2 潮流计算2-潮流节点等效电路","d":390,"s":[[0,"大家好，在上期视频的基础上，我们继续介绍潮流节点的等效电路。"],[8,"通过 ATPDraw 的 additional 这个元件，在电路中增加一些命令。"],[21,"这个地方首先输入 erase，它的作用是清除缓冲区。"],[28,"在这个里面我们选择 request 表示 erase 属于特殊请求卡。"],[36,"我们还要增加一个关于输出的请求，方法也是类似的。"],[47,"在这个地方输入 punch。"],[53,"选择 output。"],[57,"我们再把这个电源的最大时间改为缺省值，ATPDraw 会把这两条增加的命令放入到输入数据文件中合适的地方去。"],[71,"现在进行稳态计算，计算结果中会多出一个 punch 文件。"],[77,"这是 punch 文件的内容，它把所有的潮流节点都转换为电阻加电抗支路的形式。"],[88,"有一点首先要提醒，前面说过的1.414在这个地方产生的问题，导致所有的电阻和电抗的值是真实值的一半，大家以后在计算中要想办法处理。"],[102,"我们先来看 PQ 节点 red，它的电阻是0.59，电抗是0.29，实际值都应该乘以二。"],[113,"对其他的两个 PQ 节点 blue 和 yellow 也进行了类似的转换。"],[119,"PV 节点 green 它也转换成了电阻加电抗的形式，但是从数值上看，它的电阻是负电阻，电抗是电容。"],[132,"因为这个节点其实是一个电源节点，我们不希望它转换成这种形式。"],[140,"有一个办法可以解决这个问题，这是电源节点，在这个电源和这个负荷之间肯定存在电源的内电抗。"],[152,"把这个内电抗可以写在这个地方。"],[159,"T stop。"],[161,"现在我们再来看生成的 punch 文件，红色框中是原来的 punch 文件。"],[169,"绿色框中是新的 PUNCH 文件，原来 P Q 节点的潮流等效的阻抗都没有发生变化，但是 P V 节点发生了变化，在前面它同样被等效为阻抗，不过相应的值是负值。"],[186,"修改之后，P V 节点等效为一个戴维南模型，也就是电压源串联一个阻抗，阻抗值就是我们刚才在 T STOP 位置输入的数值。"],[200,"大家可以通过下面的办法来验证电压源的电压。"],[205,"首先通过节点电压，节点向电网注入的有功和无功，来计算这个节点流入电网中的电流，也就是流过这个电抗的电流。"],[218,"然后用这个电流乘以电抗，得到电抗上的电压。"],[223,"最后电抗上的电压与节点电压相加，就得到电压源的电压。"],[230,"注意我们刚才计算所得的电压是有效值，而在 PUNCH 文件中的电压值是幅值。"],[237,"通过这种办法，我们得到了节点 GREN 的等效电路，输出到了 PUNCH 文件中。"],[247,"对于另外一个电压节点 WHITE，它是潮流计算的参考节点，处理的办法有点类似，但并不完全相同。"],[256,"首先也是在 T STOP 这个地方输入这个节点后面的等效电抗，在我们这个算例中是0.4欧姆。"],[268,"接下来我们要使用 ADDITIONAL 这个元件，在这个地方输入这个内容，最前面是空两格，WHITE 是节点，在这个节点名称后面是花括号，在花括号后面紧跟一句固定的话语 SLACK BUS FOR PUNCH OUTPUT，意思是把参考节点等效为戴维南电源模型，输出相关的电源参数。"],[293,"然后在下面的选项中选择 ALLOWED FLOW，按 F 二进行计算。"],[298,"我们首先来看 ATP 输入数据文件的改变，改变的地方用红色下划线指示。"],[305,"但是 ATP J 的这个版本把这一行数据的位置放错了，它应该放在所有的潮流约束数据的后面，通过手动来修改。"],[317,"另外我们也可以把 PUNCH 命令移动到所有的潮流数据后面，这样在顺序上更加符合逻辑。"],[332,"ATP文件，现在不能通过 run ATP 或者 ifr 来计算，否则我们的修改会被覆盖掉。"],[346,"这时候有两种做法，一种是选择 run ATP file，另外一种是执行你自己建立的这个执行文件。"],[355,"我们选择 run ATP file。"],[358,"我们再来看 punch 文件中等效的戴维南模型，这是等效的电压源，电压源的电压和角度的计算与前面我们所说的 grid 节点的计算完全相同。"],[372,"这是我们刚才输入的电抗。"],[376,"有一点要说明，在本期视频中介绍的这些输出方法丝毫不改变潮流的计算，这些输出仅仅是为后面的电磁暂态计算做准备。"]]},{"p":88,"t":"18.3 潮流计算3-潮流计算后的暂态计算","d":460,"s":[[1,"大家好，本期视频介绍潮流计算后的暂态计算。"],[7,"在前面的几期视频中，我们介绍了基本的潮流计算和潮流节点的等效电路。"],[16,"在 ATP 中，潮流计算的主要目的是为以后的电磁暂态计算对电网进行初始化。"],[25,"这是在前面的视频中我们介绍潮流节点等效电路时使用的网络。"],[34,"在这个算例中，tmax 取为负一，如果 tmax 取为大于零的一个数据，那么在潮流计算之后，ATP 会不会自动进行暂态计算？"],[48,"答案是否定的。"],[50,"在潮流计算之后，ATP 根据潮流计算结果会对 green 这个电压源的幅值和相角进行修正，对这个电压源不做任何变化，这个负荷就不再存在。"],[67,"如何处理其他三个没有并列14型电源或者5859型发电机的潮流节点由用户决定。"],[77,"通常情况下，把没有并联14型电压源或者5859型发电机的 p 口节点等效为电阻加电抗的形式。"],[88,"我们还是以这个算例为例来说明如何进行后面的电磁暂态计算。"],[94,"就这个算例，有两种办法来准备输入数据文件。"],[101,"第一种办法在 ATPDraw 的界面中进行建立。"],[106,"首先把潮流相关的这些特殊请求等等删除，把没有连接电源点的 p 口节点等效为前面计算的电阻加电抗的形式，删除和电压源节点并列的潮流节点，根据潮流计算结果修改这个电压源电压幅值和相角。"],[132,"然后进行电磁暂态计算。"],[136,"对于小型网络可以使用这种方法来建立输入数据文件，但是对于比较大的电网，通过这种方式来修改建立数据文件比较烦，所以我们直接处理 ATP 文件，这就是第二种方法。"],[154,"左边图中显示的是 ATP 文件的内容，右边下面的图中显示的是 PUNCH 文件的内容。"],[163,"把原来的 ATPDraw 自动生成的输入数据文件中。"],[169,"与潮流相关的命令和数据都删掉。"],[172,"这两个电源都在 PUNCH 文件中，把它们删掉。"],[180,"把潮流计算的分类卡、相关的支路以及输出请求全部删掉。"],[188,"有两种办法把 PUNCH 文件中的内容引入到这个输入数据文件中。"],[194,"第一种就是直接拷贝，因为 PUNCH 文件中有分类卡，如这个反斜杠 PUNCH 反斜杠 SOURCE，所以可以把 PUNCH 文件中的内容拷贝到可以放置支路数据的任意地方，我们把它放在最后的5~6个 BLANK 行之前。"],[216,"这是新拷贝的 PUNCH 文件中的数据。"],[224,"还有另外一种方法，使用 INCLUDE，在后面跟 PUNCH 文件的路径和 PUNCH 文件名。"],[239,"下面进行计算，因为我们没有建立电路文件，不能按 F 二或者通过这个地方来进行计算，而是利用我们自己建立的这个执行命令进行计算。"],[256,"当然 PL 四文件也没有与这个快捷绘图图标相关联，我们也用类似的办法来绘制图形。"],[268,"在这个算例中，我们仅仅输出了一个节点的电压，因为在暂态过程中没有任何电路的改变，其实这个暂态过程是稳态过程的延续。"],[293,"大家可以验证第一个点是不是和潮流计算的结果一致。"],[299,"当然在这个电路中可以设置故障，有多种方式，第一种是在 ATP 文件直接加入相关的故障数据，但是这种严格的数据格式会让有的人望而却步。"],[315,"另外一种变通的办法就是在这个电路文件中加入故障电路，不进行计算，仅仅生成 ATP 文件，把相关的故障支路拷贝到刚才的输入数据文件之中，通过这个开关实现接地。"],[334,"开关闭合时间是0.005s，也就是五毫秒，开关打开时间是45ms。"],[346,"我们直接 make ATP file。"],[354,"打开刚才生成的这个数据文件，拷贝这个接地开关相关的数据，把它粘贴到我们之前建立的数据文件中。"],[366,"由于有分类标志，可以把这三行数据粘贴到支路数据的任意地方。"],[374,"其实这个注释行也可以不粘贴，我们把仿真时长也改到0.1s。"],[383,"按前面类似的方法进行计算，现在我们来看计算结果，在计算过程中出现了数值震荡。"],[393,"数值震荡的特征是围绕中心线，数据一高一低，一高一低。"],[407,"对于这种情况，在数据文件中加入特殊请求命令 average output 就可以解决。"],[416,"下面的曲线是增加 average output 之后的计算结果。"],[427,"如果在 ATPDraw 的这个界面中来运行，需要使用二次扫描这个软件，在其中加入 average output 这个特殊请求命令。"],[438,"在下面的这个菜单中选择 request，点击 OK，在 ATPDraw 生成输入数据文件的时候，它会把这个命令加入到合适的地方去。"]]},{"p":89,"t":"18.4 潮流计算4-有同步发电机的潮流计算","d":442,"s":[[1,"大家好，本期视频介绍包含同步发电机系统的潮流计算。"],[7,"使用 ATP 安装文件 dcr 五点 data 中的第一个算例来演示。"],[14,"根据原始数据反推，建立了 ATPDraw 的电路文件。"],[20,"最右端这两个元件是电网的戴维南等效模型，这个是14型电压源，这是内阻，这是输电线路，用三个 pi 模型来等效。"],[33,"每个 pi 模型的参数是这样的，线路没有换位，线路两端有补偿线路无功的并联电抗器以及中性点小电抗，在线路的1/3处设置了单相接地故障，这是发电机端的变压器，它用三个单相变压器来组成三相变压器。"],[60,"这个电容可以理解为发电机的对地电容，没有这个对地电容计算会出错。"],[66,"最左边是两台参数完全相同的发电机并联，这是它的参数，单台视在功率为722兆伏安，滚动这个窗口看其他参数。"],[79,"如果系统不进行潮流计算，在初始化的时候给发电机极端的 a 相负的初始电压的峰值就是这个值，22kv，这是电压 a 相的初始角度。"],[96,"但是在我们这个算例中要进行潮流计算，这是 p扣元件，发电机端电压的幅值和相角取决于潮流计算的结果，发电机的时间常数来自于开路实验，在这个地方选 open，发电机不是 delta 连接，也不采用五八型模型，我们采用五九型模型。"],[120,"这几个参数与发电机并列运行有关，第一个表示有发电机并列运行，下面的这两个参数是每个发电机承担的有功值和无功值的比例系数，注意这个地方不是百分数，是比例系数，这台发电机的这两个参数都取一，另外一台发电机的这两个参数也都取一，表明每台发电机承担的有功和无功都是50%。"],[155,"再来看 saturation，这个值是当发电机空载时，空载电压为额定电压时的励磁电流，没有选择饱和。"],[168,"看质量块，发电机只有一个质量块，这是质量块的总个数，它的转子肯定就在第一个质量块上。"],[175,"励磁机的转子在零质量块上，表示不考虑这个转子。"],[181,"再来看发电机的输出，选择输出所有的左边的这些电气量和机械量。"],[188,"对于唯一的质量块，选择输出它的机械角度、机械速度的偏移量以及机械转矩，不通过 TACS 输出任何量。"],[201,"第二台发电机的参数与第一台其实完全相同，我们仅仅有意选择部分输出不一样。"],[212,"这个发电机节点是 PQ 节点，在原始文件中，PQ 节点的有功大于两个发电机的视在功率之和，我们把它进行了调整，把这个节点的有功调整为1400兆瓦，无功调整为470兆伏安。"],[235,"另外我们也把原始的相角约束调整为40~60°，原始数据是50和80。"],[242,"我们再来看潮流计算相关的参数设置。"],[247,"这两项一般都选上，迭代次数选500，屏幕每行显示20列迭代结果，迭代误差系数选0.001。"],[261,"注意在这个里面 VSCAL 选为一。"],[266,"首先我们取 Tmax 等于零，进行一次稳态计算，也就是进行一次潮流计算。"],[274,"下面我们看潮流计算的结果，这是潮流节点的电压值，也就是发电机出口的电压值。"],[282,"这是电压 A 相的相角，B 相和 C 相的相角。"],[287,"大家还记得我们把原始的相角约束从5810°修改为4610°，如果我们还是采用原始的相角约束，潮流计算就不能收敛。"],[299,"下面我们来看把相角约束修改为原始参数时，不收敛的情况。"],[306,"按 F 二进行计算，我们来看历史文件中潮流相关的数据。"],[316,"潮流计算迭代了500步，达到了我们设置的最大迭代次数。"],[323,"迭代结束后，A 相电压的相角是50°，刚好是相角约束的下限值。"],[330,"从前一次的计算结果我们知道，这个数据是48.4°。"],[336,"下面我们把 t max 取为两秒，进行一次暂态计算。"],[343,"注意，在这个电路中，之所以在潮流计算后能够进行暂态计算，是因为这个 p q 节点连接的是59型发电机，也就是说这个 p q 值是这个发电机输出的有功和无功。"],[361,"在前面的视频中我们说过，只有潮流节点连接14型电压源或者5859型同步发电机，潮流计算之后能够立刻转入电磁暂态计算。"],[376,"下面我们来看计算的波形。"],[378,"在 plotxy 中打开刚才计算所得到的 pl 四文件。"],[386,"上面的六个电压是这两个节点的三相电压，接下来是两台发电机的输出。"],[398,"s 一对应的是发电机一的输出，s 二 是发电机二的输出。"],[405,"先来看故障点的三相电压。"],[407,"在这个时刻，单相接地。"],[417,"在这个时刻，单相接地消失。"],[421,"再来看这两幅图，上面这幅图是两台发电机的励磁电流和励磁电压的曲线，励磁电流相同，励磁电压也相同，因为这是两台完全相同的发电机。"],[434,"下面这幅图是发电机一机械角度和机械速度的偏差，能看到其中明显的暂态过程。"]]},{"p":90,"t":"A.2 维数扩大","d":751,"s":[[0,"大家好，本节视频和大家分享扩维的相关方法。"],[6,"扩维是对计算核心 tpbig 这个可执行文件的重新编译。"],[13,"一般经过重新编译生成的计算核心名为 mytpbig 点 exe。"],[21,"在常见错误及处理一节中，该仿真报错 kill 等于一，我们再次运行该仿真来查看错误代码。"],[36,"在 lis 文件末尾提示 kill 等于一，存储量超过了 emtp 列表的第八个维数，问题是现在需要的维数对于程序来说太大了。"],[51,"但是别忘了这是一个动态的尺寸设计，本例中编辑 listsize 点 date 可以来增加相应的列表维数，然后再试一次。"],[69,"当然这个维数的拓展需要在 listsize 点 ppa 的限制下才可以，换句话来说就是不能无限制的拓展。"],[82,"我们再来看下面几行。"],[85,"list 八储存的是以模量形式表示的分布参数传输电路、线路或者是电缆的历史电流源。"],[98,"每一个传输模量都需要内存，对于多导体系统来说有多个模量，比如双回路线路一般就有六个模量，每一个模量都需要输入 tau 比德尔塔 t。"],[113,"tau 是模量传输的时间，德尔塔 t 是仿真步长。"],[120,"总结来说就是使用分布参数元件过多导致的内存溢出，我们需要对 list 八进行扩维。"],[130,"我们主要针对以下几个版本来逐一讲解扩维的方法，总体来说大致相同。"],[139,"我们主要以免安装版的2003内核的 ATP 为例进行讲解，对应日本委员会 ins ATP 114安装版版本。"],[154,"经测试安装版进行扩维反而有时会出现错误，所以推荐大家使用该免安装版版本，我们也主要讲解这种方法。"],[167,"需要说明一点，进行扩维时，软件需要尽量安装在 C 盘，因为重新编译时，有时会默认在 C 盘自动搜寻相关的文件，所以推荐大家将软件放在 C 盘。"],[185,"扩维需要使用 ATP 文件夹下 tools 文件夹内的 ATPLaunch，双击 ATPLaunch，对于2003内核来说，ATPLaunch 一般是1:08版本。"],[200,"点击 tools 菜单栏下的 make tpbig 点 exe，弹出设置界面，点击勾选 change list size，我们可以对相应的参数进行扩维。"],[217,"本例中是 list 八，即从第一个开始数第八个参数，l past。"],[227,"注意每个维数是八位，不能超过八位。"],[233,"使用软件自带的 tpbig，使用的是 ATP bin gw 文件夹下的 list size 点 big 内的数据，可以使用 U E 来打开。"],[248,"在 ATPLaunch 的界面中，点击 load default，也可以看到相关的参数。"],[257,"扩维前，list 八即 l past 为120 k，六位数。"],[266,"通常情况下，计算扩维后准确的位数很麻烦，最简单的方法就是试。"],[275,"一般情况下，我们将数值扩大两个数量级，一般对于仿真就够用了。"],[283,"这个 l past 参数比较大，我们就采用这一个参数，相当于对它进行扩维。"],[293,"我们使用默认的 makefile，或者是使用以下目录下的 makefile，它的位置在 C 盘 ATP ATP bin gw 文件夹下的 make 文件夹下，选择 makefile 杠122，点击打开。"],[315,"选择这个自定义的，或者是选择默认的 makefile，两者都是可以运行的。"],[324,"编译器的路径必须是该路径下的 bin 文件夹下。"],[330,"点击 make，在 DOS 中显示 mytpbig 被成功创建。"],[339,"它默认被创建在 ATP means gw 文件夹下。"],[346,"我们在 ATP means gw 文件夹下能够找到 mytpbig 点 exe，是今天创立的。"],[359,"我们在 ATP draw 文件夹下 run atp g 点 bat，通过这个批处理文件来调用 mytpbig，右键选择 ultra edit 来打开，将 tpbig 改为 mytpbig，并保存。"],[380,"到此扩维的工作就完成了，我们再次计算刚刚数据溢出的仿真，点击 run atp，可以看到仿真正在顺利进行。"],[398,"点击 plot，可以看到可以成功绘图，查看 list。"],[410,"我们翻到最后，也没有相关的 error 报错，说明扩维成功。"],[420,"接下来我们打开 ATP means gw 文件夹下的 list size 点 big，右键使用 ultra edit 来打开，对应我们将 ATP launch 的 make tpbig 界面来打开，两者相对应，我们来讲解一些经常会遇到的需要扩维的重要参数。"],[448,"除了八号参数 l past 外，15号参数 lctacs 和28号 lrtacs 分别代表 models 的 character 所需要的最大字节数，以及 models 所有浮点数的储存空间。"],[472,"19号参数 ltact 代表所有 tacs 浮点参数总储存单元最大的数量。"],[485,"当 models 和 tacs 参数溢出时，需要对以上参数进行扩维。"],[494,"对于2003的内核扩维讲解就到这里。"],[499,"对于2016内核和2019内核，两者均使用1.20版本的 ATP lunch，因此进行合并讲解。"],[512,"同样使用 Tools ATP lunch，点击 Tools Make tpbig，使用1.20版本 ATP lunch 进行扩维时，必须勾选使用内置 makefile，即 Use Built-in Makefile，使用自定义的 makefile 无法运行。"],[541,"My tpbig directory 代表 my tpbig 生成后存放的路径。"],[549,"首先我们先来保持默认，点击 Make。"],[552,"提示 my tpbig 成功被创建，我们在文档 ATP data my tpbig 文件夹下找到了生成的 my tpbig。"],[569,"其次我们将 my tpbig 存放到 C 盘 ATP ATP mean GW 文件夹下，我们点击 Make。"],[582,"首先第一次运行的时候，它会提示报错，没有生成 my tpbig，我们不管，再次运行相同的计算，点击 Make。"],[597,"这一次 my tpbig 就会被成功生成。"],[603,"我们在 C 盘 ATP ATP mean GW 文件夹下找到了刚刚生成的 my tpbig，使用相似的方法，在批处理文件中调用 my tpbig 就可以进行相应的计算。"],[622,"对于2019版的内核，只不过是将仿真内核 ATP mean GW 和库文件 lib mean GW 进行替换。"],[635,"我们将 ATP mean W 当中的所有文件对原内核进行替换。"],[647,"然后将 lib mean GW 当中的库文件全部复制，但是 makefile 不进行复制。"],[662,"使用原版本的 makefile 进行替换。"],[673,"替换后使用 ATP Launcher 进行扩维。"],[681,"使用内置的 makefile，我们点击 make，可以看到 mytpbig 被成功创建。"],[696,"我们的存放路径是 ATPmjw 文件夹下，可以看到 mytpbig 被成功创建。"],[708,"在 ATPDraw 文件夹下，使用 runatpg. bat 来调用 mytpbig，就可以进行计算了。"],[720,"以上就是利用 ATP Launcher 对 tpbig 重新编译进行扩维的方法和操作步骤。"],[729,"总体来说，1:08版本的 ATP Launcher 扩维存在的问题较少，扩维成功率更高，能够满足大部分用户的需要，我们也介绍的更为详细。"],[745,"这就是扩维的全部内容，我们下期见。"]]},{"p":91,"t":"A.1 常见错误及处理","d":612,"s":[[0,"大家好，本节视频和大家分享初学者仿真过程中经常遇到的绘图时提示错误，显示文件丢失或图形文件零字节的问题。"],[15,"如图，左侧为旧版 plotxy 的报错提示信息，右侧为新版 plotxy 的告警提示。"],[26,"遇到这个提示，总体上分为两种情况，一种是稳态计算，进行稳态计算时，仿真时间为负，只有 lis 文件文件的输出，不生成 pch 的图形文件，因此绘图会提示图形文件丢失。"],[47,"这种情况下不需要做任何处理，只要 lis 文件中没有 error 提示及报错信息即可。"],[56,"进行稳态计算，大家需要从文本输出文件中找到大家需要的稳态信息，如电压、电流、功率等。"],[67,"另一种情况是进行暂态计算时，若提示该错误，说明仿真出现错误，搭建的模型有问题。"],[77,"处理的方法是在 ATP 菜单下找到 view lis，查看 lis 文件，在文本文件中查找 error 行，查看错误代码和错误描述，根据描述进行修改。"],[94,"接下来我们通过几个例子，列举几个常见的错误代码和错误信息，并和大家探讨处理方法。"],[104,"我们同样以一个雷击案例来讲解仿真中可能遇到的错误。"],[111,"当然这些错误在其他仿真中是具有通用性的，大家同样可以根据我们提供的方法和解决思路处理相关问题。"],[121,"问题一，kail 等于一，数据溢出。"],[126,"这是一个110kv单回路线路的雷击仿真，计算了侵入波对变电站设备的威胁情况。"],[137,"本例中杆塔、变电站、分布参数元件单位均使用米为单位。"],[145,"大家可以看到波速为三乘以10的八次方米每秒，在变电站的引线及母线中也是10的八次方级别。"],[156,"使用常规内核调用 tpbig 进行仿真计算。"],[162,"我们查看 lis 文件。"],[167,"翻到最后，我们可以看到 error 信息，一开始是两行 error，最后是两行 error。"],[179,"这四行 error 中间，我们可以看到错误代码 k 等于一，以及错误的信息描述，提示内存溢出。"],[189,"这种情况是由于仿真中分布参数线路元件过多造成的，尤其是在雷击情况下，L C C 元件多采用近马 T 模型。"],[201,"研究到变电站侵入波时，变电站内包括母线、引线等分布参数元件也很多。"],[209,"A T P 在计算这些分布参数元件时占用的内存较大，就容易造成数据溢出的问题。"],[218,"针对这个问题，我们给出两种解决思路。"],[222,"方法一，大家可以想一下，为何我们计算例九 n 的仿真计算中没有这个问题呢？"],[230,"在杆塔建模一节中，我们给出了相关思路。"],[235,"这是因为在例九 n 中，我们将杆塔分布参数元件和变电站母线引线，波阻抗的电阻、波速的数值缩小了1000倍，线路的长度也缩短了1000倍。"],[250,"这样各个数值都减小了三个数量级，这大大节省了空间，就不会报该错误。"],[259,"因此，第一个方法就是分布参数元件统一单位为千米，节省数值的使用空间，就可以完美的解决该问题。"],[269,"我们也首推使用这种方法。"],[272,"方法二，A T P 最初开发在 dos 系统中，限制了内存的使用，防止计算机死机。"],[281,"但是现在计算机的发展早已不存在这个问题，因此可以对仿真内核进行扩维，来解决数据溢出的问题。"],[293,"有些情况下可能不是分布参数元件的问题，可能是 T A C S 的内存不够，model 的内存不够等等。"],[302,"这种情况也无法通过方法一来解决，只能对相关参数进行扩维。"],[309,"扩维的方法较为复杂，我们将在下一节视频详细讲解。"],[314,"问题二，电源、换位元件等未连接到电路中，进行暂态计算时，电路必须包含电源。"],[324,"本例中主要的源是雷电流冲击源，我们还观察了自电位对仿真结果的影响。"],[332,"有时我们研究无工频电源时。"],[336,"就直接将工频电源直接移开，进行仿真了，这是不允许的。"],[343,"我们进行仿真计算，查看 lis，如图可以看到 kail 代码12，提示电源节点没有连接到电路当中，这是不允许的。"],[356,"问题三，仿真步长太大，尤其是在分布参数元件较多的案例中，仿真步长不能设置太大。"],[366,"在本例中，我们先将仿真步长设置为一个较大的值，1×10的负七次方秒。"],[373,"我们运行仿真，除了可以查看 lis，我们使用批处理文件当中的 pause 命令，可以直接在 dos 窗口中查看错误。"],[384,"我们可以看到 kail 代码等于29，提示16节点到11节点之间的分布参数元件传播时间是1.5×10的负八次方秒，这比仿真步长要小，这是不合理的。"],[402,"它提供了两种解决方案，可以缩短仿真步长，也可以将分布参数元件替换为π型集总参数模型。"],[414,"问题四，暂态仿真没有输出。"],[418,"在暂态仿真中，应使用相关表记对电压、电流、功率、能量、model、tacs 等变量进行输出，才能绘制相应的波形。"],[433,"如果我们没有对相应的变量进行输出，直接进行仿真，也是不会生成绘图文件的。"],[441,"同样在 lis 文件中会有相应的报错信息。"],[446,"在本仿真中，我们已经取消了相应的电压电流探针，我们运行仿真计算。"],[454,"同样我们在 dos 窗口中查看相应的报错信息，错误代码44，用户忘记了对一个或更多的输出变量做请求，这对仿真来说是不被允许的。"],[473,"问题五，编程问题，我们将其中一个压控开关换成了相交法编程模块，我们来设置两个错误。"],[483,"首先我们在赋值语句当中，冒号等于号，两者应该是一体的。"],[491,"首先我们在冒号等于号中间加一个空格，点击 done，点击 ok，我们运行仿真。"],[500,"在 dos 窗口当中，我们可以看到 kail 代码422。"],[506,"提示赋值语句要用冒号等于号，我们将这个错误取消掉。"],[514,"点击 done，点击 OK，运行仿真。"],[521,"可以顺利进行，没有 errors 错误代码的提示。"],[526,"我们再设置一个仿真错误，我们将 if then end if 拆开，我们去掉 end if，点击 done，点击 OK，我们运行仿真。"],[541,"我们来看错误代码，仍旧是422，提示赋值语句要用冒号等于号进行赋值。"],[550,"因此对于 model 编程来说，并不能最精准的判别错误，可能不同的错误对应相同的错误代码和错误描述，这就需要大家仔细阅读自己的程序。"],[564,"错误六，仿真文件名称包含空格，在这里我们可以看到横杠左边和右边各有一个空格，或者文件名太长的时候会出现 lis 空白，仿真不能顺利进行的错误。"],[582,"我们打开该仿真，利用批处理文件的 pause 命令，在 dos 窗口中查看该错误。"],[590,"我们能够看到错误提示批处理文件提供了一个错误的输入文件的名称，大家一定要注意这一点，仿真文件的名称不能包含空格或者文件名不能过长。"],[608,"好，今天的视频就到这里，我们下期见。"]]}],"ch":[{"k":"1","n":"安装","c":2},{"k":"2","n":"计算原理","c":2},{"k":"3","n":"RLC电路","c":6},{"k":"4","n":"TACS/MODELS","c":5},{"k":"5","n":"滤波与PT","c":4},{"k":"6","n":"输电线路","c":10},{"k":"7","n":"平行线路与高抗","c":5},{"k":"8","n":"非线性与谐振","c":10},{"k":"9","n":"合闸统计","c":6},{"k":"10","n":"BCTRAN变压器","c":4},{"k":"11","n":"单相电缆","c":5},{"k":"12","n":"三相电缆","c":6},{"k":"13","n":"雷电过电压","c":4},{"k":"14","n":"XFMR变压器","c":2},{"k":"15","n":"频率扫描","c":3},{"k":"16","n":"电力电子","c":4},{"k":"17","n":"同步电机","c":5},{"k":"18","n":"潮流计算","c":4},{"k":"A","n":"附录","c":2}],"topics":[["变压器","8章 SAT·10章 BCTRAN·14章 XFMR"],["电缆","11章 单相·12章 三相"],["MODELS","4.4·13.3·16.3·17.4"],["TACS","4.1·4.2 基础"],["断路器","9章·8章"],["电机","17章·18章"],["潮流","18章"],["避雷器","9章·8.1"],["绝缘子","13.3"],["雷电","13章"],["非线性","8章"],["谐振","8.8-8.10"],["杆塔","13.2"],["IGBT","16.1"],["频率扫描","15章"],["输电线路","6章"],["接地","7·12·6章"],["波阻抗","6章"]],"alt":{"同步电机":["电机","发电机"],"PI模型":["π模型"],"pi模型":["π模型"],"Kizilcay":["KZLK","集中参数"],"励磁涌流":["涌流"],"Clarke变换":["相模变换","变换矩阵"],"半导电层":["半导体层"],"多重仿真":["统计计算","多次仿真"],"电流互感器":["PT","互感器"],"触发脉冲":["脉冲","栅极"],"PID控制":["反馈控制"],"空载过电压":["空载"],"SAT饱和模型":["饱和模型"],"COMBINE":[],"DIFFEQ":[],"ZFUN":[],"backtime":[],"histdef":[]}}</script>
<script>
(function(){
  "use strict";
  var D=JSON.parse(document.getElementById("data").textContent);
  var BV=D.bv, LEC=D.lec, CH=D.ch, TOPICS=D.topics, ALT=D.alt;
  var qEl=document.getElementById("q"), panel=document.getElementById("panel"),
      stat=document.getElementById("stat"), chips=document.getElementById("chips"),
      frame=document.getElementById("frame"), noplayer=document.getElementById("noplayer"),
      pinfo=document.getElementById("pinfo"), ptitle=document.getElementById("ptitle"),
      pout=document.getElementById("pout"), scriptBox=document.getElementById("script");
  var chapSel=null, curP=null, MAXG=40, MAXH=8;
  var byP={}; LEC.forEach(function(L){byP[L.p]=L;});

  function esc(s){return s.replace(/[&<>"]/g,function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}
  function mmss(t){var m=Math.floor(t/60),s=Math.floor(t%60);return m+":"+(s<10?"0":"")+s;}
  function biliUrl(p,t){return "https://www.bilibili.com/video/"+BV+"/?p="+p+"&t="+Math.max(0,Math.floor(t)-2);}
  function playerUrl(p,t){
    return "https://player.bilibili.com/player.html?bvid="+BV+"&page="+p
         + "&t="+Math.max(0,Math.floor(t)-2)+"&autoplay=0&danmaku=0";
  }
  function chapOf(t){var m=/^([0-9]+|[A-Z])/.exec(t);return m?m[1]:"?";}

  // ---- 播放 ----
  function play(p,t){
    var L=byP[p]; if(!L) return;
    frame.innerHTML='<iframe src="'+playerUrl(p,t)+'" allowfullscreen '
      + 'referrerpolicy="no-referrer" title="'+esc(L.t)+'"></iframe>';
    frame.hidden=false; noplayer.hidden=true; pinfo.hidden=false;
    ptitle.textContent="P"+p+"  "+L.t;
    pout.href=biliUrl(p,t);
    if(curP!==p){ curP=p; renderScript(L); }
    markCur(t);
    if(window.innerWidth<=900) frame.scrollIntoView({behavior:"smooth",block:"start"});
  }
  function renderScript(L){
    var h='<div class="sh">讲稿 · P'+L.p+' · 点任意一行跳到该处</div>';
    L.s.forEach(function(s,i){
      h+='<div class="ln" data-t="'+s[0]+'" data-i="'+i+'"><span class="lt">'+mmss(s[0])
       + '</span><span class="lx">'+esc(s[1])+'</span></div>';
    });
    scriptBox.innerHTML=h; scriptBox.hidden=false;
  }
  function markCur(t){
    var best=null;
    [].forEach.call(scriptBox.querySelectorAll(".ln"),function(el){
      el.classList.remove("cur");
      if(+el.getAttribute("data-t")<=t) best=el;
    });
    if(best){ best.classList.add("cur");
      scriptBox.scrollTop = best.offsetTop - scriptBox.clientHeight/2; }
  }

  // ---- 章节筛选 ----
  CH.forEach(function(c){
    var b=document.createElement("button");
    b.className="chip"; b.type="button"; b.setAttribute("aria-pressed","false");
    b.innerHTML=esc(c.k)+" "+esc(c.n)+'<span class="c">'+c.c+"</span>";
    b.onclick=function(){
      chapSel=(chapSel===c.k)?null:c.k;
      [].forEach.call(chips.children,function(x){x.setAttribute("aria-pressed","false");});
      if(chapSel) b.setAttribute("aria-pressed","true");
      render();
    };
    chips.appendChild(b);
  });

  // ---- 检索 ----
  function search(q){
    var out=[], ql=q.toLowerCase(), total=0;
    for(var i=0;i<LEC.length;i++){
      var L=LEC[i];
      if(chapSel && chapOf(L.t)!==chapSel) continue;
      var hits=[];
      for(var j=0;j<L.s.length;j++)
        if(L.s[j][1].toLowerCase().indexOf(ql)>=0) hits.push(L.s[j]);
      if(hits.length){ total+=hits.length; out.push({L:L,hits:hits}); }
    }
    return {groups:out,total:total};
  }
  function hl(txt,q){
    var lo=txt.toLowerCase(), ql=q.toLowerCase(), o="", i=0, k;
    while((k=lo.indexOf(ql,i))>=0){
      o+=esc(txt.slice(i,k))+"<mark>"+esc(txt.slice(k,k+q.length))+"</mark>"; i=k+q.length;
    }
    return o+esc(txt.slice(i));
  }

  function render(){
    var q=qEl.value.trim();
    if(!q){ renderBrowse(); return; }
    var r=search(q);
    stat.innerHTML = r.total ? ("命中 <b>"+r.total+"</b> 处，分布在 <b>"+r.groups.length+"</b> 讲"
      +(chapSel?("（已筛选第 "+esc(chapSel)+" 章）"):"")) : "";
    if(!r.total){ renderEmpty(q); return; }
    var h="";
    r.groups.slice(0,MAXG).forEach(function(g){
      h+='<div class="grp"><div class="grphead"><span class="gn">P'+g.L.p+'</span>'
       + '<span class="gt">'+esc(g.L.t)+'</span></div>';
      g.hits.slice(0,MAXH).forEach(function(s){
        var pct=Math.min(100,Math.max(0,s[0]/Math.max(g.L.d,1)*100));
        h+='<button class="hit" type="button" data-p="'+g.L.p+'" data-t="'+s[0]+'">'
         + '<span class="hitmeta"><span class="tc">'+mmss(s[0])+'</span>'
         + '<span class="axis"><i style="left:'+pct.toFixed(1)+'%"></i></span></span>'
         + '<span class="hittext">'+hl(s[1],q)+'</span></button>';
      });
      if(g.hits.length>MAXH)
        h+='<button class="hit" type="button" data-p="'+g.L.p+'" data-t="'+g.hits[MAXH][0]+'">'
         + '<span class="hittext" style="color:var(--muted)">…另有 '+(g.hits.length-MAXH)
         + ' 处，点此跳到第 '+(MAXH+1)+' 处</span></button>';
      h+="</div>";
    });
    if(r.groups.length>MAXG) h+='<div class="statline">仅显示前 '+MAXG+' 讲，请缩小范围或用章节筛选。</div>';
    panel.innerHTML=h;
  }
  function renderEmpty(q){
    var key=null;
    for(var k in ALT) if(k.toLowerCase()===q.toLowerCase()){key=k;break;}
    var h='<div class="empty"><div class="big">没有找到「'+esc(q)+'」</div>';
    if(key && ALT[key].length){
      h+='<div>课程讲了这个内容，但用的是别的说法：</div><div class="altbox">';
      ALT[key].forEach(function(a){h+='<button class="chip" type="button" data-alt="'+esc(a)+'">'+esc(a)+'</button>';});
      h+='</div>';
    } else if(key){
      h+='<div>这一项课程<b>确实没有讲</b>。MODELS 的 COMBINE / DIFFEQ / ZFUN / backtime / histdef 等属于未讲解规则。</div>';
    } else { h+='<div>换个说法试试，或清空搜索框浏览主题。</div>'; }
    panel.innerHTML=h+"</div>";
  }
  function renderBrowse(){
    stat.innerHTML="共 <b>"+LEC.length+"</b> 讲，<b>"
      +LEC.reduce(function(a,b){return a+b.s.length;},0)+"</b> 个可检索句子";
    var h='<h2 class="sech">按主题入门</h2><div class="topicgrid">';
    TOPICS.forEach(function(t){
      h+='<button class="topic" type="button" data-alt="'+esc(t[0])+'"><span class="t">'
       + esc(t[0])+'</span><span class="w">'+esc(t[1])+'</span></button>';
    });
    h+='</div><h2 class="sech">'+(chapSel?("第 "+esc(chapSel)+" 章"):"全部课程")+'</h2>';
    LEC.forEach(function(L){
      if(chapSel && chapOf(L.t)!==chapSel) return;
      h+='<div class="lecrow" data-p="'+L.p+'" data-t="0"><span class="pnum">P'+L.p+'</span>'
       + '<span class="lectitle">'+esc(L.t)+'</span>'
       + '<span class="lecdur">'+mmss(L.d)+'</span></div>';
    });
    panel.innerHTML=h;
  }

  panel.addEventListener("click",function(e){
    var a=e.target.closest("[data-alt]");
    if(a){ qEl.value=a.getAttribute("data-alt"); render(); qEl.focus();
           window.scrollTo({top:0,behavior:"smooth"}); return; }
    var b=e.target.closest("[data-p]");
    if(b) play(+b.getAttribute("data-p"), +b.getAttribute("data-t"));
  });
  scriptBox.addEventListener("click",function(e){
    var l=e.target.closest(".ln");
    if(l && curP) play(curP, +l.getAttribute("data-t"));
  });
  var timer=null;
  qEl.addEventListener("input",function(){clearTimeout(timer);timer=setTimeout(render,90);});

  document.getElementById("theme").onclick=function(){
    var cur=document.documentElement.getAttribute("data-theme");
    var next=cur==="dark"?"light":cur==="light"?"dark"
      :(matchMedia("(prefers-color-scheme:dark)").matches?"light":"dark");
    document.documentElement.setAttribute("data-theme",next);
    try{localStorage.setItem("atp-theme",next);}catch(err){}
  };
  try{var sv=localStorage.getItem("atp-theme");
      if(sv) document.documentElement.setAttribute("data-theme",sv);}catch(err){}

  render();
})();
</script>
</body>
</html>
