<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ATP-EMTP 课程索引</title>
<style>
  :root{
    --bg:#F7F5F0; --surface:#FFFFFF; --surface-2:#FBF9F5;
    --ink:#1C1E26; --muted:#6B6F7B; --faint:#93979F;
    --line:#E2DED5; --line-2:#EFEBE3;
    --accent:#B4531A; --accent-soft:#F4E6D8; --on-accent:#FFFFFF;
    --mark:#FFDF9E; --mark-ink:#5A3B00;
    --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"DejaVu Sans Mono",
           "Microsoft YaHei","PingFang SC","Hiragino Sans GB",sans-serif;
    --cjk:"PingFang SC","Microsoft YaHei","Hiragino Sans GB","Noto Sans CJK SC",system-ui,sans-serif;
    color-scheme:light dark;
  }
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]){
      --bg:#14161C; --surface:#1B1E26; --surface-2:#20242D;
      --ink:#E9E7E2; --muted:#9BA1AF; --faint:#6E7480;
      --line:#2B2F39; --line-2:#242831;
      --accent:#E08542; --accent-soft:#2F2318; --on-accent:#14161C;
      --mark:#6A5218; --mark-ink:#FFE8B8;
    }
  }
  :root[data-theme="dark"]{
    --bg:#14161C; --surface:#1B1E26; --surface-2:#20242D;
    --ink:#E9E7E2; --muted:#9BA1AF; --faint:#6E7480;
    --line:#2B2F39; --line-2:#242831;
    --accent:#E08542; --accent-soft:#2F2318; --on-accent:#14161C;
    --mark:#6A5218; --mark-ink:#FFE8B8;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{background:var(--bg);color:var(--ink);font-family:var(--cjk);font-size:15px;line-height:1.7}
  .wrap{max-width:1360px;margin:0 auto;padding-inline:16px}

  header.top{position:sticky;top:0;z-index:40;background:var(--bg);
    border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
  .brandrow{display:flex;flex-direction:column;align-items:flex-start;gap:3px;padding-block:10px}
  .brand{font-family:var(--cjk);font-weight:600;font-size:15px;line-height:1.45}
  @media (max-width:560px){.brand{font-size:14px}}
  .brand b{color:var(--accent)}
  .sub{color:var(--muted);font-size:12.5px}
  .searchbar{display:flex;gap:8px;padding-bottom:12px}
  #q{flex:1;min-width:0;font:inherit;font-size:16px;color:var(--ink);background:var(--surface);
     border:1px solid var(--line);border-radius:8px;padding:11px 13px;outline:none}
  #q:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
  .btn{font:inherit;font-size:13px;color:var(--muted);background:var(--surface);
       border:1px solid var(--line);border-radius:8px;padding:10px 12px;cursor:pointer}
  .btn:hover{color:var(--ink);border-color:var(--accent)}
  .btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

  .cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,460px);gap:20px;
        align-items:start;padding-block:12px 30px}
  @media (max-width:900px){ .cols{grid-template-columns:minmax(0,1fr)} .side{order:-1} }

  .chips{display:flex;gap:6px;flex-wrap:wrap;padding-block:0 12px}
  .chip{font-family:var(--cjk);font-size:13px;color:var(--muted);background:var(--surface);
        border:1px solid var(--line);border-radius:999px;padding:4px 10px;cursor:pointer}
  .chip:hover{border-color:var(--accent);color:var(--ink)}
  .chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
  .chip .c{opacity:.6;margin-left:4px}
  .statline{font-family:var(--cjk);font-size:15px;color:var(--muted);padding-bottom:11px}
  .statline b{color:var(--accent);font-size:17px;font-weight:600;
              font-variant-numeric:tabular-nums}

  h2.sech{font-size:13px;font-weight:600;letter-spacing:.04em;color:var(--muted);
          margin:16px 0 8px;font-family:var(--cjk)}
  h2.sech:first-child{margin-top:0}
  .topicgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(98px,1fr));gap:6px}
  .topic{text-align:center;background:var(--surface);border:1px solid var(--line);border-radius:7px;
         padding:5px 8px;cursor:pointer;font:inherit;color:var(--ink);
         font-size:13.5px;line-height:1.5;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .topic:hover{border-color:var(--accent);color:var(--accent)}
  .topicgrid.models{grid-template-columns:repeat(auto-fill,minmax(112px,1fr))}
  .topic.user{background:var(--accent-soft);border-color:var(--accent-soft);
              position:relative;padding-right:20px}
  .topic.user:hover{border-color:var(--accent)}
  .topic .x{position:absolute;right:4px;top:50%;transform:translateY(-50%);
            width:15px;height:15px;line-height:14px;text-align:center;border-radius:50%;
            font-size:12px;color:var(--faint);background:transparent}
  .topic .x:hover{background:var(--accent);color:var(--on-accent)}
  .topic:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

  .lecrow{display:flex;align-items:center;gap:10px;padding:7px 0;
          border-bottom:1px solid var(--line-2);cursor:pointer}
  .lecrow:hover{color:var(--accent)}
  .lecrow.on{color:var(--accent);font-weight:600}
  .pnum{font-family:var(--mono);font-size:11px;color:var(--faint);min-width:34px;
        text-align:right;font-variant-numeric:tabular-nums}
  .lectitle{flex:1;min-width:0;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .lecdur{font-family:var(--mono);font-size:11px;color:var(--faint);font-variant-numeric:tabular-nums}

  .grp{background:var(--surface);border:1px solid var(--line);border-radius:10px;
       margin-bottom:12px;overflow:hidden}
  .grphead{display:flex;align-items:center;gap:9px;padding:9px 13px;background:var(--surface-2);
           border-bottom:1px solid var(--line)}
  .grphead .gt{flex:1;min-width:0;font-weight:600;font-size:13.5px;
               overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .gsec{font-size:11px;color:var(--faint);white-space:nowrap}
  @media (max-width:560px){.gsec{display:none}}
  .gn{font-family:var(--mono);font-size:11px;color:var(--accent);background:var(--accent-soft);
      border-radius:4px;padding:1px 6px}
  .hit{display:block;width:100%;text-align:left;background:none;border:0;
       border-top:1px solid var(--line-2);padding:9px 13px;cursor:pointer;color:inherit;font:inherit}
  .hit:first-of-type{border-top:0}
  .hit:hover{background:var(--surface-2)}
  .hit:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
  .hitmeta{display:flex;align-items:center;gap:9px;margin-bottom:3px}
  .tc{font-family:var(--mono);font-size:11.5px;color:var(--accent);font-variant-numeric:tabular-nums}
  .axis{flex:1;height:3px;background:var(--line-2);border-radius:2px;position:relative;min-width:40px}
  .axis i{position:absolute;top:-2px;width:3px;height:7px;background:var(--accent);border-radius:1px}
  .hittext{font-size:14px;line-height:1.65}
  mark{background:var(--mark);color:var(--mark-ink);border-radius:2px;padding:0 1px}

  .side{position:sticky;top:74px}
  @media (max-width:900px){ .side{position:static} }
  .player{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
  .frame{position:relative;width:100%;aspect-ratio:16/9;max-width:100%;background:#000}
  .frame iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
  .pinfo{padding:9px 12px;border-top:1px solid var(--line)}
  .pinfo .pt{font-size:13px;font-weight:600;margin-bottom:6px;
             overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .outs{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
  .outs .lbl{font-size:11px;color:var(--faint);margin-right:2px}
  a.play{font-family:var(--mono);font-size:11px;color:var(--accent);text-decoration:none;
         border:1px solid var(--line);border-radius:6px;padding:3px 8px;white-space:nowrap}
  a.play:hover{background:var(--accent-soft);border-color:var(--accent)}

  .slot{margin-top:12px;background:var(--surface);border:1px solid var(--line);
        border-radius:10px;padding:13px 14px}
  .slot h3{margin:0 0 7px;font-size:12.5px;font-family:var(--mono);color:var(--faint);
           font-weight:600;letter-spacing:.04em}
  .slot ul{margin:0;padding-left:18px}
  .slot li{font-size:13px;line-height:1.9}
  .slot a{color:var(--accent)}
  .slot p{margin:7px 0 0;font-size:12px;color:var(--muted)}
  .slot .cur{font-size:11.5px;color:var(--faint)}
  .slot p.pv b{color:var(--accent);font-weight:600;font-variant-numeric:tabular-nums}

  .empty{text-align:center;color:var(--muted);padding:26px 8px;background:var(--surface);
         border:1px solid var(--line);border-radius:10px}
  .empty .big{font-size:15px;color:var(--ink);margin-bottom:8px}
  .altbox{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-top:10px}
  footer{border-top:1px solid var(--line);color:var(--faint);font-size:12px;
         padding-block:15px 28px;line-height:1.8}
  footer a{color:var(--muted)}
  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

<script>
(function(){
  "use strict";
  var D=JSON.parse(decodeURIComponent(escape(atob(
        document.getElementById("data").textContent.trim()))));
  var BV=D.bv, LEC=D.lec, GRP=D.groups, TOPICS=D.topics, MODELS=D.models||[], ALT=D.alt, ALL=D.all,
      ALIAS=D.alias||{}, TERMS={};
  (D.terms||[]).forEach(function(t){TERMS[t]=1;});
  var qEl=document.getElementById("q"), results=document.getElementById("results"),
      browse=document.getElementById("browse"), stat=document.getElementById("stat"),
      chips=document.getElementById("chips"), frame=document.getElementById("frame"),
      ptitle=document.getElementById("ptitle"),
      lnkP=document.getElementById("lnkP"), lnkS=document.getElementById("lnkS");
  var gSel=null, curP=null, PAD=20, MAXG=40, MAXH=8;
  var MYKEY="atp-mytopics", MYMAX=12;
  function myLoad(){ try{ return JSON.parse(localStorage.getItem(MYKEY))||[]; }catch(e){ return []; } }
  function mySave(a){ try{ localStorage.setItem(MYKEY, JSON.stringify(a)); }catch(e){} }
  var MY=myLoad().filter(function(w){ return TERMS[String(w).toLowerCase()]; });
  if(MY.length!==myLoad().length) mySave(MY);   // 清掉早期版本存下的无效词
  function isBuiltin(w){
    var lw=w.toLowerCase(), i;
    for(i=0;i<TOPICS.length;i++) if(TOPICS[i][0].toLowerCase()===lw) return true;
    for(i=0;i<MODELS.length;i++)
      if(MODELS[i][0].toLowerCase()===lw || MODELS[i][2].toLowerCase()===lw) return true;
    return false;
  }
  function myAdd(w){
    if(!w || isBuiltin(w)) return false;
    if(!TERMS[w.toLowerCase()]) return false;   // 仅收录 ATP 检索术语，排除单位、界面词与过泛词
    for(var i=0;i<MY.length;i++) if(MY[i].toLowerCase()===w.toLowerCase()) return false;
    MY.unshift(w); if(MY.length>MYMAX) MY.length=MYMAX; mySave(MY); return true;
  }
  var byP={}; LEC.forEach(function(L){byP[L.p]=L;});
  var allByP={}; ALL.forEach(function(x){allByP[x.p]=x;});

  function esc(s){return s.replace(/[&<>"]/g,function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}
  function mmss(t){var m=Math.floor(t/60),s=Math.floor(t%60);return m+":"+(s<10?"0":"")+s;}
  function back(t){return Math.max(0,Math.floor(t)-2);}
  function gName(i){for(var k=0;k<GRP.length;k++) if(GRP[k].i===i) return GRP[k].n; return "";}

  function play(p,t){
    var meta=allByP[p]; if(!meta) return;
    frame.innerHTML='<iframe src="https://player.bilibili.com/player.html?bvid='+BV
      +'&page='+p+'&t='+back(t)+'&autoplay=0&danmaku=0" allowfullscreen '
      +'referrerpolicy="no-referrer" title="'+esc(meta.t)+'"></iframe>';
    ptitle.textContent="P"+p+"  "+meta.t;
    // 右下两条链接的地址跟随当前播放位置（不显示文字提示）
    lnkP.href="https://www.bilibili.com/video/"+BV+"/?p="+p+"&t="+back(t);
    var L=byP[p];
    lnkS.href = (L && L.b2)
      ? "https://www.bilibili.com/video/"+L.b2+"/?t="+back(t)
      : "https://www.bilibili.com/video/BV1kL41187fZ/";
    curP=p;
    [].forEach.call(browse.querySelectorAll(".lecrow"),function(el){
      el.classList.toggle("on", +el.getAttribute("data-p")===p); });
    if(window.innerWidth<=900) frame.scrollIntoView({behavior:"smooth",block:"start"});
  }

  var allBtn=document.createElement("button");
  allBtn.className="chip"; allBtn.type="button"; allBtn.setAttribute("aria-pressed","true");
  allBtn.textContent="全部视频";
  allBtn.onclick=function(){ gSel=null; qEl.value=""; syncChips(); render(); };
  chips.appendChild(allBtn);
  function syncChips(){
    var searching = qEl.value.trim() !== "";
    [].forEach.call(chips.children,function(x,i){
      // 正在搜索时不高亮任何筛选按钮，避免"全部视频"一直亮着
      var on = searching ? false : (i===0 ? gSel===null : GRP[i-1].i===gSel);
      x.setAttribute("aria-pressed", String(on));
    });
  }

  GRP.forEach(function(g){
    var b=document.createElement("button");
    b.className="chip"; b.type="button"; b.setAttribute("aria-pressed","false");
    b.textContent=g.n;
    b.onclick=function(){
      gSel=(gSel===g.i)?null:g.i;
      qEl.value="";                 // 点分组＝浏览该组，不带着上一个搜索词
      syncChips(); render();
    };
    chips.appendChild(b);
  });

  // 讲师口述与标准写法常不一致（XFMR 念成 "X F M R"，PI模型 说成 π模型），
  // 所以把搜索词展开成语料中真实出现的若干写法，任一命中即可
  function expand(q){
    var out=[q], lq=q.toLowerCase();
    for(var k in ALIAS) if(k.toLowerCase()===lq){ out=out.concat(ALIAS[k]); break; }
    return out;
  }
  function search(q,useFilter){
    var vars=expand(q).map(function(v){return v.toLowerCase();});
    var out=[], total=0, usedAlias=false;
    for(var i=0;i<LEC.length;i++){
      var L=LEC[i];
      if(useFilter && gSel!==null && L.g!==gSel) continue;
      var hits=[];
      for(var j=0;j<L.s.length;j++){
        var lo=L.s[j][1].toLowerCase();
        for(var v=0;v<vars.length;v++)
          if(lo.indexOf(vars[v])>=0){
            hits.push([L.s[j][0],L.s[j][1],vars[v]]);
            if(v>0) usedAlias=true;
            break;
          }
      }
      if(hits.length){ total+=hits.length; out.push({L:L,hits:hits}); }
    }
    return {groups:out,total:total,alias:usedAlias,vars:vars};
  }
  function snippet(txt,q){
    var lo=txt.toLowerCase(), k=lo.indexOf(q.toLowerCase());
    if(k<0) return esc(txt.slice(0,PAD*2))+(txt.length>PAD*2?"…":"");
    var a=Math.max(0,k-PAD), b=Math.min(txt.length,k+q.length+PAD);
    return (a>0?"…":"")+esc(txt.slice(a,k))+"<mark>"+esc(txt.slice(k,k+q.length))
         + "</mark>"+esc(txt.slice(k+q.length,b))+(b<txt.length?"…":"");
  }

  function render(){
    renderBrowse();
    var q=qEl.value.trim();
    if(!q){
      results.hidden=true; results.innerHTML="";
      stat.innerHTML="共 <b>"+LEC.length+"</b> 讲可检索"
      return;
    }
    var r=search(q,true);
    results.hidden=false;
    if(!r.total){ renderEmpty(q); return; }
    if(myAdd(q)) renderBrowse();
    stat.innerHTML="命中 <b>"+r.total+"</b> 处，分布在 <b>"+r.groups.length+"</b> 讲";
    var h="";
    r.groups.slice(0,MAXG).forEach(function(g){
      h+='<div class="grp"><div class="grphead"><span class="gn">P'+g.L.p+'</span>'
       + '<span class="gt">'+esc(g.L.t)+'</span>'
       + '<span class="gsec">'+esc(gName(g.L.g))+'</span></div>';
      g.hits.slice(0,MAXH).forEach(function(s){
        var pct=Math.min(100,Math.max(0,s[0]/Math.max(g.L.d,1)*100));
        h+='<button class="hit" type="button" data-p="'+g.L.p+'" data-t="'+s[0]+'">'
         + '<span class="hitmeta"><span class="tc">'+mmss(s[0])+'</span>'
         + '<span class="axis"><i style="left:'+pct.toFixed(1)+'%"></i></span></span>'
         + '<span class="hittext">'+snippet(s[1],s[2]||q)+'</span></button>';
      });
      if(g.hits.length>MAXH)
        h+='<button class="hit" type="button" data-p="'+g.L.p+'" data-t="'+g.hits[MAXH][0]+'">'
         + '<span class="hittext" style="color:var(--muted)">…另有 '+(g.hits.length-MAXH)
         + ' 处，点此跳到第 '+(MAXH+1)+' 处</span></button>';
      h+="</div>";
    });
    if(r.groups.length>MAXG)
      h+='<div class="statline">仅显示前 '+MAXG+' 讲，请缩小范围或用分组筛选。</div>';
    results.innerHTML=h;
  }

  function renderEmpty(q){
    stat.innerHTML="";
    if(gSel!==null){
      var all=search(q,false);
      if(all.total){
        results.innerHTML='<div class="empty"><div class="big">「'+esc(q)
          + '」不在【'+esc(gName(gSel))+'】里</div><div>但在其他分组共有 <b>'
          + all.total+'</b> 处命中。</div><div class="altbox">'
          + '<button class="chip" type="button" id="clearg">清除分组筛选，搜索全部课程</button>'
          + '</div></div>';
        document.getElementById("clearg").onclick=function(){
          gSel=null; syncChips(); render();
        };
        return;
      }
    }
    var key=null;
    for(var k in ALT) if(k.toLowerCase()===q.toLowerCase()){key=k;break;}
    var h='<div class="empty"><div class="big">没有找到「'+esc(q)+'」</div>';
    if(key && ALT[key].length){
      h+='<div>课程讲了这个内容，但用的是别的说法：</div><div class="altbox">';
      ALT[key].forEach(function(a){
        h+='<button class="chip" type="button" data-alt="'+esc(a)+'">'+esc(a)+'</button>';});
      h+='</div>';
    } else if(key){
      h+='<div>这一项课程<b>确实没有讲</b>。MODELS 的 COMBINE / DIFFEQ / ZFUN / '
       + 'backtime / histdef 等属于未讲解规则。</div>';
    } else h+='<div>换个说法试试，或清空搜索框浏览全部课程。</div>';
    results.innerHTML=h+'</div>';
  }

  function renderBrowse(){
    var h='<h2 class="sech">按主题'+(MY.length?'　·　追加您搜过的专业术语':'')+'</h2><div class="topicgrid">';
    TOPICS.forEach(function(t){
      h+='<button class="topic" type="button" data-alt="'+esc(t[0])+'" title="'
       + esc(t[1])+'">'+esc(t[0])+'</button>';
    });
    MY.forEach(function(w){
      h+='<button class="topic user" type="button" data-alt="'+esc(w)+'" title="你搜过的词">'
       + esc(w)+'<span class="x" data-del="'+esc(w)+'" title="移除">×</span></button>';
    });
    h+='</div>';
    if(MODELS.length){
      // 按钮文字与搜索词可以不同：「JMarti模型」实际搜「JMarti」，覆盖讲师不带"模型"的说法
      h+='<h2 class="sech">按模型</h2><div class="topicgrid models">';
      MODELS.forEach(function(m){
        h+='<button class="topic" type="button" data-alt="'+esc(m[2])+'" title="'
         + esc(m[1])+'（搜索「'+esc(m[2])+'」）">'+esc(m[0])+'</button>';
      });
      h+='</div>';
    }
    GRP.forEach(function(g){
      if(gSel!==null && g.i!==gSel) return;
      h+='<h2 class="sech">'+esc(g.n)+' · '+g.c+' 讲</h2>';
      LEC.forEach(function(L){
        if(L.g!==g.i) return;
        h+='<div class="lecrow'+(L.p===curP?" on":"")+'" data-p="'+L.p+'" data-t="0">'
         + '<span class="pnum">P'+L.p+'</span>'
         + '<span class="lectitle">'+esc(L.t)+'</span>'
         + '<span class="lecdur">'+mmss(L.d)+'</span></div>';
      });
    });
    browse.innerHTML=h;
  }

  function onClick(e){
    var d=e.target.closest("[data-del]");
    if(d){ e.stopPropagation();
      var w=d.getAttribute("data-del");
      MY=MY.filter(function(x){return x!==w;}); mySave(MY); renderBrowse(); return; }
    var a=e.target.closest("[data-alt]");
    if(a){ qEl.value=a.getAttribute("data-alt");
           gSel=null; syncChips();   // 与手动输入一致：点主题词即搜索全部课程
           render(); qEl.focus();
           window.scrollTo({top:0,behavior:"smooth"}); return; }
    var b=e.target.closest("[data-p]");
    if(b) play(+b.getAttribute("data-p"), +b.getAttribute("data-t"));
  }
  results.addEventListener("click",onClick);
  browse.addEventListener("click",onClick);
  var timer=null;
  qEl.addEventListener("input",function(){
    if(qEl.value.trim() && gSel!==null) gSel=null;   // 一旦搜索就退出分组浏览
    syncChips();
    clearTimeout(timer); timer=setTimeout(render,90);
  });

  document.getElementById("theme").onclick=function(){
    var cur=document.documentElement.getAttribute("data-theme");
    var next=cur==="dark"?"light":cur==="light"?"dark"
      :(matchMedia("(prefers-color-scheme:dark)").matches?"light":"dark");
    document.documentElement.setAttribute("data-theme",next);
    try{localStorage.setItem("atp-theme",next);}catch(err){}
  };
  try{var sv=localStorage.getItem("atp-theme");
      if(sv) document.documentElement.setAttribute("data-theme",sv);}catch(err){}

  // 访问量统计（不蒜子）：只在线上加载；本地双击预览是 file:// 协议，不计数也不联网
  if(/^https?:$/.test(location.protocol)){
    document.getElementById("pvlocal").hidden=true;
    var bz=document.createElement("script");
    bz.async=true; bz.src="https://busuanzi.ibruce.info/busuanzi/2.3/busuanzi.pure.mini.js";
    document.head.appendChild(bz);
  }

  syncChips();
  render();
  play(1,0);
})();
</script>
</body>
</html>
