    var note=localHelper?'点击文件名后，将在 Windows 文件资源管理器中显示并选中该 ACP 文件。':(D.local?'浏览器直接打开 HTML 时禁用文件跳转；请双击“启动MODELS本地检索.vbs”。':'网页版本禁止访问或跳转到访问者计算机上的本地文件。');
    html+='</ol><div class="note" id="reveal-status">'+note+'</div>';acps.innerHTML=html;
  }
  acps.addEventListener("click",function(event){var link=event.target.closest("a[data-reveal]");if(!link)return;event.preventDefault();var status=document.getElementById("reveal-status");if(status)status.textContent="正在文件资源管理器中定位…";fetch(link.href,{cache:"no-store"}).then(function(response){if(!response.ok)throw new Error("reveal failed");if(status)status.textContent="已在文件资源管理器中显示并选中该 ACP 文件。"}).catch(function(){if(status)status.textContent="定位失败，请重新从本地启动器打开页面。"})});
  groups.addEventListener("click",function(event){var term=event.target.closest("a[data-key]");if(term){event.preventDefault();selectKeyword(term.dataset.key);return}var letter=event.target.closest("a[data-letter]");if(letter){event.preventDefault();selectKeyword(byLetter[letter.dataset.letter][0].id)}});
  document.getElementById("theme").onclick=function(){var root=document.documentElement,dark=root.getAttribute("data-theme")==="dark";root.setAttribute("data-theme",dark?"light":"dark")};
  selectKeyword(new URL(location.href).searchParams.get("k")||"combine");
})();
</script>
